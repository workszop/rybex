// ─── View: architecture ───
// ─── Go-live decisions (spec 4.12): four choices, each with its consequence; answers in team().arch.decisions = {id: option id} ───
// runWhere and the infrastructure chips are one model: answering runWhere writes arch.infra, the chips write the answer.
// A team's default (or earlier) infra alone is not an answer. No right or wrong marks: each consequence states the trade-off.
function GO_LIVE_DECISIONS(t=team()){const c=t.track==='complaints';return[
 {id:'runWhere',q:c?T('Reklamacje z danymi kontaktowymi klienta: gdzie ma działać model?','Complaints with the customer’s contact details: where should the model run?'):T('Gdzie ma działać model: w zakładzie czy w chmurze?','Where should the model run: in the plant or in the cloud?'),options:[
  {id:'local',t:T('Lokalnie, na serwerze w zakładzie','Locally, on a server in the plant'),fb:T('Dane klientów i zdjęcia z linii nie wychodzą z zakładu, więc rozmowa z działem RODO jest prosta. Za to serwer, aktualizacje i awarie są wasze: gdy serwer stanie w nocy, ktoś z IT musi przyjechać, a duży model językowy może tu działać wolniej albo wcale.','Customer data and line photos never leave the plant, so the talk with the data protection officer is simple. But the server, the updates and the breakdowns are yours: when the server stops at night someone from IT has to drive in, and a large language model may run slower here or not at all.')},
  {id:'cloud',t:T('W chmurze, przez API dostawcy','In the cloud, through the provider’s API'),fb:T('Najszybszy start i najmocniejsze modele, płacicie za użycie. Ale wszystko, co wysyłacie – reklamacja z imieniem, telefonem i adresem albo zdjęcie z linii – trafia do innej firmy, a bez łącza z internetem system przy linii nie działa.','The fastest start and the strongest models, you pay per use. But everything you send – a complaint with a name, a phone number and an address, or a photo from the line – goes to another company, and without an internet link the system by the line does not work.')},
  {id:'hybrid',t:T('Hybrydowo: wrażliwe lokalnie, reszta w chmurze','Hybrid: sensitive data locally, the rest in the cloud'),fb:T('Kompromis: to, co wrażliwe, zostaje w zakładzie, cięższe zadania idą do chmury. Płacicie złożonością: ktoś musi pilnować, co dokładnie przechodzi przez granicę, i utrzymywać dwa miejsca naraz.','A compromise: sensitive data stays in the plant, heavier jobs go to the cloud. You pay in complexity: someone has to watch exactly what crosses the boundary and keep two places running at once.')}]},
 {id:'stopAuthority',...STOP_DECISION(t)},
 {id:'monitor',q:T('Po wdrożeniu: co oglądacie co tydzień?','After go-live: what do you look at every week?'),options:[
  {id:'falseAlarms',t:T('Odsetek fałszywych alarmów','The share of false alarms'),fb:T('Widzicie, czy operatorzy nie toną w alarmach – gdy odsetek rośnie, przestaną na nie patrzeć. Nie zobaczycie za to przeoczeń: wada, której system nie zgłosił, nie trafia do żadnej statystyki alarmów.','You see whether the operators are drowning in alarms – when the share grows, they stop looking. What you will not see are the misses: a defect the system never flagged does not show up in any alarm statistic.')},
  {id:'refusals',t:T('Liczbę odmów asystenta','How often the assistant refuses'),fb:T('Rosnąca liczba odmów mówi, że pytania wyszły poza procedury albo dokumenty się zestarzały. Nie pokaże jednak odpowiedzi pewnych, a błędnych – te trzeba sprawdzać na próbce.','A growing number of refusals tells you the questions have moved beyond the procedures or the documents are out of date. It will not show the answers that are confident and wrong – you have to check those on a sample.')},
  {id:'photoDrift',t:T('Dryf jakości zdjęć','Drift in photo quality'),fb:T('Brudny obiektyw, nowe oświetlenie albo inna etykieta po cichu psują wyniki modelu. Patrząc na zdjęcia, zauważycie to, zanim przybędzie reklamacji, ale nie zobaczycie, ile alarmów było niepotrzebnych.','A dirty lens, new lighting or a different label quietly spoil the model’s results. Watching the photos you notice it before the complaints pile up, but you will not see how many alarms were unnecessary.')},
  {id:'nothing',t:T('Nic – system działa, nie ruszamy go','Nothing – the system works, we leave it alone'),fb:T('Nikt nie zauważy, że wyniki spadają: nowa etykieta, brudna kamera albo zmiana procedury psują system po cichu. Pierwszym sygnałem będzie kolejny zwrot partii z sieci.','Nobody will notice the results dropping: a new label, a dirty camera or a changed procedure quietly break the system. The first signal will be the next lot returned by a retail chain.')}]},
 {id:'reviewEvery',q:T('Jak często wracacie do oceny modelu?','How often do you go back and evaluate the model?'),options:[
  {id:'weekly',t:T('Co tydzień','Every week'),fb:T('Szybko łapiecie zmiany, ale ktoś musi co tydzień poświęcić godzinę na nowe przykłady i pomyłki. Bez wyznaczonej osoby ten przegląd zniknie z kalendarza po miesiącu.','You catch changes quickly, but someone has to spend an hour every week on new examples and mistakes. Without a named person this review drops out of the calendar within a month.')},
  {id:'quarterly',t:T('Raz na kwartał','Once a quarter'),fb:T('Mniej pracy i spokojny rytm. Jeśli jednak zmieni się etykieta albo dostawca puszek, system może się mylić tygodniami, zanim ktoś to zauważy – chyba że monitoring zgłosi to wcześniej.','Less work and a calm rhythm. But if the label or the can supplier changes, the system may be wrong for weeks before anyone notices – unless monitoring flags it earlier.')},
  {id:'never',t:T('Nie wracamy – oceniliśmy go przed startem','We don’t – we evaluated it before go-live'),fb:T('Ocena sprzed startu mówi, jak system działał na danych z warsztatu. Produkty, procedury i klienci się zmieniają, a bez ponownej oceny nikt nie powie, czy liczby z raportu są jeszcze prawdziwe.','The evaluation before go-live tells you how the system did on the workshop data. Products, procedures and customers change, and without a fresh evaluation nobody can say whether the numbers in the report still hold.')}]}]}
// Decision 2 follows the track: who confirms the system's output before it acts. Option ids stay system/operator/quality.
function STOP_DECISION(t){const k=t.track,hitl=!!t.arch.sel.hitl,o=(a,b,c)=>[{id:'system',t:a[0],fb:a[1]},{id:'operator',t:b[0],fb:b[1]},{id:'quality',t:c[0],fb:c[1]}],
 D={complaints:{q:T('Model proponuje kategorię i projekt odpowiedzi na reklamację. Kto zatwierdza odpowiedź, zanim trafi do klienta?','The model suggests a category and a draft reply to a complaint. Who approves the reply before it goes to the customer?'),lead:T('Błędna odpowiedź na reklamację o bezpieczeństwie żywności to sprawa dla działu jakości, nie dla szablonu.','A wrong reply to a food-safety complaint is a matter for the quality department, not for a template.'),options:o(
   [T('Tylko system – odpowiedź wychodzi sama','The system alone – the reply goes out by itself'),T('Klient dostaje odpowiedź od razu, bez kolejki w biurze obsługi. Ale gdy model źle odczyta zgłoszenie o zapachu albo wybrzuszonej puszce, klient dostanie uprzejmy szablon zamiast pilnej reakcji, a dział jakości o niczym się nie dowie. Gdy sieć zapyta, kto zatwierdził tę odpowiedź, odpowiedź brzmi: nikt.','The customer gets a reply at once, with no queue in customer service. But when the model misreads a complaint about a smell or a bulging can, the customer gets a polite template instead of an urgent response, and the quality department never hears of it. When the retail chain asks who approved that reply, the answer is: nobody.')],
   [T('Pracownik biura obsługi klienta','A customer service employee'),T('Pracownik czyta projekt odpowiedzi i poprawia go w minutę, więc pomyłka modelu nie wychodzi do klienta. Ale po zwrocie partii reklamacji przybywa i kolejka rośnie, a pracownik musi rozpoznać zgłoszenie o bezpieczeństwie żywności i wiedzieć, komu je przekazać.','The employee reads the draft reply and fixes it within a minute, so a model error never reaches the customer. But after a lot is returned the complaints pile up and the queue grows, and the employee has to recognise a food-safety complaint and know whom to pass it to.')],
   [T('Dział jakości','The quality department'),T('Najbardziej fachowa ocena, zwłaszcza zgłoszeń o bezpieczeństwie żywności. Ale dział jakości nie siedzi nad skrzynką reklamacji: odpowiedzi czekają dniami, a klient dzwoni ponownie. To pasuje do zgłoszeń oznaczonych jako zagrożenie, nie do wszystkich.','The most expert judgement, especially of food-safety complaints. But the quality department does not sit over the complaints inbox: replies wait for days and the customer calls again. This suits the complaints flagged as a hazard, not all of them.')])},
  rag:{q:T('Asystent odpowiada na pytanie o procedurę. Kto sprawdza odpowiedź, zanim pracownik zacznie według niej działać?','The assistant answers a question about a procedure. Who checks the answer before a worker acts on it?'),lead:T('Procedura wykonana według błędnej odpowiedzi trafia od razu na linię.','A procedure carried out from a wrong answer goes straight onto the line.'),options:o(
   [T('Nikt – pracownik działa od razu','Nobody – the worker acts at once'),T('Odpowiedź jest od razu, nocna zmiana nie czeka na nikogo. Ale gdy asystent pomyli procedurę albo poda starą wersję, pracownik wykona ją na linii, a w dokumentacji nie będzie śladu, kto ją sprawdził.','The answer comes at once, the night shift waits for nobody. But when the assistant mixes up a procedure or gives an old version, the worker carries it out on the line, and the records show no trace of who checked it.')],
   [T('Brygadzista zmiany','The shift supervisor'),T('Brygadzista zna linię i w kilka minut porówna odpowiedź ze źródłem, które wskazuje asystent. Ale to on bierze decyzję na siebie i musi mieć czas, żeby naprawdę zajrzeć do procedury, a nie tylko kliknąć „zgoda”.','The supervisor knows the line and within minutes compares the answer with the source the assistant points to. But the decision is theirs, and they need the time to actually open the procedure, not just click “OK”.')],
   [T('Dział jakości, właściciel procedur','The quality department, owner of the procedures'),T('Najpewniejsza kontrola, bo sprawdza ją autor procedur. Ale na nocnej zmianie nikogo z jakości nie ma, a pytanie o mycie albo przezbrojenie czeka do rana. To pasuje do pytań o bezpieczeństwo żywności, nie do codziennych.','The surest check, because the author of the procedures does it. But on the night shift nobody from quality is there, and a question about cleaning or a changeover waits until morning. This suits questions about food safety, not everyday ones.')])},
  forecast:{q:T('Prognoza zasila plan produkcji na kolejne miesiące. Kto zatwierdza plan, zanim pójdzie na linię?','The forecast feeds the production plan for the coming months. Who approves the plan before it goes to the line?'),lead:T('Plan zbudowany na złej prognozie to pełny magazyn albo puste półki w sezonie.','A plan built on a wrong forecast means a full warehouse or empty shelves in the season.'),options:o(
   [T('Tylko system – plan wynika wprost z prognozy','The system alone – the plan follows straight from the forecast'),T('Plan jest gotowy od razu i nikt nie musi go przeliczać. Ale prognoza nie zna promocji, nowej sieci ani kłopotów dostawcy: gdy się pomyli, zakład wyprodukuje za dużo puszek albo zabraknie ich w sezonie, a nikt nie będzie wiedział, kto ten plan przyjął.','The plan is ready at once and nobody has to recalculate it. But the forecast knows nothing of promotions, a new retail chain or a supplier’s trouble: when it is wrong the plant makes too many cans or runs out in the season, and nobody will know who accepted the plan.')],
   [T('Planista produkcji','The production planner'),T('Planista patrzy na prognozę i poprawia ją o to, co wie od handlowców, więc plan łączy liczby z wiedzą o rynku. Ale musi rozumieć, jak duży jest błąd prognozy, i mieć prawo ją zmienić – inaczej tylko podpisuje to, co policzył system.','The planner looks at the forecast and corrects it with what the sales team knows, so the plan joins the numbers with knowledge of the market. But they have to understand how large the forecast error is and have the right to change it – otherwise they only sign what the system calculated.')],
   [T('Kierownik zakładu ze sprzedażą','The plant manager with sales'),T('Decyzja zapada wyżej i bierze pod uwagę sprzedaż i zapasy. Ale spotkanie trzeba zwołać, a plan czeka; w sezonie kilka dni zwłoki to puste półki albo pełny magazyn. To pasuje do dużych zmian planu, nie do każdej poprawki.','The decision is taken higher up and weighs sales and stock. But the meeting has to be called and the plan waits; in the season a few days of delay mean empty shelves or a full warehouse. This suits large changes to the plan, not every correction.')])},
  maint:{q:T('Alarm z czujników wskazuje awarię retortu albo pompy. Kto decyduje o zatrzymaniu maszyny?','A sensor alarm points to a retort or pump failure. Who decides to stop the machine?'),lead:T('Retort zatrzymany w połowie cyklu to zablokowana partia, a przeoczona awaria to zepsuta maszyna.','A retort stopped halfway through a cycle means a blocked lot, and a missed failure means a broken machine.'),options:o(
   [T('Tylko system – maszyna staje sama','The system alone – the machine stops by itself'),T('Maszyna staje od razu, zanim awaria się rozwinie. Ale każdy fałszywy alarm przerywa cykl sterylizacji, a partię z przerwanego cyklu trzeba zablokować. Gdy ktoś zapyta, kto zatrzymał retort, odpowiedź brzmi: nikt.','The machine stops at once, before the failure develops. But every false alarm breaks off a sterilisation cycle, and the lot from a broken-off cycle has to be blocked. When someone asks who stopped the retort, the answer is: nobody.')],

   [T('Dział utrzymania ruchu','The maintenance department'),T('Najbardziej fachowa diagnoza, ale mechanik nie stoi przy każdej maszynie. W nocy ktoś musi go wezwać, a maszyna w tym czasie pracuje dalej z narastającą usterką. To pasuje do rzadkich, nietypowych alarmów.','The most expert diagnosis, but the mechanic is not standing by every machine. At night someone has to call them in, and meanwhile the machine keeps running with a growing fault. This suits rare, unusual alarms.')])}},

 return'﻿'+[...part(T('Lokalne sloty','Local slots'),T('Zespół','Team'),trSlotRows()),'',...part(T('Wczytane pliki','Imported files'),T('Zespół – plik','Team – file'),trFileRows())].join('\r\n')+'\r\n'}
// X.trRes keeps what happened (counts, skipped names and reasons); trMsg() words it in the current language.
const TR_MAX=5*1024*1024;
function trMsg(){const r=X.trRes;if(!r)return'';if(r.cleared)return T('Lista wyczyszczona.','List cleared.');
 const why={json:T('nieprawidłowy JSON','invalid JSON'),app:T('to nie plik zespołu z tej aplikacji','not a team file from this app'),read:T('nie udało się odczytać pliku','the file could not be read'),big:T('plik większy niż 5 MB','file larger than 5 MB')};
 return`${T(`Wczytano plików: ${r.n}.`,`Files loaded: ${r.n}.`)}${r.bad.length?' '+T('Pominięto','Skipped')+': '+r.bad.map(([n,w])=>`${n} (${why[w]})`).join(', ')+'.':''}`}
async function trImport(files){const bad=[];let n=0;X.trFiles=X.trFiles||[];
 for(const f of files){let txt,o;if(f.size>TR_MAX){bad.push([f.name,'big']);continue}
  try{txt=await f.text()}catch(e){bad.push([f.name,'read']);continue}
  try{o=JSON.parse(txt)}catch(e){bad.push([f.name,'json']);continue}
  if(!isObj(o)||o.app!==APP_ID||!isObj(o.data)){bad.push([f.name,'app']);continue}
  const row={file:f.name,team:normTeam(o.data)},i=X.trFiles.findIndex(x=>x.file===f.name);if(i>=0)X.trFiles[i]=row;else X.trFiles.push(row);n++}
 X.trRes={n,bad};trPaintFiles()}
// Updates the file table, the clear button and the status line in place: the file input keeps focus and the
// live region announces the new text.
function trPaintFiles(){if(S.view!=='trainer'||!$('#trFilesBox'))return;$('#trFilesBox').innerHTML=trTable('trFiles',T('Zespół – plik','Team – file'),trFileRows(),T('Brak wczytanych plików.','No files loaded.'));
 $('#trClear').disabled=!(X.trFiles||[]).length;$('#trStatus').textContent=trMsg();$('#trImport').focus()}
function vTrainer(){const fn=X.trFiles||[];
 mainEl.innerHTML=pageHead(T('Tryb prowadzącego','Trainer mode'),'',`<p class="edu-lead" id="trIntro">${T('Tryb prowadzącego: wczytaj pliki zespołów, żeby zobaczyć, kto zrobił baseline, ile razy oglądano test i czy uzupełniono uzasadnienie. Nie porównujemy surowego F1 na teście na forum grupy.','Trainer mode: load the team files to see who ran the baseline, how many times the test set was viewed and whether the justification was filled in. We do not compare raw test-set F1 in front of the group.')}</p>`)
  +`<section class="sec"><h2 class="sr-only">${T('Postęp zespołów','Team progress')}</h2><div class="wrap">`+card('users',T('Zespoły na tej przeglądarce (sloty 1–8)','Teams in this browser (slots 1–8)'),trTable('trSlots',T('Zespół','Team'),trSlotRows(),''),{tone:'blue'})
  +`<div class="mt">${card('upload',T('Wczytane pliki zespołów','Imported team files'),`<p class="edu-small">${T('Wybierz kilka plików JSON naraz. Pliki zostają tylko w pamięci tej karty: nie trafiają do żadnego slotu i znikają po zamknięciu strony. Ten sam plik wczytany ponownie zastępuje swój wiersz.','Select several JSON files at once. The files stay only in this tab’s memory: they are not written to any slot and are gone when the page closes. Loading the same file again replaces its row.')}</p>
 <div class="field mt"><label for="trImport">${T('Pliki zespołów (JSON)','Team files (JSON)')}</label><input type="file" id="trImport" class="input" accept="application/json,.json" multiple></div>
 <p class="hint" id="trStatus" aria-live="polite">${esc(trMsg())}</p><div class="mt" id="trFilesBox">${trTable('trFiles',T('Zespół – plik','Team – file'),trFileRows(),T('Brak wczytanych plików.','No files loaded.'))}</div>`,{tone:'yellow',foot:`<button type="button" class="btn-ghost btn-sm" id="trClear"${fn.length?'':' disabled'}>${ic('trash-2')}${T('Wyczyść listę','Clear the list')}</button>`})}</div>`
  +`<div class="mt">${card('download',T('Eksport','Export'),`<p class="edu-small">${T('Plik CSV z obiema tabelami (średniki, kodowanie UTF-8) otworzy się w Excelu. Nie zawiera kodu zajęć ani notatek zespołów.','A CSV file with both tables (semicolons, UTF-8) opens in Excel. It contains no class code and no team notes.')}</p>`,{tone:'green',foot:`<button type="button" class="btn" id="trCsv">${ic('download')}${T('Pobierz CSV','Download CSV')}</button>`})}</div></div></section>`;
 $('#trImport').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)trImport(f)};
 $('#trClear').onclick=()=>{X.trFiles=[];X.trRes={cleared:true};trPaintFiles()};
 $('#trCsv').onclick=()=>dl('rybex_trainer.csv',trCSV(),'text/csv;charset=utf-8');
 icons(mainEl)}
// ─── Listeners ───
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)go(b.dataset.v)});
$('#teamSel').onchange=e=>{const v=+e.target.value;if(S.example){e.target.value=S.team;return}if(AIS.run)e.target.value=S.team;guardRun(()=>{S.team=v;save();render()})};
$('#tbToggle').onclick=()=>{const b=$('#teamBar'),on=b.classList.toggle('open');$('#tbToggle').setAttribute('aria-expanded',on);renderProg()};
MOBILE_MQ.addEventListener('change',()=>{if(!isTyping()&&!inspEl.open)softRender()});
$('#teamName').oninput=e=>{team().name=e.target.value;const on=$('#onboardName');if(on)on.value=e.target.value;save();renderTeamOptions();renderProg();const h=$('#main .app-title');if(S.view==='data'&&h)h.textContent=`${T('Folder zespołu','Team folder')} – ${team().name||T('Zespół','Team')+' '+S.team}`};
$('#teamExport').onclick=exportTeam;$('#teamImport').onclick=()=>$('#teamFile').click();
$('#teamFile').onchange=e=>{const f=e.target.files[0];if(f)importTeam(f);e.target.value=''};
$$('#langSeg button').forEach(b=>b.onclick=()=>guardRun(()=>{S.lang=b.dataset.l;if(S.example)exTeam=buildExample();save();render();const a=$(`#langSeg button[data-l=${S.lang}]`);if(a)a.focus()}));
toastEl.addEventListener('mouseenter',()=>{clearTimeout(toastTimer);toastEl.dataset.paused='true'});toastEl.addEventListener('focusin',()=>{clearTimeout(toastTimer);toastEl.dataset.paused='true'});
toastEl.addEventListener('mouseleave',()=>{if(!toastEl.contains(document.activeElement)){toastEl.dataset.paused='false';armToast()}});toastEl.addEventListener('focusout',e=>{if(!toastEl.contains(e.relatedTarget)&&!toastEl.matches(':hover')){toastEl.dataset.paused='false';armToast()}});
inspEl.addEventListener('click',e=>{if(e.target===inspEl)inspEl.close()});
$('#skip').onclick=e=>{e.preventDefault();mainEl.focus()};
addEventListener('hashchange',onHashChange);
addEventListener('load',()=>icons());
addEventListener('storage',e=>{if(e.key!==STORE_KEY||!e.newValue)return;if(AIS.run){X.storagePending=X.renderPending=true;return}try{const x=JSON.parse(e.newValue);S.teams=normTeams(x.teams)}catch(err){return}if(!isTyping()&&!inspEl.open)softRender();else renderProg()});
addEventListener('resize',setHdrH);addEventListener('resize',queueToastPlace);addEventListener('scroll',queueToastPlace,{passive:true});if(window.ResizeObserver)new ResizeObserver(queueToastPlace).observe(toastEl);
// The sticky bars change height without a resize (wrapping text, fonts, the case bar appearing): keep the offsets exact.
if(window.ResizeObserver){const ro=new ResizeObserver(()=>setHdrH());['.edu-header','#pathBar','#caseBar'].forEach(s=>{const e=$(s);if(e)ro.observe(e)})}
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||inspEl.open)return;const a=e.target,tag=a.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||a.isContentEditable)return;const i=+e.key;if(i>=1&&i<=NAV.length){e.preventDefault();go(NAV[i-1][0])}});

(function init(){S.trainer=new URLSearchParams(location.search).get('trainer')==='1';document.body.dataset.trainer=String(S.trainer);const r=parseHash();if(r){S.view=r.v;routeSub(r);siteVisit()}else{try{history.replaceState(null,'',hashFor(S.view))}catch(e){location.hash=hashFor(S.view)}}
 normHash();render();
 const BRAND_FONTS=['400 1em Outfit','700 1em Outfit','400 1em "IBM Plex Sans"','600 1em "IBM Plex Sans"','400 1em "Roboto Mono"'];
 Promise.race([Promise.all(BRAND_FONTS.map(f=>document.fonts.load(f).catch(()=>null))),new Promise(res=>setTimeout(res,FONT_WAIT_MS))]).then(()=>document.documentElement.classList.add('app-ready'))})();
