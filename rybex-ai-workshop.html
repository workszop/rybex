<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* ---- Functional ---- */
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

:where(.edu) h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

</style>
<style>
/* ─── Layout tokens ─── */
:root{--gutter:clamp(16px,4vw,72px)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr-h,84px) + 12px)}
body{margin:0;font-size:var(--body);line-height:1.55}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid transparent;outline-offset:2px;box-shadow:var(--focus-ring)}
.skip{position:absolute;left:12px;top:8px;z-index:100;transform:translateY(-200%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r-md);font-weight:600;text-decoration:none}
.skip:focus{transform:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:18px;height:18px;flex:none}
p{margin:6px 0}

/* ─── Top menu ─── */
.edu-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line-2)}
.edu-header-inner{padding:0 var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:0;color:inherit;text-decoration:none}
.edu-logo{width:64px;height:64px;display:block;margin-right:-6px}
.edu-wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.nav{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:wrap}
.nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:var(--r-pill);cursor:pointer;font-weight:500;font-size:15px;white-space:nowrap;transition:background-color .15s}
.nav button:hover{background:var(--paper-2)}
.nav button.on{background:var(--yellow);color:var(--yellow-ink);font-weight:600}
.edu-seg{display:inline-flex;gap:2px;padding:3px;background:var(--paper-2);border-radius:var(--r-pill)}
.edu-seg button{border:0;background:transparent;padding:6px 12px;border-radius:var(--r-pill);font-weight:600;color:var(--ink-2);cursor:pointer;min-width:42px}
.edu-seg button.on{background:var(--yellow);color:var(--yellow-ink)}

/* ─── Team bar ─── */
.teambar{background:var(--paper-2);border-bottom:1px solid var(--line);padding:12px var(--gutter);display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.field{min-width:0}
.field>label,.field>.label{display:block;margin-bottom:6px;font-family:var(--font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.input{width:100%;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.input[aria-invalid=true]{border-color:var(--red-600)}
.input:disabled{background:var(--paper-3);color:var(--ink-2);cursor:not-allowed}
.teambar .f-team{width:auto;min-width:150px;max-width:340px}.teambar .f-name{flex:1 1 220px;max-width:420px}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap}
.tb-prog{flex:1 1 220px;min-width:200px;max-width:360px}
.bd-strip{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}
.bd{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r-pill);border:1px dashed var(--line-strong);color:var(--ink-3)}
.bd.on{border:1px solid var(--ink);background:var(--yellow);color:var(--yellow-ink)}
.bd .ic,.bd svg{width:15px;height:15px}
.bd-list{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bd-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.bd-item.on{border:1px solid var(--ink);background:var(--paper-2)}
.bd-item>svg,.bd-item>.ic{flex:none;margin-top:3px;color:var(--ink-3)}.bd-item.on>svg,.bd-item.on>.ic{color:var(--ink)}
.bd-name{margin:0}
.teambar .tb-toggle{display:none}
.bar{height:10px;border-radius:var(--r-pill);background:var(--paper-3);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:var(--r-pill)}
.hint{font-size:var(--caption);color:var(--ink-3);margin:4px 0 0}
.pathbar{position:sticky;top:var(--hdr-top,0px);z-index:45;background:var(--paper);border-bottom:1px solid var(--line-2)}
.pb-in{padding:6px var(--gutter);display:flex;align-items:center;gap:8px 16px;min-height:44px}
.pb-dots{display:flex;gap:4px;margin:0;padding:0;list-style:none;flex:none}.pb-dots li{width:10px;height:10px;border-radius:50%;background:var(--paper-3);border:1px solid var(--line-2)}.pb-dots li.done{background:var(--green);border-color:var(--green)}.pb-dots li.na{border-style:dashed;background:transparent}.pb-dots li.cur{outline:2px solid var(--ink);outline-offset:1px}
.pb-txt{margin:0;flex:1;min-width:0;font-size:var(--body-sm)}.pb-min{color:var(--ink-3)}
#pathNext{flex:none;margin-left:auto}
.pathbar:has(.ex-bar){background:var(--yellow-soft);color:var(--yellow-ink);border-bottom-color:var(--yellow-600)}.ex-bar .ex-tag{flex:none;background:var(--paper);border:1px solid var(--ink)}#exampleExit{flex:none;margin-left:auto}
.ex-entry{align-items:center;gap:10px 14px;margin:18px 0 0}.ex-entry .hint{margin:0}.tb-lock{flex:1 1 100%;margin:0}
.savewarn{background:var(--red-soft);color:var(--red-ink);padding:10px var(--gutter);font-weight:600}
.savewarn[hidden]{display:none}

/* ─── Page structure ─── */
.page-head{padding:34px var(--gutter) 36px;border-bottom:1px solid var(--line-2)}
.page-head:has(+ .sec){border-bottom:0;padding-bottom:30px}
.app-title{font-family:var(--font-display);font-weight:800;font-size:clamp(2.3rem,5vw,3.3rem);letter-spacing:-.025em;line-height:1.05;color:var(--ink);margin:0 0 12px;overflow-wrap:anywhere}
.edu-lead{font-size:1.15rem;line-height:1.6;color:var(--ink-2);margin:0}
.sec{padding:36px 0 44px;border-top:1px solid var(--line)}
.sec:nth-of-type(odd){background:var(--paper-2)}
.wrap{padding:0 var(--gutter)}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sec-head h2{margin:0}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mt{margin-top:18px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ─── Tones and badges ─── */
.tone-grape{background:var(--grape-soft);color:var(--grape-ink)}
.tone-blue{background:var(--blue-soft);color:var(--blue-ink)}
.tone-yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.tone-green{background:var(--green-soft);color:var(--green-ink)}
.tone-red{background:var(--red-soft);color:var(--red-ink)}
.tone-ink{background:var(--ink);color:var(--paper)}
.tone-stone{background:var(--paper-3);color:var(--ink)}
.badge{flex:none;width:34px;height:34px;border-radius:var(--r-sm);display:inline-grid;place-items:center}
.badge-lg{width:46px;height:46px;border-radius:var(--r-md)}
.badge-lg .ic{width:24px;height:24px}
.badge.tone-ink{color:var(--yellow)}
.tile-h{display:flex;align-items:center;gap:12px;min-width:0}
.tile-h h3{margin:0;font-size:18px;line-height:1.3}
.tile-h h2{margin:0;font-size:18px;line-height:1.3}
.memo{max-width:860px}.memo-meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 14px;font-size:var(--body-sm)}.memo-meta dt{color:var(--ink-3);font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;align-self:center}.memo-meta dd{margin:0}.memo p{margin:0 0 10px}
#onboard{max-width:860px;margin-bottom:18px}#onboard ol{margin:10px 0 0;padding-left:22px}#onboard p{margin:0 0 6px}.ob-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px 32px}
.sec.ob-sec{padding-top:20px}
@media (min-width:1100px){.ob-pair:has(#onboard){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.ob-pair #onboard{margin:0}.ob-pair:has(#onboard) .ob-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:768px){.ob-grid{grid-template-columns:1fr}}
#briefReq>summary{cursor:pointer;font-weight:600;font-size:18px;padding:4px 0}#briefReq>.grid3{margin-top:14px}

/* ─── Cards ─── */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card-head{padding:12px 20px;background:var(--paper-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-body{padding:18px 20px;flex:1;min-width:0}
.card-foot{padding:12px 20px;border-top:1px dashed var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flush{padding:0}
.well{background:var(--paper-2);border-radius:var(--r-md);padding:14px 16px}
.callout{border-radius:var(--r-md);padding:14px 18px}
.group-hero{border-radius:var(--r-xl);padding:22px 28px;display:grid;grid-template-columns:1fr 240px;gap:28px;align-items:center}
.group-hero .edu-overline{color:inherit;margin:0 0 6px}
.gh-title{font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 6px}
.gh-num{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1}
.gh-bar{height:10px;border-radius:var(--r-pill);background:color-mix(in srgb,currentColor 24%,transparent);overflow:hidden;margin-top:6px}
.gh-bar span{display:block;height:100%;background:currentColor;border-radius:var(--r-pill)}
.group-hero.tone-ink .edu-overline,.group-hero.tone-ink .gh-num{color:var(--yellow)}

/* ─── Buttons and chips ─── */
.btn,.btn-ghost,.btn-ink{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);padding:9px 18px;font-family:var(--font-display);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background-color .15s}
.btn{background:var(--yellow);color:var(--on-primary);border:1px solid var(--yellow)}
.btn:hover{background:var(--yellow-600)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--paper-2)}
.btn-ink{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.btn[disabled],.btn-ghost[disabled],.btn-ink[disabled]{background:var(--paper-3);color:var(--ink-2);border-color:var(--line-2);cursor:not-allowed}
.btn-sm{padding:5px 12px;font-size:13.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--blue-600);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;text-align:left}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;font-weight:500;transition:background-color .15s}
.tabs button:hover{background:var(--paper-2)}
.tabs button.on{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-pill);padding:5px 12px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;text-align:left;transition:background-color .15s}
.chip:hover{background:var(--paper-2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip svg.sw{background:var(--paper);border-radius:3px}
.edu-chip{display:inline-block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.tr-chip{text-decoration:none}.tr-chip[hidden]{display:none}

/* ─── Stat blocks ─── */
.stat{border-radius:var(--r-md);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.15}
.stat>span{font-size:13px;display:block}
.stat.neutral{background:var(--paper-3);color:var(--ink)}

/* ─── Tables ─── */
.tscroll{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-md);max-width:100%}
.tscroll.tall{max-height:380px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;padding:9px 12px;background:var(--paper-3);border-bottom:1px solid var(--line-2);font-family:var(--font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);vertical-align:bottom}
.tall th{position:sticky;top:0;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--paper-2)}
tbody tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.best td,tr.best td:first-child{background:var(--ink);color:var(--paper)}
tr.err td{background:var(--paper-3)}
tr.sel td,tr.sel td:first-child{background:var(--yellow);color:var(--yellow-ink)}
tr[data-i]{cursor:pointer}
.conf{width:auto;margin-top:10px}
.headline>.grid2{gap:12px}
.cmp-list{list-style:none;margin:0;padding:0}.cmp-list li{padding:6px 0;border-bottom:1px solid var(--line)}.cmp-list label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.cmp-list input{margin-top:4px;flex:none}.cmp{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;overflow-wrap:anywhere;background:var(--paper)}.cmp-col h4{margin:0 0 4px}.cmp .recap{border:1px solid var(--ink);border-radius:var(--r-sm)}.cmp-m{margin:4px 0 0;padding-left:18px}.cmp-v{margin:8px 0 0}
.recap{margin:10px 0 0;padding:8px 12px;border:1px solid var(--ink);background:var(--paper-3);border-radius:var(--r-sm);line-height:1.5}
details.more-metrics{margin-top:10px}
details.more-metrics>summary{cursor:pointer;font-weight:600;font-size:var(--caption)}
details.more-metrics>.grid3,details.more-metrics>.grid4{margin-top:8px}

/* ─── Sliders ─── */
input[type=range]{width:100%;height:24px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--track);border-radius:var(--r-pill)}
input[type=range]::-moz-range-track{height:8px;background:var(--track);border-radius:var(--r-pill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-6px;background:var(--surface);border:2px solid var(--ink);border-radius:50%;box-shadow:var(--shadow-sm)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--surface);border:2px solid var(--ink);border-radius:50%}
input[type=range]:disabled{cursor:not-allowed;opacity:.5}
input[type=range]:focus-visible{box-shadow:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:var(--focus-ring)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:var(--focus-ring)}
.ctl{min-width:0}.ctl label{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.ctl output{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);width:17px;height:17px;vertical-align:-3px}

/* ─── Agenda timeline ─── */
.g-row{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit;transition:background-color .15s}
.g-row:first-child{border-top:0}
.g-row:hover{background:var(--paper-2)}
.g-label{display:flex;align-items:center;gap:12px;min-width:0}
.g-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ink);line-height:1.25;display:block}
.g-time{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.g-track{position:relative;display:block;height:22px;background:var(--paper-3);border-radius:var(--r-pill)}
.g-bar{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:var(--r-pill)}

/* ─── Data folder ─── */
.folder{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.tree{display:flex;flex-direction:column;gap:2px}
.tree .dir{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--ink);margin-top:10px;padding:2px 6px}
.tree .dir:first-child{margin-top:0}
.tree button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:6px 8px 6px 18px;cursor:pointer;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere;transition:background-color .15s}
.tree button:hover{background:var(--paper-2)}
.tree button.on{background:var(--yellow);color:var(--yellow-ink);font-weight:600}
pre{background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:var(--r-sm);overflow:auto;font-family:var(--font-mono);font-size:12.5px;white-space:pre-wrap;margin:0}
pre.tall{max-height:420px}

/* ─── Charts and diagrams ─── */
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:8px 0;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.diagram{overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto}
.sq{width:22px;height:22px;display:inline-block;margin:1px;border-radius:5px;border:2px solid transparent;background:var(--blue-soft)}
.sq.t{background:var(--yellow)}.sq.bad{border-color:var(--red-600)}.sq.dup{outline:2px dashed var(--ink);outline-offset:1px}
.squares{max-width:300px;line-height:0}
.sq.key{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

/* ─── Gallery ─── */
.gal{display:flex;flex-wrap:wrap;gap:8px}
.thumb{background:var(--surface);border:3px solid var(--line-2);border-radius:var(--r-sm);padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;width:96px}
.thumb img{display:block;width:100%;height:112px;object-fit:contain;background:var(--paper-2)}
.thumb span{font-family:var(--font-mono);font-size:11px;padding:2px 4px;background:var(--paper-2);color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb.tp{border-color:var(--green-600)}.thumb.fn{border-color:var(--red-600)}.thumb.fp{border-color:var(--yellow)}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:6px 0 10px;color:var(--ink-2)}
.keyrow i{display:inline-block;width:14px;height:14px;border:3px solid var(--line-2);border-radius:4px;vertical-align:-2px;margin-right:5px}
.keyrow .tp{border-color:var(--green-600)}.keyrow .fn{border-color:var(--red-600)}.keyrow .fp{border-color:var(--yellow)}
dialog{border:1px solid var(--line-2);border-radius:var(--r-lg);padding:0;max-width:min(680px,calc(100vw - 32px));box-shadow:var(--shadow-lg);color:var(--ink)}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.insp{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
.insp img{width:240px;height:300px;display:block;object-fit:contain;background:var(--paper-2);border-radius:var(--r-sm);border:1px solid var(--line-2)}

/* ─── Chat ─── */
.chat{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto;padding:2px}
.msg{padding:9px 13px;border-radius:var(--r-md);max-width:85%;font-size:15px}
.msg.u{background:var(--ink);color:var(--paper);margin-left:auto}
.msg.a{background:var(--paper-3);color:var(--ink)}
.msg .meta{font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chatbar{display:flex;gap:8px;margin-top:10px}

/* ─── AI model calls ─── */
.ai-slot{margin-bottom:18px}
.ai-grid{align-items:end}
.ai-run{margin-top:12px}
.ai-run progress{width:180px;height:10px;accent-color:var(--ink)}
.ai-run[hidden]{display:none}
.ai-cost{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.seg-mode{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.prompt-edit{font-family:var(--font-mono);font-size:13px;line-height:1.45;width:100%}
#visDetail{position:sticky;top:calc(var(--hdr-h,84px) + 12px);align-self:start}
@media (max-width:768px){#visDetail{position:static}}

/* ─── Chain and steps ─── */
.quiz .qz-q{margin:0 0 18px}.quiz .qz-q:last-of-type{margin-bottom:6px}.quiz .qz-t{font-weight:600;margin:0 0 8px}
.quiz .qz-opts{display:grid;gap:8px}.quiz .qz-o{justify-content:flex-start;text-align:left;border-radius:var(--r-md);font-family:inherit;font-weight:500;font-size:15px}
.quiz .qz-o.sel.ok{background:var(--green-soft);border-color:var(--green-ink);color:var(--green-ink)}.quiz .qz-o.sel.no{background:var(--red-soft);border-color:var(--red-ink);color:var(--red-ink)}.quiz .qz-o[aria-disabled=true]{cursor:default}
.quiz .qz-fb{margin:10px 0 0;padding:8px 12px;border:2px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md)}.quiz .qz-fb:empty{display:none}.quiz [data-state=right] .qz-fb{border-color:var(--green-600)}.quiz [data-state=wrong] .qz-fb{border-color:var(--red-600)}
#riskDemo .persona{margin:0 0 14px}#riskDemo .rk-q{font-weight:600;margin:0 0 8px}#riskDemo .rk-opts{display:grid;gap:8px}#riskDemo .rk-o{justify-content:flex-start;text-align:left;border-radius:var(--r-md);font-family:inherit;font-weight:500;font-size:15px;white-space:normal;height:auto}#riskDemo .rk-o.sel{background:var(--paper-2);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}#riskDemo .rk-o.sel:focus-visible{box-shadow:inset 0 0 0 1px var(--ink),var(--focus-ring)}
#goLive .persona{margin:0 0 12px}#goLive .gl-lead{margin:0 0 4px}#goLive .gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}#goLive .gl-d>.card{height:100%}#goLive .gl-note{margin:0 0 10px}#goLive .gl-note .hint{margin:0}#goLive .gl-note .gl-fix{margin-top:8px}#goLive .gl-opts{display:grid;gap:8px}#goLive .gl-o{justify-content:flex-start;text-align:left;border-radius:var(--r-md);font-family:inherit;font-weight:500;font-size:15px;white-space:normal;height:auto}#goLive .gl-o.sel{background:var(--paper-2);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}#goLive .gl-o.sel:focus-visible{box-shadow:inset 0 0 0 1px var(--ink),var(--focus-ring)}
#goLive .fb{margin:10px 0 0;padding:8px 12px;border:1px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md)}#goLive .fb:empty{display:none}#goLive .gl-warn:empty{display:none}#goLive .gl-warn{margin:10px 0 0}#goLive .gl-w{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;padding:8px 12px;border:1px solid var(--red-600);background:var(--paper);border-radius:var(--r-md);font-weight:500}#goLive .gl-fix{gap:8px}#goLive .gl-w .ic{flex:none;margin-top:3px;color:var(--red-600)}#goLive [data-fix]{white-space:normal;height:auto;text-align:left}
@media (max-width:900px){#goLive .gl-list{grid-template-columns:1fr}}
/* Challenge under the prototype ("find the system's limits"): folded, full contour in the accent colour; its title on a line of its own */
.challenge{margin-top:20px;border:2px solid var(--grape);border-radius:var(--r-lg);background:var(--surface)}.challenge[data-state=done]{border-color:var(--green-600)}
.challenge>details>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:14px 18px;font-weight:600;font-size:17px}.challenge .ch-k{color:var(--ink-2)}.challenge .ch-chip{margin-left:auto}.challenge .ch-t{order:3;flex:1 0 100%;padding-left:26px;font-weight:500}
.challenge .ch-body{padding:0 18px 16px}.challenge .ch-task{margin:0 0 12px}.challenge .status{margin:0;padding:8px 12px;border:1px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md);font-weight:500}
.challenge .result{margin:10px 0 0;padding:8px 12px;border:1px solid var(--green-600);border-radius:var(--r-md)}.challenge .result:empty{display:none}
#riskDemo .fb{margin:10px 0 0;padding:8px 12px;border:2px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md)}#riskDemo .fb:empty{display:none}#riskDemo [data-state=good] .fb{border-color:var(--green-600)}#riskDemo [data-state=other] .fb{border-color:var(--yellow)}#riskDemo .rk-note{margin:10px 0 0}#riskDemo .rk-link{margin:12px 0 0}#riskDemo .rk-link a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;text-underline-offset:3px}
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 26px}
.link{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;line-height:1.35;transition:background-color .2s,color .2s,border-color .2s}
.link:not(:last-child)::after{content:"→";position:absolute;left:100%;top:50%;transform:translateY(-50%);width:26px;text-align:center;font-family:var(--font-mono);color:var(--ink-2)}
.link.on{background:var(--yellow);color:var(--on-primary);border-color:var(--yellow);font-weight:600}
.lane{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.lane:first-child{border-top:0}
.lane>b{font-size:14px;color:var(--ink);padding-top:6px}
.mlist label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}

/* ─── Toast ─── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:11px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-lg);z-index:100;max-width:calc(100vw - 32px);flex-wrap:wrap}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--yellow);font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.toast .toast-bd{display:block;margin-top:4px}.toast .toast-x{color:var(--paper);text-decoration:none;display:inline-flex;align-items:center}
body.has-toast #main{padding-bottom:96px}
@media (min-width:1024px){.toast{left:auto;right:24px;transform:none;max-width:min(420px,calc(100vw - 48px))}}
/* ─── Jump links and glossary ─── */
.jump{position:sticky;top:var(--hdr-h,0px);z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.jump .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
.gloss{position:relative;border-bottom:1px dotted currentColor;cursor:help}
.gloss-tip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:60;width:max-content;max-width:min(320px,90vw);background:var(--ink);color:var(--paper);font:400 13px/1.4 var(--font-sans);text-transform:none;letter-spacing:0;padding:8px 10px;border-radius:var(--r-sm);box-shadow:var(--shadow-lg);white-space:normal;text-align:left}
.gloss:hover .gloss-tip,.gloss:focus .gloss-tip{display:block}
.gloss.gl-off .gloss-tip{display:none}
#saveBase[aria-disabled=true]{opacity:.7;cursor:default}
.gloss-tip.up{top:auto;bottom:calc(100% + 6px)}

.foot{padding:18px var(--gutter);border-top:1px solid var(--line);color:var(--ink-3);font-size:var(--caption)}
kbd{font-family:var(--font-mono);font-size:12px;background:var(--paper-3);padding:1px 6px;border-radius:var(--r-xs);color:var(--ink)}

/* ─── Responsive ─── */
@media (max-width:1100px){.grid4.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:768px){
 .edu-header{position:static}
 .pb-dots,.pb-hint,.pb-min{display:none}.pb-in{gap:8px}.pb-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pathNext{max-width:60%;min-width:0;justify-content:flex-start}#pathNext .pb-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.ex-bar .pb-txt{white-space:normal;overflow:visible}.ex-bar .ex-why,.ex-bar .ex-tag{display:none}
 .nav{flex:1 0 100%;flex-wrap:wrap;padding-bottom:8px}
 .nav button{padding:6px 10px;font-size:14px}
 .nav button .ic,.nav button svg{display:none}
 .teambar .tb-toggle{display:flex;width:100%;justify-content:space-between;min-width:0}
 .tb-toggle span{min-width:0;text-align:left;overflow-wrap:anywhere}
 .teambar:not(.open)>:not(.tb-toggle){display:none}
 .grid2,.grid3,.grid3.wide,.folder,.insp,.group-hero{grid-template-columns:minmax(0,1fr)}
 .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sec{padding:26px 0 32px}.page-head{padding:24px var(--gutter) 24px}
 .sec-head{flex-wrap:wrap}.sec-head h2{flex:1;min-width:0;font-size:26px}.sec-head::after{flex:1 0 100%}

 .link:not(:last-child)::after{content:"↓";left:50%;top:100%;width:auto;transform:translateX(-50%)}
 .g-row{grid-template-columns:minmax(0,1fr);gap:8px}
 .lane{grid-template-columns:minmax(0,1fr)}
 .diagram svg{width:var(--dw,1100px);max-width:none}
 .teambar .f-team,.teambar .f-name,.tb-prog{flex:1 1 100%;max-width:none;width:auto}
 .tree button{padding:9px 10px 9px 18px}
 .card-body{padding:14px}
 .msg{max-width:100%}
}
/* ─── Company site frame (#/rybex): a small browser window inside the workshop page ─── */
.rf-stage{padding:0 var(--gutter) 48px}

.casebar[hidden]{display:none}

.ps-av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex:none}

.ib-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.ib-item{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--surface)}

.ib-meta{font-size:var(--caption);color:var(--ink-2)}.ib-text{font-style:italic}

.persona-card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--surface)}

.rf-page .pc-head h3{margin:0;font-size:18px}
.pc-role{margin:0;color:var(--ink-2);font-size:14px}
.pc-av{width:44px;height:44px;border-radius:50%;background:var(--rf-sea);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex:none}
.pc-bio{font-size:15px;color:var(--ink-2);margin:0}
.persona-card blockquote{margin:12px 0 0;padding:10px 14px;border:2px solid var(--yellow);background:var(--paper-2);border-radius:8px}
.persona-card blockquote p{margin:0;font-style:italic;color:var(--ink)}
.rybex-frame{--rf-sea:#0F5E86;--rf-sea-2:#0B4A6B;--rf-foam:#EAF4F9;border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow-lg);overflow:hidden;background:var(--surface);max-width:1120px;margin:0 auto;color:var(--ink);font-family:var(--font-sans)}
.rybex-frame .ic{width:18px;height:18px;flex:none}
.rf-chrome{background:var(--paper-3);border-bottom:1px solid var(--line-2)}
.rf-tabs{display:flex;align-items:flex-end;gap:10px;padding:8px 12px 0}
.rf-dots{display:flex;gap:6px;align-self:center;padding-bottom:8px}.rf-dots i{width:11px;height:11px;border-radius:50%;background:var(--line-2)}
.rf-tab{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:10px 10px 0 0;padding:7px 14px;font-size:13px;color:var(--ink-2);max-width:280px;min-width:0;margin-bottom:-1px}
.rf-tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-tab .rf-fish{width:16px;height:16px;flex:none}
.rf-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line-2)}
.rf-nav{display:flex;gap:10px;color:var(--ink-3);padding:0 4px}
.rf-url{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px;font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.rf-url b{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rf-url .ic{width:14px;height:14px}
.rf-back{flex:none}
.rybex-frame .fiction-banner{display:flex;gap:10px;align-items:flex-start;background:var(--yellow);color:var(--yellow-ink);padding:9px 28px;margin:0;font-size:14px;font-weight:500}
.fiction-banner .ic{margin-top:2px}
.rf-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:18px 28px;border-bottom:1px solid var(--line)}
.rf-logo{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left;font:inherit;border-radius:var(--r-sm)}
.rf-logo .rf-fish{width:46px;height:46px;flex:none}
.rf-logo strong{display:block;font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;color:var(--rf-sea-2)}
.rf-logo small{display:block;font-size:13px;color:var(--ink-2);margin-top:3px}
.rf-navwrap{margin-left:auto;min-width:0}
.rf-menu{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px}
.rf-menu button{display:block;width:100%;text-align:left;padding:7px 11px;border:0;border-radius:8px;background:none;color:var(--ink-2);font:inherit;font-size:14.5px;font-weight:500;cursor:pointer}
.rf-menu button:hover{background:var(--rf-foam);color:var(--rf-sea-2)}
.rf-menu button.on{color:var(--rf-sea-2);background:var(--rf-foam);box-shadow:inset 0 -2px 0 var(--rf-sea)}.rf-menu button.on:focus-visible{box-shadow:inset 0 -2px 0 var(--rf-sea),var(--focus-ring)}
.rf-menu button[data-rp=intranet]{border:1px solid var(--line-2);margin-left:6px}
.rf-toggle{display:none}
.rf-page h2{font-family:var(--font-display);font-weight:700;font-size:1.65rem;letter-spacing:-.015em;margin:0 0 16px;color:var(--ink)}
.rf-page h3{font-family:var(--font-display);font-size:1.15rem;margin:22px 0 8px}
.rf-link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--rf-sea);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.rf-link .ic{width:16px;height:16px}
.rf-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center;padding:40px 28px 56px;background:var(--rf-foam)}
.rf-page .rf-hero h2{font-weight:800;font-size:clamp(2.1rem,4vw,3.1rem);line-height:1.05;letter-spacing:-.025em;color:var(--rf-sea-2);margin:0 0 6px}
.rf-lead{font-family:var(--font-display);font-size:1.3rem;font-weight:600;color:var(--rf-sea);margin:0 0 14px}
.rf-hero p:not(.rf-lead){color:var(--ink-2);font-size:16.5px;margin:6px 0}
.rf-hero-pic{display:flex;gap:12px;justify-content:center}
.rf-hero-pic img{width:44%;height:auto;border-radius:12px;box-shadow:var(--shadow-sm);aspect-ratio:4/5;object-fit:cover;background:var(--paper-2)}
.rf-hero-pic img:nth-child(2),.rf-hero-pic .rf-ph:nth-child(2){margin-top:28px}
.rf-ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;aspect-ratio:4/5;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);font-weight:600;border-radius:12px}.rf-hero-pic .rf-ph{width:44%}.rf-prod .rf-ph{width:100%;border-radius:0;border-width:0 0 1px}
.rf-teaser{display:flex;gap:14px;align-items:center;margin:-28px 28px 28px;position:relative;background:var(--surface);border:2px solid var(--red-600);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-sm)}
.rf-teaser p{margin:0;font-size:16px}
.rf-blk{padding:28px 28px 34px}
.rf-hero+.rf-teaser+.rf-blk{padding-top:6px}
.rf-text p{max-width:66ch;color:var(--ink-2);font-size:16.5px;line-height:1.65}
.rf-intro{color:var(--ink-2);margin:-6px 0 18px}
.rf-prods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.rf-prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.rf-prod img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;background:var(--paper-2)}
.rf-page .rf-pname{margin:0;padding:10px 14px 12px;font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--rf-sea-2)}
.rf-pnote{margin:0;padding:0 14px;font-size:13.5px;color:var(--ink-2)}
.rf-pact{margin:0;padding:8px 14px 14px;font-size:14.5px}
.rf-docs{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px}
.rf-art{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;padding:30px 28px 38px}
.rf-crumbs{font-size:14px;margin:0 0 14px;color:var(--ink-3)}
.rf-date{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);letter-spacing:.04em;margin:0 0 6px}
.rf-page .rf-art h2{font-weight:800;font-size:clamp(1.9rem,3.6vw,2.7rem);letter-spacing:-.02em;line-height:1.08;color:var(--rf-sea-2);margin:0 0 18px}
.rf-nb{white-space:nowrap}
.rf-pact .rf-link{align-items:flex-start}.rf-pact .rf-link .ic{margin-top:3px}
.rf-body p,.rf-season{font-size:17px;line-height:1.65;color:var(--ink-2);margin:0 0 14px;max-width:66ch}
.rf-facts{align-self:start;background:var(--rf-foam);border-radius:12px;padding:16px 18px}
.rf-page .rf-facts h3{margin:0 0 8px}
.rf-facts dl{margin:0}.rf-facts dt{font-size:13px;color:var(--ink-2);margin-top:8px}.rf-facts dd{margin:0;font-weight:600;color:var(--rf-sea-2)}
.rf-job{border:1px solid var(--rf-sea);border-radius:12px;padding:16px 20px;max-width:70ch}
.rf-page .rf-job h3{margin:0 0 8px}
.rf-tag{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--rf-sea)}
.rf-foot{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;background:var(--rf-sea-2);color:var(--paper);padding:18px 28px;font-size:14px}
.rf-foot p{margin:0;max-width:70ch;color:var(--paper);font-size:14px}
.rf-foot .btn{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.rf-foot .btn:focus-visible{box-shadow:0 0 0 2px var(--rf-sea-2),0 0 0 5px var(--paper)}
@media (max-width:900px){.ri-grid,.ri-people{grid-template-columns:minmax(0,1fr)}.rf-prods{grid-template-columns:repeat(2,minmax(0,1fr))}.rf-art{grid-template-columns:minmax(0,1fr)}.rf-facts{max-width:340px}}
@media (max-width:768px){
 .rf-stage{padding:0 10px 32px}
 .rf-tab{display:none}.rf-tabs{padding:6px 10px 0}.rf-dots{padding-bottom:6px}
 .rf-bar{padding:6px 8px;gap:6px}.rf-nav{display:none}.rf-url{padding:5px 10px;font-size:12px}
 .rf-bar .rf-back .t{display:none}
 .rybex-frame .fiction-banner{padding:9px 16px;font-size:13px}
 .rf-head{padding:14px 16px;gap:12px}
 .rf-logo .rf-fish{width:38px;height:38px}.rf-logo strong{font-size:22px}
 .rf-toggle{display:inline-flex;margin-left:auto;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
 .rf-navwrap{flex:1 0 100%;margin:0}
 .rf-menu{display:none;flex-direction:column}
 .rf-menu.open{display:flex}
 .rf-menu button[data-rp=intranet]{margin:4px 0 0}
 .rf-hero{grid-template-columns:minmax(0,1fr);padding:26px 16px 48px;gap:18px}
 .rf-hero-pic img,.rf-hero-pic .rf-ph{width:40%}
 .rf-teaser{margin:-28px 16px 20px;flex-direction:column;align-items:flex-start}
 .rf-blk{padding:22px 16px 26px}
 .rf-art{padding:22px 16px 28px}
 .rf-foot{padding:16px}
 .ri-top{padding:20px 16px 4px}.ri-grid{padding:8px 16px 22px;gap:18px}.rc-row{grid-template-columns:minmax(0,1fr);gap:0}
 .cb-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.persona{padding:12px 14px;gap:10px}.ps-av{width:34px;height:34px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}body *,body *::before,body *::after{animation:none!important}}
</style>

function buildSales(){const r=rng(11),rows=[];for(let p=0;p<4;p++)for(let i=0;i<36;i++){const m=(10+i)%12;rows.push({month:monthLbl(i),product:PRODUCTS[p][0],units_k:Math.round(PRODUCTS[p][2]*(1+.008*i)*SEAS[m]*(1+(r()-.5)*.12))})}return rows}
// Failure events [start minute, kind]: v = seamer (vibration), t = retort (temperature + pressure), b = both; each lasts SENSOR_EVENT_LEN minutes.
const SENSOR_EVENTS=[[60,'v'],[140,'t'],[230,'b'],[350,'v'],[430,'t'],[520,'b']],SENSOR_EVENT_LEN=14;
function buildSensors(){const r=rng(5),rows=[],W=SENSOR_EVENTS;
 for(let i=0;i<600;i++){let t=121+gauss(r)*.6,p=2.1+gauss(r)*.05,v=2+gauss(r)*.25,y=0;
  for(const[s,k]of W)if(i>=s&&i<s+SENSOR_EVENT_LEN){const ramp=(i-s+1)/SENSOR_EVENT_LEN;y=1;if(k!='t')v+=ramp*3.2;if(k!='v')t+=ramp*5;if(k=='t')p+=ramp*.35}
  rows.push({t_min:i,temp_c:+t.toFixed(2),pressure_bar:+p.toFixed(3),vibration_mm_s:+v.toFixed(2),anomaly:y})}return rows}

const BRIEF_PL="> Sprawa zaczyna się od incydentu w zakładzie Rybex w Mirszycach: sieć handlowa zwróciła paletę „Szprota w oleju” z partii "+LOT+" z powodu wgnieceń i nieczytelnego kodu partii. W tym samym tygodniu do działu reklamacji wpłynęło więcej zgłoszeń niż zwykle, w tym sygnały o zapachu. Dyrektor zakładu prosi nowy zespół AI o jasny opis problemu, sprawdzenie prostych reguł i uczciwą ocenę, czy taki system można puścić bliżej linii.\n\n# Projekt końcowy – część technologiczna\n## Rozwiązanie AI dla firmy Rybex\n\n### Cel projektu\n\nCelem projektu jest zaprojektowanie i sprawdzenie rozwiązania wykorzystującego sztuczną inteligencję w firmie **Rybex – producencie konserw rybnych**. Zespół wybiera jeden problem, opracowuje koncepcję techniczną oraz przygotowuje **Proof of Concept (PoC)**, czyli prototyp pozwalający zweryfikować najważniejsze założenia rozwiązania.\n\nProjekt powinien pokazywać, jak przejść od określenia zadania i pozyskania danych do uruchomienia systemu AI oraz oceny jego działania.\n\n### 1. Wybór zadania\n\nNależy opisać zadanie realizowane przez system: jakie dane otrzymuje, jak je przetwarza i jaki wynik zwraca użytkownikowi.\n\nPrzykładowe tematy dla firmy Rybex:\n\n- **Wizyjna kontrola jakości** – wykrywanie uszkodzeń puszek, nieprawidłowych etykiet lub nieczytelnych oznaczeń partii.\n- **Prognozowanie popytu** – przewidywanie zapotrzebowania na poszczególne produkty na podstawie danych historycznych.\n- **Przewidywanie awarii maszyn** – analiza danych z urządzeń produkcyjnych w celu wykrywania nieprawidłowości.\n- **Asystent wiedzy firmowej** – wyszukiwanie informacji i udzielanie odpowiedzi na podstawie instrukcji obsługi, procedur i dokumentacji technicznej.\n- **Analiza reklamacji** – klasyfikowanie zgłoszeń, identyfikowanie powtarzających się problemów i przygotowywanie projektów odpowiedzi.\n\n### 2. Dane\n\nNależy określić:\n\n- rodzaj i format potrzebnych danych, np. zdjęcia, dokumenty, historia sprzedaży lub odczyty z czujników;\n- źródła danych i sposób ich pozyskania;\n- zakres przygotowania danych: czyszczenie, uzupełnianie, oznaczanie i przekształcanie;\n- sposób podziału danych do budowy rozwiązania i niezależnego testowania;\n- ograniczenia zbioru, np. małą liczbę przykładów, braki lub nierównomierną reprezentację kategorii.\n\nMożna wykorzystać dane firmowe, publiczne zbiory danych lub dane symulowane. W przypadku danych zastępczych należy wyjaśnić, w jakim stopniu odpowiadają warunkom pracy w firmie Rybex.\n\n### 3. Technologia i architektura\n\nNależy przedstawić i uzasadnić wybór:\n\n- modelu lub metody AI;\n- bibliotek, narzędzi i środowiska wykonawczego;\n- infrastruktury: lokalnej, chmurowej lub hybrydowej;\n- sposobu przechowywania i przetwarzania danych;\n- interfejsu użytkownika oraz ewentualnych integracji z innymi systemami.\n\nDokumentacja powinna zawierać **schemat blokowy architektury**, pokazujący przepływ danych od źródła przez komponenty systemu do wyniku.\n\nRozwiązanie może korzystać z gotowego modelu, zewnętrznego API, mechanizmu RAG lub modelu trenowanego przez zespół. Trenowanie własnego modelu nie jest konieczne – wybór podejścia powinien wynikać z zadania.\n\n### 4. Prototyp i przebieg prac\n\nCzęść praktyczna może mieć postać:\n\n- prostej aplikacji AI realizującej wybrane zadanie;\n- narzędzia lub notatnika do trenowania i testowania modelu;\n- demonstratora wykorzystującego gotowy model lub usługę AI.\n\nNależy opisać sposób uruchomienia prototypu, przeprowadzone eksperymenty oraz najważniejsze decyzje projektowe. Jeśli model był trenowany lub dostrajany, należy podać wykorzystane zasoby, czas i szacunkowy koszt tego procesu.\n\nZakres prototypu powinien umożliwiać sprawdzenie głównej funkcji systemu.\n\n### 5. Ocena działania\n\nNależy dobrać miary odpowiadające zadaniu, np.:\n\n- precyzję, czułość lub F1 dla klasyfikacji i wykrywania nieprawidłowości;\n- błąd prognozy dla przewidywania popytu;\n- poprawność odpowiedzi i zgodność ze źródłami dla asystenta wiedzy;\n- czas odpowiedzi, zużycie zasobów i koszt pojedynczego wywołania.\n\nOcena powinna obejmować przykłady poprawnego działania i błędów, ograniczenia rozwiązania oraz wnioski z testów. Warto porównać wyniki z prostą metodą odniesienia, np. regułami lub prognozą opartą na średniej historycznej.\n\n### 6. Rezultaty części technologicznej\n\nZespół przedstawia:\n\n- dokumentację danych, technologii i architektury;\n- prototyp lub środowisko eksperymentalne wraz z instrukcją uruchomienia;\n- wyniki testów i analizę błędów;\n- szacunek zapotrzebowania na zasoby oraz kosztów technicznych;\n- opis dalszych prac potrzebnych do wdrożenia, w tym integracji, monitorowania jakości i utrzymania systemu.\n";
const BRIEF_EN=`> The case starts with an incident at the Rybex plant in Mirszyce: a retail chain returned a pallet of “Sprat in oil” from batch ${LOT} because of dents and an unreadable batch code. In the same week the complaints team received more reports than usual, including reports about the smell. The plant director asks the new AI team for a clear description of the problem, a check of simple rules and an honest assessment of whether such a system can be put closer to the line.

# Final project – technology part
## An AI solution for Rybex

### Project goal

Design and test a solution using artificial intelligence at **Rybex, a fish-can manufacturer**. The team picks one problem, develops a technical concept and prepares a **Proof of Concept (PoC)**, a prototype that verifies the most important assumptions of the solution.

The project should show how to move from defining the task and obtaining data to running an AI system and assessing how it works.

### 1. Task selection

Describe the task performed by the system: what data it receives, how it processes them and what result it returns to the user.

Example topics for Rybex:

- **Visual quality inspection** – detecting damaged cans, incorrect labels or illegible batch markings.
- **Demand forecasting** – predicting demand for individual products from historical data.
- **Machine failure prediction** – analysing data from production equipment to detect irregularities.
- **Company knowledge assistant** – finding information and answering from manuals, procedures and technical documentation.
- **Complaint analysis** – classifying reports, identifying recurring problems and preparing draft replies.

### 2. Data

Specify:

- the type and format of the data needed, e.g. images, documents, sales history or sensor readings;
- data sources and how they are obtained;
- the scope of data preparation: cleaning, filling gaps, labeling and transforming;
- how the data are split between building the solution and independent testing;
- dataset limits, e.g. few examples, gaps or uneven representation of categories.

You may use company data, public datasets or simulated data. For substitute data, explain how closely they match working conditions at Rybex.

### 3. Technology and architecture

Present and justify the choice of:

- the AI model or method;
- libraries, tools and runtime environment;
- infrastructure: local, cloud or hybrid;
- how data are stored and processed;
- the user interface and any integrations with other systems.

The documentation should include a **block diagram of the architecture**, showing data flow from the source through the system components to the result.

The solution may use a ready model, an external API, a RAG mechanism or a model trained by the team. Training your own model is not required – the approach should follow from the task.

### 4. Prototype and work process

The practical part may take the form of:

- a simple AI application performing the chosen task;
- a tool or notebook for training and testing a model;
- a demonstrator using a ready model or AI service.

Describe how to run the prototype, the experiments carried out and the most important design decisions. If a model was trained or tuned, state the resources, time and estimated cost of that process.

The scope of the prototype should allow the main function of the system to be checked.

### 5. Evaluation

Choose measures suited to the task, e.g.:

- precision, recall or F1 for classification and anomaly detection;
- forecast error for demand prediction;
- answer correctness and agreement with sources for the knowledge assistant;
- response time, resource use and cost per call.

The evaluation should include examples of correct behaviour and errors, the limits of the solution and conclusions from the tests. It is worth comparing results with a simple baseline, e.g. rules or a forecast based on the historical mean.

### 6. Results of the technology part

The team presents:

- documentation of data, technology and architecture;
- a prototype or experimental environment with run instructions;
- test results and error analysis;
- an estimate of resource needs and technical costs;
- a description of further work needed for deployment, including integration, quality monitoring and system maintenance.

 const verdict=hideLabel?'':(it.bad&&pred?T('Wada wykryta','Defect caught'):it.bad?T('Wada przeoczona','Defect missed'):pred?T('Fałszywy alarm','False alarm'):T('Poprawnie OK','Correctly OK'));

 {id:'privacy',persona:'marek',link:['arch'],linkT:T('Architektura: gdzie przetwarzacie dane','Architecture: where you process the data'),title:T('Dane osobowe w reklamacji','Personal data in a complaint'),
  situation:T('W zgłoszeniu klient podał imię, telefon i adres. Zespół chce puścić treść przez zewnętrzny model językowy (API).','In the complaint the customer gave a name, a phone number and an address. The team wants to send the text through an external language model (API).'),
  question:T('Co zrobicie najpierw?','What do you do first?'),options:[
  {t:T('Sprawdzimy w umowie, czy dostawca nie przechowuje danych, i wtedy wyślemy całą treść.','We will check the provider’s contract: if it does not store data, we send the whole text.'),fb:T('Nawet jeśli dostawca niczego nie przechowuje, imię i telefon klienta i tak wychodzą z zakładu do innej firmy. Czysta umowa tego nie załatwia: najpierw usuńcie to, czego model do kategorii nie potrzebuje.','Even if the provider stores nothing, the customer’s name and phone number still leave the plant for another company. A clean contract does not settle that: first remove what the model does not need to pick a category.')},
  {t:T('Najpierw zamaskujemy imię, telefon i adres, a potem sprawdzimy przetwarzanie lokalne.','First we mask the name, phone and address, then we check local processing.'),fb:T('Słusznie – do ustalenia kategorii model nie potrzebuje telefonu ani adresu. W aplikacji reklamacje są syntetyczne, ale w prawdziwym zakładzie wysłanie numeru telefonu do dostawcy modelu to problem prawny i zaufania.','Right – the model does not need a phone number or an address to pick a category. In the app the complaints are synthetic, but in a real plant sending a phone number to the model provider is a legal problem and a problem of trust.'),good:true},
  {t:T('Dodamy do formularza prośbę, żeby klienci nie wpisywali telefonu ani adresu.','We add a note to the form asking customers not to type a phone number or address.'),fb:T('Klienci i tak je wpiszą, bo chcą, żeby ktoś oddzwonił. Zakład odpowiada za to, co sam wysyła dalej, więc filtr musi stać po waszej stronie.','Customers will type them anyway, because they want someone to call back. The plant answers for what it sends on, so the filter has to sit on your side.')}]},
 {id:'hallucination',persona:'piotr',link:['lab','rag'],linkT:T('Laboratorium: asystent wiedzy (RAG)','Build lab: knowledge assistant (RAG)'),title:T('Halucynacja procedury','A hallucinated procedure'),
  situation:T('Asystent wiedzy odpowiedział na pytanie o wybrzuszoną puszkę pewnym tonem, ale bez trafnego źródła.','The knowledge assistant answered a question about a bulging can in a confident tone, but without a matching source.'),
  question:T('Czy wolno wywiesić tę odpowiedź przy linii?','May this answer be posted by the line?'),options:[
  {t:T('Wywiesimy ją z dopiskiem „w razie wątpliwości sprawdź u kierownika zmiany”.','We post it with a note: “if in doubt, check with the shift supervisor”.'),fb:T('Przy linii nikt nie dzwoni do kierownika przy każdej puszce – ludzie zrobią to, co jest napisane. Dopisek nie poprawia treści, która nie ma źródła.','By the line nobody calls the supervisor for every can – people do what the sheet says. The note does not fix content that has no source.')},
  {t:T('Wywiesimy ją, jeśli dwie osoby z jakości uznają, że zgadza się z praktyką.','We post it if two people from quality agree it matches current practice.'),fb:T('Zgoda dwóch osób opiera się na pamięci, nie na procedurze. Jeśli procedura się zmieniła, błąd trafi na linię z podpisem jakości, a w audycie nikt nie wskaże źródła.','Two people agreeing rests on memory, not on the procedure. If the procedure has changed, the mistake reaches the line signed off by quality, and at the audit nobody can point to a source.')},
  {t:T('Nie wywiesimy; potrzebne jest źródło w procedurze albo odmowa asystenta.','No: we need an answer with a source in the procedure, or a refusal.'),fb:T('Słusznie – przy linii liczy się źródło, które da się sprawdzić. Uczciwe „nie wiem” jest bezpieczniejsze niż pewna, zmyślona instrukcja, i właśnie to sprawdza laboratorium RAG.','Right – by the line what counts is a source you can check. An honest “I don’t know” is safer than a confident, made-up instruction, and that is exactly what the RAG lab checks.'),good:true}]},
 {id:'aiact',persona:'piotr',link:['arch'],linkT:T('Architektura: weryfikacja przez człowieka','Architecture: human-in-the-loop'),title:T('AI Act: o co zapyta dział zgodności','AI Act: what compliance will ask'),

  note:T('To nie jest opinia prawna; ma tylko pokazać, o co zapyta regulator albo dział zgodności.','This is not legal advice; it only shows what a regulator or a compliance department will ask about.'),options:[
  {t:T('Ustalimy rolę systemu i od początku zapiszemy dane, oceny i nadzór człowieka.','We set out the system’s role and record data, tests and human oversight from the start.'),fb:T('Słusznie – dział zgodności zapyta, o czym system decyduje, na jakich danych go oceniono i kto może zatrzymać albo cofnąć jego decyzję. Warsztat pomaga przygotować odpowiedzi, ale nie zastępuje oceny prawnej.','Right – compliance will ask what the system decides, on which data it was evaluated and who can stop or reverse its decision. The workshop helps you prepare the answers, but it does not replace a legal assessment.'),good:true},
  {t:T('Zaczniemy pilotaż, a dokumentacją zajmiemy się, gdy system się sprawdzi.','We start the pilot and deal with the documentation once the system has proved its worth.'),fb:T('Pilotaż też zatrzymuje prawdziwą produkcję. Jeśli dokumentację danych i ocen zaczniecie zbierać dopiero po nim, trzeba ją będzie odtwarzać z pamięci, gdy ktoś o nią zapyta.','A pilot stops real production too. If you only start recording the data and the evaluation afterwards, you will have to rebuild them from memory when someone asks.')},
  {t:T('Kupimy model od dostawcy z certyfikatem, więc zgodność będzie po jego stronie.','We buy the model from a certified supplier, so compliance is on their side.'),fb:T('Certyfikat dostawcy nie mówi, jak system zachowuje się na waszej linii ani kto w zakładzie odpowiada za zatrzymanie produkcji. O to dział zgodności i tak zapyta was, nie dostawcę.','The supplier’s certificate does not tell how the system behaves on your line or who in the plant answers for stopping production. Compliance will still ask you that, not the supplier.')}]},
 {id:'bias',persona:'magda',link:['lab','complaints'],linkT:T('Laboratorium: kategorie reklamacji','Build lab: complaint categories'),title:T('Stronniczość reguł','Biased rules'),
  situation:T('Lista słów kluczowych dobrze łapie zgłoszenia napisane spokojnym, «urzędowym» językiem, a gorzej krótkie, emocjonalne wiadomości.','The keyword list catches complaints written in calm, «official» language well, and short, emotional messages less well.'),
  question:T('Co to oznacza dla klientów?','What does that mean for customers?'),options:[
  {t:T('Dopiszemy kilka emocjonalnych słów do listy i sprawdzimy trafność ogółem.','We add a few emotional words to the keyword list and check the overall accuracy.'),fb:T('Trafność ogółem może wzrosnąć, a krótkie wiadomości dalej będą gubione, bo średnia tego nie pokaże. Ktoś, kto pisze tylko „puszka śmierdzi!!!”, czeka dłużej, choć to może być sprawa bezpieczeństwa żywności.','Overall accuracy can go up while short messages are still missed, because the average does not show it. Someone who writes just “the can stinks!!!” waits longer, although it may be a food safety case.')},
  {t:T('Obejrzymy pomyłki osobno dla krótkich i urzędowych zgłoszeń, potem poprawimy listę.','We compare the errors on short and on formal messages, then fix the list.'),fb:T('Słusznie – reguły są tak dobre, jak głosy, które trafiły do danych i do słownika. Dlatego oprócz trafności oglądacie same pomyłki.','Right – rules are only as good as the voices that made it into the data and the keyword list. That is why you look at the mistakes themselves, not only at accuracy.'),good:true},

 {id:'injection',persona:'magda',link:['rybex','contact'],linkT:T('Formularz reklamacji na stronie Rybex','The complaint form on the Rybex site'),title:T('Wstrzyknięcie polecenia w zgłoszeniu','Prompt injection in a complaint'),

function fcModels(y,h,w){const n=y.length,mean=y.reduce((a,b)=>a+b,0)/n;let sx=0,sy=0,sxy=0,sxx=0;for(let i=0;i<n;i++){sx+=i;sy+=y[i];sxy+=i*y[i];sxx+=i*i}const b=(n*sxy-sx*sy)/(n*sxx-sx*sx),a=(sy-b*sx)/n,idx=Array(12).fill(0),cnt=Array(12).fill(0);
 for(let i=0;i<n;i++){idx[(10+i)%12]+=y[i]/(a+b*i);cnt[(10+i)%12]++}const id=idx.map((v,i)=>v/Math.max(1,cnt[i])),ma=y.slice(-w).reduce((a,b)=>a+b,0)/w,o={mean:[],naive:[],snaive:[],ma:[],ts:[]};

 vision:{id:'vision_borderline',title:T('Najtrudniejsze puszki','The hardest cans'),task:T(`Złapcie na zbiorze walidacyjnym wszystkie wady każdego typu: w tabeli analizy błędów każdy typ ma wynik pełny, np. 6 / 6. Wyzwanie jest zaliczone, gdy fałszywych alarmów jest przy tym najwyżej ${CH.visFp}. Szukajcie progu, przy którym przypadki graniczne przestają udawać wadę, a żadna prawdziwa wada nie umyka.`,`Catch every defect of every type on the validation set: in the error analysis table each type shows a full score, e.g. 6 / 6. The challenge is passed when, at the same time, there are at most ${CH.visFp} false alarms. Look for the threshold at which borderline cans stop passing for defects while no real defect slips through.`),lesson:T('Ostatnie fałszywe alarmy to przypadki graniczne, które wyglądają prawie jak wada: każdy krok progu, który je usuwa, może przepuścić prawdziwą wadę.','The last false alarms are borderline cans that look almost like a defect: every step of the threshold that removes them can let a real defect through.')},

 if(id==='compl_mixed'){const L=lab().compl,dev=DATA.compl.slice(0,36),e=cEval(dev,L.kw),need=e.maj+CH.complPp,nh=dev.filter(r=>r.hazard).length,hit=dev.filter(r=>r.hazard&&cHazard(r.text,L.safety)).length,accOk=e.acc>=need-1e-9;

 if(id==='fc_horizon'){const L=lab().fc;if(L.h!==CH.fcLong)return{pass:false,msg:T(`Horyzont: ${L.h} mies. – ustawcie ${CH.fcLong}.`,`Horizon: ${L.h} months – set it to ${CH.fcLong}.`)};
  const Rl=fcCompute(L),Rs=fcCompute({...L,h:CH.fcShort}),c=Rl.keys.filter(k=>k!=='mean'&&Rs.mt[k].mape<Rs.mt.mean.mape-CH.fcPp&&Rl.mt[k].mape>Rl.mt.mean.mape-CH.fcPp),on=c.filter(k=>L.show[k]);
  if(on.length){const k=on[0];return{pass:true,msg:T(`${fcName(k)}: przy ${CH.fcShort} mies. ${pct(Rs.mt[k].mape)} wobec ${pct(Rs.mt.mean.mape)} dla średniej, przy ${CH.fcLong} mies. ${pct(Rl.mt[k].mape)} wobec ${pct(Rl.mt.mean.mape)}.`,`${fcName(k)}: at ${CH.fcShort} months ${pct(Rs.mt[k].mape)} against ${pct(Rs.mt.mean.mape)} for the mean, at ${CH.fcLong} months ${pct(Rl.mt[k].mape)} against ${pct(Rl.mt.mean.mape)}.`)}}
  return{pass:false,msg:c.length?T('Przy tym produkcie i oknie taka metoda istnieje, ale nie jest włączona na wykresie.','For this product and window such a method exists, but it is not switched on in the chart.'):T(`Przy tym produkcie i oknie każda metoda albo nadal bije średnią przy ${CH.fcLong} mies., albo nie biła jej wyraźnie przy ${CH.fcShort}. Zmieńcie produkt lub okno średniej ruchomej.`,`For this product and window every method either still beats the mean at ${CH.fcLong} months or did not clearly beat it at ${CH.fcShort}. Change the product or the moving-average window.`)}}
 if(id==='maint_retort'){const L=lab().mt;if(!L.f.temp_c)return{pass:false,msg:T('Włączcie temperaturę: awaria retortu widać właśnie po niej.','Switch temperature on: a retort failure shows up in it.')};
  const R=mtCompute(L),fp=R.m.fp,[a,b]=retortWindow(),N=b-a;let n=0;for(let i=a;i<b;i++)if(R.z[i]>L.thr)n++;
  if(n>=CH.mtMin&&fp<=CH.mtFp)return{pass:true,msg:T(`Alarm w ${n} z ${N} minut awarii retortu, ${faCnt(fp)}.`,`Alarm in ${n} of the ${N} retort-failure minutes, ${faCnt(fp)}.`)};

 box.dataset.state=done?'done':f.na?'na':'open';box.dataset.pass=f.pass;const chip=$('.ch-chip',box);chip.className=`edu-chip ch-chip ${done?'tone-green':'tone-stone'}`;chip.textContent=done?T('zaliczone','passed'):f.na?T('niedostępne','unavailable'):T('nieobowiązkowe','optional');
