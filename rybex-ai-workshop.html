const BRIEF_PL="> Sprawa zaczyna się od incydentu w zakładzie Rybex w Mirszycach: sieć handlowa zwróciła paletę „Szprota w oleju” z partii "+LOT+" z powodu wgnieceń i nieczytelnego kodu partii. W tym samym tygodniu do skrzynki reklamacji wpłynęło więcej zgłoszeń niż zwykle, w tym sygnały o zapachu. Dyrektor zakładu prosi nowy zespół AI o jasny opis problemu, sprawdzenie prostych reguł i uczciwą ocenę, czy taki system można puścić bliżej linii.\n\n# Projekt końcowy – część technologiczna\n## Rozwiązanie AI dla firmy Rybex\n\n### Cel projektu\n\nCelem projektu jest zaprojektowanie i sprawdzenie rozwiązania wykorzystującego sztuczną inteligencję w firmie **Rybex – producencie konserw rybnych**. Zespół wybiera jeden problem, opracowuje koncepcję techniczną oraz przygotowuje **Proof of Concept (PoC)**, czyli prototyp pozwalający zweryfikować najważniejsze założenia rozwiązania.\n\nProjekt powinien pokazywać, jak przejść od określenia zadania i pozyskania danych do uruchomienia systemu AI oraz oceny jego działania.\n\n### 1. Wybór zadania\n\nNależy opisać zadanie, które wykonuje system: jakie dane otrzymuje, jak je przetwarza i jaki wynik zwraca użytkownikowi.\n\nPrzykładowe tematy dla firmy Rybex:\n\n- **Wizyjna kontrola jakości** – wykrywanie uszkodzeń puszek, nieprawidłowych etykiet lub nieczytelnych oznaczeń partii.\n- **Prognozowanie popytu** – przewidywanie zapotrzebowania na poszczególne produkty na podstawie danych historycznych.\n- **Przewidywanie awarii maszyn** – wykrywanie nieprawidłowości w danych z urządzeń produkcyjnych.\n- **Asystent wiedzy firmowej** – wyszukiwanie informacji i udzielanie odpowiedzi na podstawie instrukcji obsługi, procedur i dokumentacji technicznej.\n- **Analiza reklamacji** – klasyfikowanie zgłoszeń, identyfikowanie powtarzających się problemów i przygotowywanie projektów odpowiedzi.\n\n### 2. Dane\n\nNależy określić:\n\n- rodzaj i format potrzebnych danych, np. zdjęcia, dokumenty, historia sprzedaży lub odczyty z czujników;\n- źródła danych i sposób ich pozyskania;\n- zakres przygotowania danych: czyszczenie, uzupełnianie, oznaczanie i przekształcanie;\n- sposób podziału danych do budowy rozwiązania i niezależnego testowania;\n- ograniczenia zbioru, np. małą liczbę przykładów, braki lub nierównomierną reprezentację kategorii.\n\nMożna wykorzystać dane firmowe, publiczne zbiory danych lub dane symulowane. Jeśli zespół korzysta z danych zastępczych, należy wyjaśnić, w jakim stopniu odpowiadają warunkom pracy w firmie Rybex.\n\n### 3. Technologia i architektura\n\nNależy przedstawić i uzasadnić wybór:\n\n- modelu lub metody AI;\n- bibliotek, narzędzi i środowiska wykonawczego;\n- infrastruktury: lokalnej, chmurowej lub hybrydowej;\n- sposobu przechowywania i przetwarzania danych;\n- interfejsu użytkownika oraz ewentualnych integracji z innymi systemami.\n\nDokumentacja powinna zawierać **schemat blokowy architektury**, który pokazuje przepływ danych od źródła przez komponenty systemu do wyniku.\n\nRozwiązanie może korzystać z gotowego modelu, zewnętrznego API, mechanizmu RAG lub modelu trenowanego przez zespół. Trenowanie własnego modelu nie jest konieczne – wybór podejścia powinien wynikać z zadania.\n\n### 4. Prototyp i przebieg prac\n\nCzęść praktyczna może mieć postać:\n\n- prostej aplikacji AI, która wykonuje wybrane zadanie;\n- narzędzia lub notatnika do trenowania i testowania modelu;\n- demonstratora wykorzystującego gotowy model lub usługę AI.\n\nNależy opisać sposób uruchomienia prototypu, przeprowadzone eksperymenty oraz najważniejsze decyzje projektowe. Jeśli model był trenowany lub dostrajany, należy podać wykorzystane zasoby, czas i szacunkowy koszt tego procesu.\n\nPrototyp powinien pozwalać sprawdzić główną funkcję systemu.\n\n### 5. Ocena działania\n\nNależy dobrać miary odpowiadające zadaniu, np.:\n\n- precyzję, czułość lub F1 dla klasyfikacji i wykrywania nieprawidłowości;\n- błąd prognozy dla przewidywania popytu;\n- poprawność odpowiedzi i zgodność ze źródłami dla asystenta wiedzy;\n- czas odpowiedzi, zużycie zasobów i koszt pojedynczego wywołania.\n\nOcena powinna obejmować przykłady poprawnego działania i błędów, ograniczenia rozwiązania oraz wnioski z testów. Warto porównać wyniki z prostą metodą odniesienia, np. regułami lub prognozą opartą na średniej historycznej.\n\n### 6. Rezultaty części technologicznej\n\nZespół przedstawia:\n\n- dokumentację danych, technologii i architektury;\n- prototyp lub środowisko eksperymentalne wraz z instrukcją uruchomienia;\n- wyniki testów i analizę błędów;\n- szacunek zapotrzebowania na zasoby oraz kosztów technicznych;\n- opis dalszych prac potrzebnych do wdrożenia, w tym integracji, monitorowania jakości i utrzymania systemu.\n";
const BRIEF_EN=`> The case starts with an incident at the Rybex plant in Mirszyce: a retail chain returned a pallet of “Sprat in oil” from batch ${LOT} because of dents and an unreadable batch code. In the same week the complaints team received more reports than usual, including reports about the smell. The plant director asks the new AI team for a clear description of the problem, a check of simple rules and an honest assessment of whether such a system can be put closer to the line.

# Final project – technology part
## An AI solution for Rybex

### Project goal

Design and test a solution using artificial intelligence at **Rybex, a fish-can manufacturer**. The team picks one problem, develops a technical concept and prepares a **Proof of Concept (PoC)**, a prototype that verifies the most important assumptions of the solution.

The project should show how to move from defining the task and obtaining data to running an AI system and assessing how it works.

### 1. Task selection

Describe the task performed by the system: what data it receives, how it processes them and what result it returns to the user.

Example topics for Rybex:

- **Visual quality inspection** – detecting damaged cans, incorrect labels or illegible batch markings.
- **Demand forecasting** – predicting demand for individual products from historical data.
- **Machine failure prediction** – analysing data from production equipment to detect irregularities.
- **Company knowledge assistant** – finding information and answering from manuals, procedures and technical documentation.
- **Complaint analysis** – classifying reports, identifying recurring problems and preparing draft replies.

### 2. Data

Specify:

- the type and format of the data needed, e.g. images, documents, sales history or sensor readings;
- data sources and how they are obtained;
- the scope of data preparation: cleaning, filling gaps, labeling and transforming;
- how the data are split between building the solution and independent testing;
- dataset limits, e.g. few examples, gaps or uneven representation of categories.

You may use company data, public datasets or simulated data. For substitute data, explain how closely they match working conditions at Rybex.

### 3. Technology and architecture

Present and justify the choice of:

- the AI model or method;
- libraries, tools and runtime environment;
- infrastructure: local, cloud or hybrid;
- how data are stored and processed;
- the user interface and any integrations with other systems.

The documentation should include a **block diagram of the architecture**, showing data flow from the source through the system components to the result.

The solution may use a ready model, an external API, a RAG mechanism or a model trained by the team. Training your own model is not required – the approach should follow from the task.

### 4. Prototype and work process

The practical part may take the form of:

- a simple AI application performing the chosen task;
- a tool or notebook for training and testing a model;
- a demonstrator using a ready model or AI service.

Describe how to run the prototype, the experiments carried out and the most important design decisions. If a model was trained or tuned, state the resources, time and estimated cost of that process.

The scope of the prototype should allow the main function of the system to be checked.

### 5. Evaluation

Choose measures suited to the task, e.g.:

- precision, recall or F1 for classification and anomaly detection;
- forecast error for demand prediction;
- answer correctness and agreement with sources for the knowledge assistant;
- response time, resource use and cost per call.

The evaluation should include examples of correct behaviour and errors, the limits of the solution and conclusions from the tests. It is worth comparing results with a simple baseline, e.g. rules or a forecast based on the historical mean.

### 6. Results of the technology part

The team presents:

- documentation of data, technology and architecture;
- a prototype or experimental environment with run instructions;
- test results and error analysis;
- an estimate of resource needs and technical costs;
- a description of further work needed for deployment, including integration, quality monitoring and system maintenance.

// One memo per task: the same returned lot seen by the person who owns that problem. The brief shows it once a task is chosen; before that nothing is shown in its place.
const MEMO_TAIL=()=>T('To ćwiczenie na danych warsztatowych (firma Rybex jest fikcyjna), ale decyzje podejmujcie tak, jakby dotyczyły prawdziwego zakładu.','This is an exercise on workshop data – Rybex is a fictional company – but make your decisions as if they concerned a real plant.');
const TASK_MEMOS=()=>({
 vision:{sender:T('Hanna Marek, dyrektor zakładu Rybex, Mirszyce','Hanna Marek, plant director, Rybex Mirszyce'),
  subject:T(`zwrot partii ${LOT}: wgniecenia i nieczytelny kod partii`,`return of batch ${LOT}: dents and an unreadable batch code`),
  summary:T(`Sieć handlowa zwróciła paletę „Szprota w oleju” z partii ${LOT}. W protokole kontroli jakości zapisano wgniecenia i nieczytelny kod partii. Kontroler na końcu linii ogląda puszki wyrywkowo, więc tych wad nikt nie zauważył.`,`A retail chain returned a pallet of “Sprat in oil” from batch ${LOT}. The quality check recorded dents and an unreadable batch code. The inspector at the end of the line looks at cans by sampling, so these defects went unnoticed.`),
  question:T('Sprawdźcie w ciągu warsztatów, czy kamera na linii z prostymi regułami wyłapie takie puszki. Pokażcie mi oba rodzaje błędów: przepuszczone wady i fałszywe alarmy. Na koniec chcę usłyszeć uczciwą ocenę, czy wolno nam postawić taki system przy linii.','During the workshop I need three things from you: a check of whether a line camera with simple rules catches such cans, both kinds of error shown (missed defects and false alarms), and an honest assessment of whether we may put such a system next to the line.')},
 rag:{sender:T('Piotr Zielak, kierownik ds. jakości i bezpieczeństwa żywności, Rybex, Mirszyce','Piotr Zielak, quality and food safety manager, Rybex Mirszyce'),
  subject:T(`zwrot partii ${LOT}: zmiana nie wiedziała, co mówi procedura`,`return of batch ${LOT}: the shift did not know what the procedure says`),
  summary:T(`Kiedy wróciła paleta „Szprota w oleju” z partii ${LOT}, zmiana długo szukała w segregatorach, które puszki odizolować i komu zgłosić sprawę. Odpowiedzi są w dokumentach firmy: procedurach PROCES-01…08, instrukcji przy zamykarce, FAQ działu jakości i komunikacie o zmianie procedury. Mało kto zna je na pamięć, a na nocnej zmianie nie ma kogo zapytać.`,`After the pallet of “Sprat in oil” from batch ${LOT} came back, the shift spent a long time searching binders for which cans to isolate and whom to notify. The answers are in the company documents: procedures PROCES-01…08, the instruction next to the seamer, the quality FAQ and the notice about a procedure change. Hardly anyone knows them by heart, and on the night shift there is nobody to ask.`),
  question:T('Sprawdźcie w ciągu warsztatów, czy asystent znajdzie właściwy fragment procedury i poda jego numer. Zbierzcie pytania, na które odpowiada źle albo pisze coś, czego w dokumentach nie ma. Potem oceńcie uczciwie, czy pracownicy mogą na nim polegać.','During the workshop I need three things from you: a check of whether the assistant finds the right passage of a procedure and gives its number, the questions it answers wrongly or without support in the documents, and an honest assessment of whether employees can rely on it.')},
 complaints:{sender:T('Magda Kruk, obsługa reklamacji i klienta, Rybex, Mirszyce','Magda Kruk, complaints and customer service, Rybex Mirszyce'),
  subject:T(`po zwrocie partii ${LOT} przybywa reklamacji`,`complaints are rising after the return of batch ${LOT}`),
  summary:T(`W tygodniu, w którym sieć handlowa zwróciła paletę z partii ${LOT}, do skrzynki reklamacji wpłynęło więcej zgłoszeń niż zwykle. Czytam je po kolei, więc zgłoszenie o zapachu potrafi czekać za pytaniami o dostawę, choć powinno szybko trafić do działu jakości.`,`In the week the retail chain returned the pallet from batch ${LOT}, the complaints inbox received more reports than usual. I read them in order, so a report about the smell can wait behind questions about a delivery. Yet that is a case for the quality department, and time matters there.`),
  question:T('W ciągu warsztatów sprawdźcie, czy proste reguły przypiszą zgłoszeniu właściwą kategorię. Pokażcie mi zgłoszenia, na których się mylą, zwłaszcza te o bezpieczeństwie żywności. I oceńcie uczciwie, czy taki system może sortować skrzynkę, zanim przeczyta ją człowiek.','During the workshop I need three things from you: a check of whether simple rules give a report the right category, the reports they get wrong (food safety ones above all), and an honest assessment of whether such a system may sort the inbox before a person reads it.')},
 forecast:{sender:T('Hanna Marek, dyrektor zakładu Rybex, Mirszyce','Hanna Marek, plant director, Rybex Mirszyce'),
  subject:T(`po zwrocie partii ${LOT}: ile produkować w kolejnych miesiącach`,`after the return of batch ${LOT}: how much to produce in the coming months`),
  summary:T(`Za zwróconą paletę „Szprota w oleju” z partii ${LOT} musimy dostarczyć sieci towar zastępczy, a w magazynie go zabrakło. Plan produkcji układamy na podstawie zeszłorocznej sprzedaży i wyczucia. Skutek jest taki, że przed grudniowym szczytem jednych konserw mamy za mało, a innych za dużo.`,`We owe the retail chain replacement goods for the returned pallet of “Sprat in oil” from batch ${LOT}, and the warehouse had none. We plan production from last year’s sales and gut feeling, so before the December peak we have too little of some products and too much of others.`),
  question:T('Sprawdźcie w ciągu warsztatów, czy prosta prognoza z trendem i sezonowością jest lepsza od średniej historycznej. Pokażcie mi miesiące i produkty, w których myli się najbardziej. Na koniec chcę usłyszeć uczciwą ocenę, czy można na niej oprzeć plan produkcji.','During the workshop I need three things from you: a check of whether a simple forecast with trend and seasonality beats the historical mean, the months and products where it is furthest off, and an honest assessment of whether the production plan can rest on it.')},
 maint:{sender:T('Anna Bór, utrzymanie ruchu, Rybex, Mirszyce','Anna Bór, maintenance, Rybex Mirszyce'),
  subject:T(`partia ${LOT}: postoje zamykarki i retorty`,`batch ${LOT}: seamer and retort stoppages`),
  summary:T(`Po zwrocie partii ${LOT} przejrzałam dziennik postojów. W tygodniu, w którym ją produkowaliśmy, zamykarka i retorta stawały kilka razy. Czujniki drgań, temperatury i ciśnienia zapisują odczyty przez cały czas, tylko nikt ich na bieżąco nie śledzi, więc o kłopocie dowiadujemy się z kontroli szwu albo z postoju linii.`,`After batch ${LOT} came back I went through the stoppage log: in the week it was produced the seamer and the retort stopped several times. The vibration, temperature and pressure sensors record readings all the time, but nobody follows them live. We learn about trouble from the seam inspection or from a line stop.`),
  question:T('Chciałabym, żebyście w ciągu warsztatów sprawdzili, czy prosta reguła na odczytach czujników ostrzeże przed awarią, zanim linia stanie. Policzcie, ile daje fałszywych alarmów i które awarie przegapia. Potem oceńcie uczciwie, czy taki alarm może działać na zmianie.','During the workshop I need three things from you: a check of whether a simple rule on the sensor readings warns of a failure before the line stops, how many false alarms it raises and which failures it misses, and an honest assessment of whether such an alarm can run on a shift.')}});
function memoHTML(){const k=team().track,M=TASK_MEMOS();

 <p>${glh(T('Potem wybierzecie jedno z pięciu zadań, sprawdzicie proste rozwiązanie na danych warsztatowych i zmierzycie, jak działa. Na koniec zaprojektujecie architekturę, ocenicie ryzyka i wyeksportujecie raport. Pasek u góry strony pokazuje, który krok jest następny.','Then you pick one of five tasks, try a simple solution on workshop data and measure how it works. At the end you design the architecture, assess the risks and export a report. The bar at the top of the page shows which step comes next.'))}</p>

 {id:'privacy',persona:'marek',link:['arch'],linkT:T('Architektura: gdzie przetwarzacie dane','Architecture: where you process the data'),title:T('Dane osobowe w reklamacji','Personal data in a complaint'),

function quizOf(t,key){return Object.hasOwn(t.quizzes,key)?t.quizzes[key]:null}
function quizDone(t,key){const Q=QUIZZES(),qs=Object.hasOwn(Q,key)?Q[key]:null,z=quizOf(t,key);return!!(qs&&z)&&qs.every(x=>Object.hasOwn(z.answers,x.id)&&z.answers[x.id]===x.answer)}
function quizFb(x,a){return a<0?'':a===x.answer?x.explain:`${(x.wrong&&Object.hasOwn(x.wrong,a))?x.wrong[a]:T('To nie ta odpowiedź.','That is not the right answer.')} ${T('Spróbujcie jeszcze raz.','Try again.')}`}
function paintQuiz(key){const box=$('#quiz .quiz');if(!box)return;const qs=QUIZZES()[key],z=quizOf(team(),key)||{answers:{}},ans=x=>Object.hasOwn(z.answers,x.id)?z.answers[x.id]:-1,score=qs.filter(x=>ans(x)===x.answer).length,done=score===qs.length;
 box.dataset.score=score;box.dataset.done=done;
 qs.forEach(x=>{const el=$(`[data-q="${x.id}"]`,box),a=ans(x),st=a<0?'open':a===x.answer?'right':'wrong';if(el.dataset.state===st&&+el.dataset.a===a)return;el.dataset.state=st;el.dataset.a=a;
  $$('[data-o]',el).forEach(b=>{const o=+b.dataset.o,sel=o===a;b.classList.toggle('sel',sel);b.classList.toggle('ok',sel&&st==='right');b.classList.toggle('no',sel&&st==='wrong');b.setAttribute('aria-pressed',sel);b.setAttribute('aria-disabled',st==='right')});
  $('.qz-fb',el).textContent=quizFb(x,a)});
 $('.qz-sum',box).textContent=done?T('Wszystko poprawnie – demonstracja zaliczona na ścieżce.','All correct – this demo is done on the path.'):T(`Poprawne odpowiedzi: ${score} z ${qs.length}. Demonstracja zalicza się po poprawnej odpowiedzi na wszystkie pytania.`,`Correct answers: ${score} of ${qs.length}. The demo counts as done once every question is answered correctly.`)}
function answerQuiz(key,qid,o){const x=QUIZZES()[key].find(q=>q.id===qid),t=team();if(!x)return;let z=quizOf(t,key);if(!z)z=t.quizzes[key]={answers:{},first:{},doneAt:''};
 if(Object.hasOwn(z.answers,qid)&&z.answers[qid]===x.answer)return;

 save();paintQuiz(key);renderProg()}

 split:{vision:T('W waszym laboratorium zdjęcia są już podzielone: 90 treningowych (z nich liczone są progi), 60 walidacyjnych (na nich stroicie suwaki) i 60 testowych (odsłaniacie je raz, na koniec).','In your lab the photos are already split: 90 for training (the thresholds are calibrated on them), 60 for validation (you tune the sliders on them) and 60 for the test (you reveal them once, at the end).'),

  complaints:T('U was zamiast zdjęć są zgłoszenia klientów: 36 w zestawie deweloperskim (na nich poprawiacie słowa kluczowe albo prompt) i 24 w zbiorze testowym, który odsłaniacie raz, na koniec. Wynik testu bywa niższy niż na zestawie deweloperskim – to normalne, a do raportu idzie wynik testu.','In your task the customer complaints play the role of the photos: 36 in the development set (you improve the keywords or the prompt on them) and 24 in the test set, which you reveal once, at the end. The test score is often lower than on the development set – that is normal, and the test score goes into the report.'),
  forecast:T('U was dzieli się według czasu, nie losowo: metody liczą prognozę z wcześniejszych miesięcy, a ostatnie miesiące (horyzont) są testem – udajemy, że ich jeszcze nie znamy. Losowy podział jak na zdjęciach byłby tu wyciekiem danych: metoda „widziałaby przyszłość”.','In your task the split is by time, not random: the methods forecast from the earlier months, and the last months (the horizon) are the test – we pretend we do not know them yet. A random split as with the photos would be data leakage here: the method would “see the future”.'),
  maint:T('U was dzieli się według czasu, nie losowo: minuty 0–300 to trening (z nich liczona jest norma maszyny), a minuty 300–600 to test, na którym sprawdzacie alarmy. Losowe mieszanie minut byłoby wyciekiem danych: sąsiednie minuty tej samej awarii trafiłyby do obu części.','In your task the split is by time, not random: minutes 0–300 are training (the machine’s normal behaviour is learned from them), and minutes 300–600 are the test on which you check the alarms. Mixing minutes at random would be data leakage: neighbouring minutes of the same breakdown would end up in both parts.')},
 metr:{vision:T('W waszym laboratorium główną liczbą jest F1: łączy precyzję i czułość z tej demonstracji w jeden wynik od 0 do 100% (więcej = lepiej). Obok widzicie też wprost, ile wadliwych puszek system przegapił i ile było fałszywych alarmów.','In your lab the main number is F1: it combines this demo’s precision and recall into one score from 0 to 100% (higher = better). Next to it you also see directly how many defective cans the system missed and how many false alarms there were.'),
  rag:T('U was miarą jest liczba poprawnych odpowiedzi (np. 14 z 24) oraz poprawnych odmów na pytania spoza dokumentów. Precyzja i czułość z tej demonstracji u was się nie pojawiają, ale kompromis jest ten sam: system, który odpowiada na wszystko, częściej zmyśla; system, który często odmawia, częściej nie pomaga.','In your task the measure is the number of correct answers (e.g. 14 of 24) and of correct refusals for questions beyond the documents. This demo’s precision and recall do not appear in your lab, but the trade-off is the same: a system that answers everything makes things up more often; a system that refuses often helps less often.'),
  complaints:T('U was główną liczbą jest trafność: w ilu zgłoszeniach system wybrał tę samą kategorię co człowiek. Metoda odniesienia „klasa większościowa” zawsze wybiera najczęstszą kategorię – to próg, który trzeba pobić. Ważniejsza dla klienta jest jednak druga liczba: ile zgłoszeń o bezpieczeństwie żywności system wykrył. To jest czułość z tej demonstracji – przegapione takie zgłoszenie jest groźniejsze niż zła kategoria.','In your task the main number is accuracy: in how many complaints the system chose the same category as a person. The “majority class” baseline always picks the most common category – that is the bar to beat. More important for the customer, though, is the second number: how many food-safety complaints the system detected. That is this demo’s recall – a missed complaint of that kind is more dangerous than a wrong category.'),
  forecast:T('U was miarą jest MAPE: średni błąd prognozy w procentach. MAPE 8% znaczy, że prognoza myli się średnio o 8% sprzedaży – przy 1000 sztuk o ok. 80 sztuk. Im mniej, tym lepiej. Liczy się porównanie z metodą odniesienia (średnią historyczną) na tym samym produkcie i horyzoncie. Precyzja i czułość z tej demonstracji u was nie występują.','In your task the measure is MAPE: the average forecast error in percent. MAPE 8% means the forecast is off by 8% of sales on average – about 80 units at 1,000. Lower is better. What counts is the comparison with the baseline (the historical mean) on the same product and horizon. This demo’s precision and recall do not appear in your task.'),
  maint:T('U was alarm działa jak w tej demonstracji: wynik powyżej progu = alarm. Czułość to część minut awarii, w których był alarm; fałszywe alarmy to minuty bez awarii z alarmem; F1 łączy jedno i drugie w jedną liczbę. Dla mechanika najważniejsze są jednak: ile całych awarii wykryto i ile minut po ich początku pojawił się alarm.','In your task the alarm works as in this demo: a score above the threshold = an alarm. Recall is the share of failure minutes that had an alarm; false alarms are minutes without a failure that had one; F1 combines both into one number. For a mechanic, though, what matters most is how many whole breakdowns were detected and how many minutes after their start the alarm came.')}});

const RAG_TEST_IDX=new Set([8,12,17,22,25,28,33,35]),RQ_DEV=RQ.filter((_,i)=>!RAG_TEST_IDX.has(i)),RQ_TEST=RQ.filter((_,i)=>RAG_TEST_IDX.has(i));
const RAG_IX={};
// A question may list one document or several, and one expected fact or several; an answer is good when every fact is there and no superseded value (`bad`) is given as current.
// The old value is forgiven only in a clause that marks it as superseded („wersja archiwalna podawała 2 lata”, „powrót do zwykłej nastawy (300…)”); anywhere else it makes the answer wrong.

function ragBuild(chunk){const li=langIx(),ch=[];DOCS.forEach(d=>{const ps=d.p[li];for(let i=0;i<ps.length;i+=chunk){ch.push({doc:d.id,title:d.t[li],par:(i+1)+(chunk>1?'–'+Math.min(i+chunk,ps.length):''),text:ps.slice(i,i+chunk).join(' ')})}});

 ch.forEach(c=>{c.w={};let n=0;for(const t in c.tf){c.w[t]=(1+Math.log(c.tf[t]))*Math.log(1+ch.length/df[t]);n+=c.w[t]**2}c.n=Math.sqrt(n)});return{ch,df}}

const RAG_SYS=()=>T('Jesteś asystentem pracowników firmy Rybex. Odpowiadaj wyłącznie na podstawie podanych fragmentów opisów procesów. Jeśli fragmenty nie zawierają odpowiedzi, ustaw "refused": true i napisz, że nie wiesz. Odpowiadaj krótko (jedno lub dwa zdania) po polsku i podaj źródła. Zwróć wyłącznie JSON: {"answer": "...", "sources": [{"doc": "PROCES-01", "par": "1"}], "refused": false}','You are an assistant for Rybex employees. Answer only from the process document passages provided. If the passages do not contain the answer, set "refused": true and say you do not know. Answer briefly (one or two sentences) in English and cite the sources. Return JSON only: {"answer": "...", "sources": [{"doc": "PROCES-01", "par": "1"}], "refused": false}');
const JUDGE_SYS=()=>T('Jesteś sędzią oceniającym odpowiedzi asystenta wiedzy firmy Rybex. Dostajesz pytanie, wzorcowy fragment procedury i odpowiedź asystenta. Oceń: "correct" – czy odpowiedź zawiera fakt z wzorcowego fragmentu potrzebny do odpowiedzi na pytanie; "grounded" – czy odpowiedź nie dodaje informacji spoza fragmentu. Zwróć wyłącznie JSON: {"correct": true, "grounded": true, "reason": "jedno krótkie zdanie"}','You are a judge grading answers of the Rybex knowledge assistant. You get the question, a reference procedure passage and the assistant answer. Grade: "correct" – does the answer contain the fact from the reference passage needed to answer the question; "grounded" – does the answer avoid adding information that is not in the passage. Return JSON only: {"correct": true, "grounded": true, "reason": "one short sentence"}');
const DOC_IDS=new Set(DOCS.map(d=>d.id));
const RAG_NOT_FOUND=()=>T('Nie znalazłem tej informacji w opisach procesów.','I could not find this in the process documents.');
// Each passage is labelled with its document's title, so a passage from the archived version is visibly archived to the model
const DOC_TITLE=id=>{const d=DOCS.find(x=>x.id===id);return d?d.t[langIx()]:''};
const ragMessages=(q,ps)=>[{role:'system',content:RAG_SYS()},{role:'user',content:`${T('Fragmenty','Passages')}:\n${ps.map(x=>`[${x.c.doc} §${x.c.par} · ${DOC_TITLE(x.c.doc)}] ${x.c.text}`).join('\n')}\n\n${T('Pytanie','Question')}: ${q}`}];
// A saved model run is current only for the same settings and the same documents and questions
const RAG_DATA_VER=[DOCS.length,DOCS.reduce((a,d)=>a+d.p[0].length,0),RQ.length].join('/');
const ragSig=(L,set)=>JSON.stringify([L.k,L.chunk,L.min,set,S.ai.model,S.lang,!!L.judge,RAG_DATA_VER]);
function ragClean(d){if(!isObj(d))return null;const answer=typeof d.answer==='string'?d.answer.trim().slice(0,600):'',refused=!!d.refused||!answer;
 return{answer:answer||T('Nie wiem.','I don’t know.'),refused,src:(Array.isArray(d.sources)?d.sources:[]).filter(x=>isObj(x)&&DOC_IDS.has(String(x.doc))).slice(0,6).map(x=>({doc:String(x.doc),par:String(x.par==null?'':x.par).slice(0,8)}))}}
// Retrieval decides what the model sees: only passages above min similarity, at most k. None left = refuse without a call.
async function ragLLMAsk(q,L,signal){const sc=ragAsk(q,L.chunk),ps=sc.filter(x=>x.s>=L.min).slice(0,L.k),sim=sc[0]?sc[0].s:0,top=sc.slice(0,L.k).map(x=>x.c.doc);
 if(!ps.length)return{a:RAG_NOT_FOUND(),src:[],refused:true,sim,top,ai:null,messages:null};
 const messages=ragMessages(q,ps),x=await callModel({messages,maxTokens:250,signal}),c=ragClean(x.data);
 return{a:c?c.answer:T('(model nie zwrócił poprawnego JSON)','(the model did not return valid JSON)'),src:c?c.src:[],refused:c?c.refused:false,sim,top,ai:aiUse(x),messages}}
// Reference for the judge: from every listed document the paragraphs holding an expected fact (the whole document when none matches)
function refPassage(r){const li=langIx(),oks=rqOks(r);return rqDocs(r).map(id=>{const d=DOCS.find(x=>x.id===id);if(!d)return'';const ps=d.p[li].filter(p=>oks.some(x=>x.test(p)));return(ps.length?ps:d.p[li]).join(' ')}).filter(Boolean).join('\n')}
async function ragJudge(r,q,a,signal){const x=await callModel({messages:[{role:'system',content:JUDGE_SYS()},{role:'user',content:`${T('Pytanie','Question')}: ${q}\n${T('Wzorcowy fragment','Reference passage')} (${rqDocs(r).join(', ')}): ${refPassage(r)}\n${T('Odpowiedź asystenta','Assistant answer')}: ${a}`}],maxTokens:120,signal}),d=x.data;
 return{v:isObj(d)?{correct:!!d.correct,grounded:!!d.grounded,reason:typeof d.reason==='string'?d.reason.slice(0,200):''}:null,ai:aiUse(x)}}
async function ragEvalLLM(L,set,{signal,onProgress}){const li=langIx(),items=set.map(r=>({r,q:r.q[li]})),ext=ragEval(L,set);
 const res=await runBatch(items,async it=>{const ans=await ragLLMAsk(it.q,L,signal),judge=L.judge&&!it.r.oos&&!ans.refused?await ragJudge(it.r,it.q,ans.a,signal):null;return{ans,judge}},{signal,onProgress});
 const failed=aiCheckFailed(res),rows=[],uses=[],byType={};let hit=0,ok=0,ref=0,precSum=0,baseOk=0,extOk=0,jn=0,agree=0;
 res.forEach((x,i)=>{const{r,q}=items[i];
  const docs=rqDocs(r),doc=docs.join(', ');
  if(!x.ok){rows.push({q,doc,type:r.type,oos:!!r.oos,a:aiErrText(x.kind),good:false,refused:false,err:true,src:[],judge:null});return}
  const{ans,judge}=x.value;if(ans.ai)uses.push(ans.ai);if(judge)uses.push(judge.ai);
  if(r.oos){if(ans.refused)ref++;rqTally(byType,'oos',{ok:ans.refused,baseOk:!literalBaseline(q),extOk:ext.rows[i].good});rows.push({q,doc:'',type:'oos',oos:true,a:ans.a,good:ans.refused,refused:ans.refused,src:ans.src,judge:null});return}
  const g=!ans.refused&&rqGood(r,ans.a),bg=rqGood(r,literalBaseline(q)),eg=ext.rows[i].good;if(docs.every(d=>ans.top.includes(d)))hit++;if(g)ok++;if(bg)baseOk++;if(eg)extOk++;rqTally(byType,r.type,{ok:g,baseOk:bg,extOk:eg});if(ans.src.length)precSum+=ans.src.filter(s=>docs.includes(s.doc)).length/ans.src.length;
  const jv=judge&&judge.v?judge.v:null;if(jv){jn++;if(jv.correct===g)agree++}
  rows.push({q,doc,type:r.type,oos:false,a:ans.a,good:g,refused:ans.refused,src:ans.src,judge:jv})});
 const okSet=set.filter((r,i)=>res[i].ok),n=okSet.filter(r=>!r.oos).length;
 return{failed,rows,res:{hit,ok,ref,n,nOos:okSet.length-n,prec:n?precSum/n:0,baseOk,extOk,byType},sum:aiSummary(uses),judgeN:L.judge?jn:null,agree:jn?agree/jn:null}}

const RAG_TYPE_WHY=k=>({direct:T('słowa pytania są w dokumencie, więc metody sobie radzą','the question uses the document’s words, so the methods cope'),para:T('pracownik pyta po swojemu („dekiel”, „ile ma stygnąć”), więc słowa nie pasują dosłownie','a worker asks in their own words (“lid”, “how long to cool”), so the words do not match literally'),multi:T('odpowiedź łączy fakty z dwóch dokumentów, a żadne zdanie nie ma obu','the answer joins facts from two documents and no single sentence holds both'),version:T('archiwum podaje starą wartość, która brzmi wiarygodnie, ale jest błędna','the archive gives an old value that sounds plausible but is wrong'),context:T('warunek stoi akapit wyżej niż wartość, więc mały fragment go gubi','the condition sits a paragraph above the value, so a small chunk loses it'),oos:T('odpowiedzi nie ma w dokumentach, więc dobra odpowiedź to odmowa','the documents have no answer, so the right answer is a refusal')})[k];
function ragTypesBlock(bt,cols,id){if(!isObj(bt))return'';const ks=RAG_TYPES.filter(k=>isObj(bt[k])&&bt[k].n>0);if(!ks.length)return'';
 return`<div class="rag-types mt"><h4 style="margin:0 0 8px">${T('Wyniki według typu pytania','Results by question type')}</h4><div class="tscroll"><table id="${id}"><thead><tr><th scope="col">${T('Typ pytania','Question type')}</th><th scope="col" class="num">${T('Pytań','Questions')}</th>${cols.map(([l])=>`<th scope="col" class="num">${l}</th>`).join('')}</tr></thead><tbody>${ks.map(k=>{const v=bt[k],vals=cols.map(([,f])=>+v[f]||0),hi=Math.max(...vals),all=vals.every(x=>x===hi);

 <ul class="hint rag-legend">${ks.map(k=>`<li><b>${RAG_TYPE_NAME(k)}</b>: ${RAG_TYPE_WHY(k)}.</li>`).join('')}</ul></div>`}

function cPred(text,kw){const l=text.toLowerCase();let b='other',bs=0;CK.forEach(c=>{const s=kw[c].split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).reduce((a,w)=>a+(l.includes(w)?1:0),0);if(s>bs){bs=s;b=c}});return b}
function cHazard(text,safety){const l=text.toLowerCase();return safety.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).some(w=>l.includes(w))}
function cEval(rows,kw){const pr=rows.map(r=>cPred(r.text,kw));return{pr,...cScore(rows,pr),maj:cMaj(rows)}}
const cMaj=rows=>{const cnt={};rows.forEach(r=>cnt[r.category]=(cnt[r.category]||0)+1);return Math.max(...Object.values(cnt))/rows.length};
function cScore(rows,pr){const acc=rows.filter((r,i)=>pr[i]===r.category).length/rows.length;
 const f1s=CK.map(c=>{const tp=rows.filter((r,i)=>pr[i]===c&&r.category===c).length,fp=rows.filter((r,i)=>pr[i]===c&&r.category!==c).length,fn=rows.filter((r,i)=>pr[i]!==c&&r.category===c).length;const p=tp/(tp+fp)||0,r=tp/(tp+fn)||0;return[c,p,r,p+r?2*p*r/(p+r):0,tp+fn]});
 return{acc,f1s,macro:f1s.reduce((a,x)=>a+x[3],0)/5}}
function cSafetyRecall(rows,safety){const g=rows.filter(r=>r.hazard);return g.length?g.filter(r=>cHazard(r.text,safety)).length/g.length:1}
const cSafetyFalse=(rows,safety)=>rows.filter(r=>!r.hazard&&cHazard(r.text,safety)).length;
function draftFor(text,kw,safety){const h=cHazard(text,safety);return{h,text:h?REPLY('smell'):REPLY(cPred(text,kw))}}

const COMPL_GUIDE=()=>T('1. Uszkodzenie powstałe w transporcie (kurier, zgnieciony karton, paleta, przemoknięte opakowanie) to kategoria „Dostawa / faktura”: szkodę pokrywa przewoźnik.\n2. Gdy zgłoszenie opisuje kilka problemów, kategorię wybiera się według priorytetu, a nie kolejności w tekście: zapach / świeżość > uszkodzenie puszki > etykieta / kod > jakość produktu > dostawa / faktura.\n3. Zagrożenie bezpieczeństwa żywności (PROCES-04) oznacza się niezależnie od kategorii: zapach, wybrzuszona lub wypukła puszka, syk przy otwieraniu, podejrzenie zatrucia.','1. Damage caused in transport (courier, crushed carton, pallet, soaked packaging) is “Delivery / invoice”: the carrier pays for it.\n2. When a complaint describes several problems, the category follows priority, not the order in the text: smell / freshness > damaged can > label / code > product quality > delivery / invoice.\n3. A food-safety hazard (PROCES-04) is flagged regardless of category: smell, bulging or domed can, hissing on opening, suspected poisoning.');
const complGuideHTML=()=>`<details class="mt" id="cGuide"><summary>${T('Instrukcja oznaczania: jak dział reklamacji nadał etykiety w tych danych','Labelling guideline: how the complaints team labelled this data')}</summary><pre style="white-space:pre-wrap">${esc(COMPL_GUIDE())}</pre><p class="hint">${T('Etykiety wynikają z procesu w firmie, nie tylko z treści zgłoszenia. Model zna tylko to, co dostanie w prompcie i przykładach.','Labels follow company process, not only the complaint text. A model knows only what it gets in the prompt and examples.')}</p></details>`;
const COMPL_PROMPT=()=>T(`Jesteś asystentem działu reklamacji firmy Rybex (konserwy rybne). Dla zgłoszenia klienta:
1. Przypisz jedną kategorię: damage (uszkodzenie puszki), label (etykieta lub kod partii), quality (jakość produktu), delivery (dostawa lub faktura), smell (zapach lub świeżość).
2. Ustaw "hazard": true, jeśli zgłoszenie dotyczy zapachu, wybrzuszenia puszki lub podejrzenia zatrucia (PROCES-04: potencjalne zagrożenie bezpieczeństwa żywności).
3. Napisz krótki projekt odpowiedzi do klienta po polsku (2–3 zdania). Przy zagrożeniu poproś, by nie spożywać produktu i zachować puszkę z numerem partii.

 for(let i=0;i<n;i++){idx[(10+i)%12]+=y[i]/(a+b*i);cnt[(10+i)%12]++}const id=idx.map((v,i)=>v/Math.max(1,cnt[i])),ma=y.slice(-w).reduce((a,b)=>a+b,0)/w,o={mean:[],naive:[],snaive:[],ma:[],ts:[]};

function mtCompute(c){const rows=DATA.sensors,keys=Object.keys(c.f).filter(k=>c.f[k]),tr=rows.slice(0,300).filter(r=>!r.anomaly),st={};Object.keys(c.f).forEach(k=>{const v=tr.map(r=>r[k]),m=v.reduce((a,b)=>a+b,0)/v.length;st[k]=[m,Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)]});
 const z0=rows.map(r=>Math.max(0,...keys.map(k=>Math.abs(r[k]-st[k][0])/st[k][1]))),z=z0.map((v,i)=>{const s=z0.slice(Math.max(0,i-c.win+1),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
 // Minute counts feed precision/recall/F1; ev.caught/ev.total count whole breakdowns (a band of failure minutes) with at least one alarm, ev.delay = mean minutes from the start of a caught breakdown to its first alarm.
 const bands=[];for(let i=300,s=-1;i<600;i++){if(rows[i].anomaly&&s<0)s=i;if(s>=0&&(!rows[i].anomaly||i===599)){bands.push([s,rows[i].anomaly?i:i-1]);s=-1}}
 const ev=pf=>{let tp=0,fp=0,fn=0,tn=0;for(let i=300;i<600;i++){const p=pf(i),a=rows[i].anomaly;if(p&&a)tp++;else if(p)fp++;else if(a)fn++;else tn++}
  const d=bands.map(([s,e])=>{for(let i=s;i<=e;i++)if(pf(i))return i-s;return null}).filter(x=>x!=null);
  return{...prf(tp,fp,fn,tn),ev:{caught:d.length,total:bands.length,delay:d.length?d.reduce((a,b)=>a+b,0)/d.length:null}}};return{rows,keys,z,m:ev(i=>z[i]>c.thr),bl:ev(i=>rows[i].vibration_mm_s>4)}}

 vision:{id:'vision_borderline',title:T('Najtrudniejsze puszki','The hardest cans'),task:T(`Złapcie na zbiorze walidacyjnym wszystkie wady każdego typu: w tabeli analizy błędów każdy typ ma wynik pełny, np. 6 / 6. Wyzwanie jest zaliczone, gdy fałszywych alarmów jest przy tym najwyżej ${CH.visFp}. Szukajcie progu, przy którym przypadki graniczne przestają udawać wadę, a żadna prawdziwa wada nie umyka.`,`Catch every defect of every type on the validation set: in the error analysis table each type shows a full score, e.g. 6 / 6. The challenge is passed when, at the same time, there are at most ${CH.visFp} false alarms. Look for the threshold at which borderline cans stop passing for defects while no real defect slips through.`),lesson:T('Ostatnie fałszywe alarmy to przypadki graniczne, które wyglądają prawie jak wada: każdy krok progu, który je usuwa, może przepuścić prawdziwą wadę.','The last false alarms are borderline cans that look almost like a defect: every step of the threshold that removes them can let a real defect through.')},

 forecast:{id:'fc_horizon',title:T('Dłuższy horyzont','A longer horizon'),task:T(`Ustawcie horyzont na ${CH.fcLong} miesięcy: metody mają wtedy mniej miesięcy do nauki. Znajdźcie metodę, która przy ${CH.fcShort} miesiącach biła średnią historyczną o więcej niż 1 pkt proc., a przy ${CH.fcLong} już jej nie bije albo bije o mniej niż 1 pkt proc., i włączcie ją na wykresie. Możecie zmieniać produkt i okno średniej ruchomej.`,`Set the horizon to ${CH.fcLong} months: the methods then have fewer months to learn from. Find a method that beat the historical mean by more than 1 pp at ${CH.fcShort} months but at ${CH.fcLong} no longer beats it, or beats it by less than 1 pp, and switch it on in the chart. You may change the product and the moving-average window.`),lesson:T('Wynik z krótkiego horyzontu nie przenosi się na dłuższy: oceniajcie metodę na takim horyzoncie, na jakim firma naprawdę będzie korzystać z prognozy.','A result on a short horizon does not carry over to a longer one: judge a method on the horizon the company will actually use the forecast for.')},

 if(id==='fc_horizon'){const L=lab().fc;if(L.h!==CH.fcLong)return{pass:false,msg:T(`Horyzont: ${L.h} mies. – ustawcie ${CH.fcLong}.`,`Horizon: ${L.h} months – set it to ${CH.fcLong}.`)};
  const Rl=fcCompute(L),Rs=fcCompute({...L,h:CH.fcShort}),c=Rl.keys.filter(k=>k!=='mean'&&Rs.mt[k].mape<Rs.mt.mean.mape-CH.fcPp&&Rl.mt[k].mape>Rl.mt.mean.mape-CH.fcPp),on=c.filter(k=>L.show[k]);

  falseAlarms:{id:'falseAlarms',t:T('Odsetek fałszywych alarmów','The share of false alarms'),fb:T('Widzicie, czy operatorzy nie toną w alarmach – gdy odsetek rośnie, przestaną na nie patrzeć. Nie zobaczycie za to przeoczeń: wada, której system nie zgłosił, nie trafia do żadnej statystyki alarmów.','You see whether the operators are drowning in alarms – when the share grows, they stop looking. What you will not see are the misses: a defect the system never flagged does not show up in any alarm statistic.')},

function GO_LIVE_DECISIONS(t=team()){const c=t.track==='complaints';return[
 {id:'runWhere',q:c?T('Reklamacje z danymi kontaktowymi klienta: gdzie ma działać model?','Complaints with the customer’s contact details: where should the model run?'):T('Gdzie ma działać model: w zakładzie czy w chmurze?','Where should the model run: in the plant or in the cloud?'),options:[
  {id:'local',t:T('Lokalnie, na serwerze w zakładzie','Locally, on a server in the plant'),fb:T('Dane klientów i zdjęcia z linii nie wychodzą z zakładu, więc rozmowa z działem RODO jest prosta. Za to serwer, aktualizacje i awarie są wasze: gdy serwer stanie w nocy, ktoś z IT musi przyjechać, a duży model językowy może tu działać wolniej albo wcale.','Customer data and line photos never leave the plant, so the talk with the data protection officer is simple. But the server, the updates and the breakdowns are yours: when the server stops at night someone from IT has to drive in, and a large language model may run slower here or not at all.')},
  {id:'cloud',t:T('W chmurze, przez API dostawcy','In the cloud, through the provider’s API'),fb:T('Najszybszy start i najmocniejsze modele, płacicie za użycie. Ale wszystko, co wysyłacie – reklamacja z imieniem, telefonem i adresem albo zdjęcie z linii – trafia do innej firmy, a bez łącza z internetem system przy linii nie działa.','The fastest start and the strongest models, you pay per use. But everything you send – a complaint with a name, a phone number and an address, or a photo from the line – goes to another company, and without an internet link the system by the line does not work.')},
  {id:'hybrid',t:T('Hybrydowo: wrażliwe lokalnie, reszta w chmurze','Hybrid: sensitive data locally, the rest in the cloud'),fb:T('Kompromis: to, co wrażliwe, zostaje w zakładzie, cięższe zadania idą do chmury. Płacicie złożonością: ktoś musi pilnować, co dokładnie przechodzi przez granicę, i utrzymywać dwa miejsca naraz.','A compromise: sensitive data stays in the plant, heavier jobs go to the cloud. You pay in complexity: someone has to watch exactly what crosses the boundary and keep two places running at once.')}]},
 {id:'stopAuthority',...STOP_DECISION(t)},
 {id:'monitor',q:T('Po wdrożeniu: co oglądacie co tydzień?','After go-live: what do you look at every week?'),options:MONITOR_OPTIONS(t)},
 {id:'reviewEvery',q:T('Jak często wracacie do oceny modelu?','How often do you go back and evaluate the model?'),options:[
  {id:'weekly',t:T('Co tydzień','Every week'),fb:T('Szybko łapiecie zmiany, ale ktoś musi co tydzień poświęcić godzinę na nowe przykłady i pomyłki. Bez wyznaczonej osoby ten przegląd zniknie z kalendarza po miesiącu.','You catch changes quickly, but someone has to spend an hour every week on new examples and mistakes. Without a named person this review drops out of the calendar within a month.')},
  {id:'quarterly',t:T('Raz na kwartał','Once a quarter'),fb:T('Mniej pracy i spokojny rytm. Jeśli jednak zmieni się etykieta albo dostawca puszek, system może się mylić tygodniami, zanim ktoś to zauważy – chyba że monitoring zgłosi to wcześniej.','Less work and a calm rhythm. But if the label or the can supplier changes, the system may be wrong for weeks before anyone notices – unless monitoring flags it earlier.')},
  {id:'never',t:T('Nie wracamy – oceniliśmy go przed startem','We don’t – we evaluated it before go-live'),fb:T('Ocena sprzed startu mówi, jak system działał na danych z warsztatów. Produkty, procedury i klienci się zmieniają, a bez ponownej oceny nikt nie powie, czy liczby z raportu są jeszcze prawdziwe.','The evaluation before go-live tells you how the system did on the workshop data. Products, procedures and customers change, and without a fresh evaluation nobody can say whether the numbers in the report still hold.')}]}]}
// Decision 2 follows the track: who confirms the system's output before it acts. Option ids stay system/operator/quality.
function STOP_DECISION(t){const k=t.track,hitl=!!t.arch.sel.hitl,o=(a,b,c)=>[{id:'system',t:a[0],fb:a[1]},{id:'operator',t:b[0],fb:b[1]},{id:'quality',t:c[0],fb:c[1]}],
 D={complaints:{q:T('Model proponuje kategorię i projekt odpowiedzi na reklamację. Kto zatwierdza odpowiedź, zanim trafi do klienta?','The model suggests a category and a draft reply to a complaint. Who approves the reply before it goes to the customer?'),lead:T('Błędna odpowiedź na reklamację o bezpieczeństwie żywności to sprawa dla działu jakości, nie dla szablonu.','A wrong reply to a food-safety complaint is a matter for the quality department, not for a template.'),options:o(
   [T('Tylko system – odpowiedź wychodzi sama','The system alone – the reply goes out by itself'),T('Klient dostaje odpowiedź od razu, bez kolejki w biurze obsługi. Ale gdy model źle odczyta zgłoszenie o zapachu albo wybrzuszonej puszce, klient dostanie uprzejmy szablon zamiast pilnej reakcji, a dział jakości o niczym się nie dowie. Gdy sieć zapyta, kto zatwierdził tę odpowiedź, odpowiedź brzmi: nikt.','The customer gets a reply at once, with no queue in customer service. But when the model misreads a complaint about a smell or a bulging can, the customer gets a polite template instead of an urgent response, and the quality department never hears of it. When the retail chain asks who approved that reply, the answer is: nobody.')],
   [T('Pracownik biura obsługi klienta','A customer service employee'),T('Pracownik czyta projekt odpowiedzi i poprawia go w minutę, więc pomyłka modelu nie wychodzi do klienta. Ale po zwrocie partii reklamacji przybywa i kolejka rośnie, a pracownik musi rozpoznać zgłoszenie o bezpieczeństwie żywności i wiedzieć, komu je przekazać.','The employee reads the draft reply and fixes it within a minute, so a model error never reaches the customer. But after a lot is returned the complaints pile up and the queue grows, and the employee has to recognise a food-safety complaint and know whom to pass it to.')],
   [T('Dział jakości','The quality department'),T('Najbardziej fachowa ocena, zwłaszcza zgłoszeń o bezpieczeństwie żywności. Ale dział jakości nie siedzi nad skrzynką reklamacji: odpowiedzi czekają dniami, a klient dzwoni ponownie. To pasuje do zgłoszeń oznaczonych jako zagrożenie, nie do wszystkich.','The most expert judgement, especially of food-safety complaints. But the quality department does not sit over the complaints inbox: replies wait for days and the customer calls again. This suits the complaints flagged as a hazard, not all of them.')])},
  rag:{q:T('Asystent odpowiada na pytanie o procedurę. Kto sprawdza odpowiedź, zanim pracownik zacznie według niej działać?','The assistant answers a question about a procedure. Who checks the answer before a worker acts on it?'),lead:T('Procedura wykonana według błędnej odpowiedzi trafia od razu na linię.','A procedure carried out from a wrong answer goes straight onto the line.'),options:o(
   [T('Nikt – pracownik działa od razu','Nobody – the worker acts at once'),T('Odpowiedź jest od razu, nocna zmiana nie czeka na nikogo. Ale gdy asystent pomyli procedurę albo poda starą wersję, pracownik wykona ją na linii, a w dokumentacji nie będzie śladu, kto ją sprawdził.','The answer comes at once, the night shift waits for nobody. But when the assistant mixes up a procedure or gives an old version, the worker carries it out on the line, and the records show no trace of who checked it.')],
   [T('Brygadzista zmiany','The shift supervisor'),T('Brygadzista zna linię i w kilka minut porówna odpowiedź ze źródłem, które wskazuje asystent. Ale to on bierze decyzję na siebie i musi mieć czas, żeby naprawdę zajrzeć do procedury, a nie tylko kliknąć „zgoda”.','The supervisor knows the line and within minutes compares the answer with the source the assistant points to. But the decision is theirs, and they need the time to actually open the procedure, not just click “OK”.')],
   [T('Dział jakości, właściciel procedur','The quality department, owner of the procedures'),T('Najpewniejsza kontrola, bo sprawdza ją autor procedur. Ale na nocnej zmianie nikogo z jakości nie ma, a pytanie o mycie albo przezbrojenie czeka do rana. To pasuje do pytań o bezpieczeństwo żywności, nie do codziennych.','The surest check, because the author of the procedures does it. But on the night shift nobody from quality is there, and a question about cleaning or a changeover waits until morning. This suits questions about food safety, not everyday ones.')])},
  forecast:{q:T('Prognoza zasila plan produkcji na kolejne miesiące. Kto zatwierdza plan, zanim pójdzie na linię?','The forecast feeds the production plan for the coming months. Who approves the plan before it goes to the line?'),lead:T('Plan zbudowany na złej prognozie to pełny magazyn albo puste półki w sezonie.','A plan built on a wrong forecast means a full warehouse or empty shelves in the season.'),options:o(
   [T('Tylko system – plan wynika wprost z prognozy','The system alone – the plan follows straight from the forecast'),T('Plan jest gotowy od razu i nikt nie musi go przeliczać. Ale prognoza nie zna promocji, nowej sieci ani kłopotów dostawcy: gdy się pomyli, zakład wyprodukuje za dużo puszek albo zabraknie ich w sezonie, a nikt nie będzie wiedział, kto ten plan przyjął.','The plan is ready at once and nobody has to recalculate it. But the forecast knows nothing of promotions, a new retail chain or a supplier’s trouble: when it is wrong the plant makes too many cans or runs out in the season, and nobody will know who accepted the plan.')],
   [T('Planista produkcji','The production planner'),T('Planista patrzy na prognozę i poprawia ją o to, co wie od handlowców, więc plan łączy liczby z wiedzą o rynku. Ale musi rozumieć, jak duży jest błąd prognozy, i mieć prawo ją zmienić – inaczej tylko podpisuje to, co policzył system.','The planner looks at the forecast and corrects it with what the sales team knows, so the plan joins the numbers with knowledge of the market. But they have to understand how large the forecast error is and have the right to change it – otherwise they only sign what the system calculated.')],
   [T('Kierownik zakładu ze sprzedażą','The plant manager with sales'),T('Decyzja zapada wyżej i bierze pod uwagę sprzedaż i zapasy. Ale spotkanie trzeba zwołać, a plan czeka; w sezonie kilka dni zwłoki to puste półki albo pełny magazyn. To pasuje do dużych zmian planu, nie do każdej poprawki.','The decision is taken higher up and weighs sales and stock. But the meeting has to be called and the plan waits; in the season a few days of delay mean empty shelves or a full warehouse. This suits large changes to the plan, not every correction.')])},
  maint:{q:T('Alarm z czujników wskazuje awarię retortu albo pompy. Kto decyduje o zatrzymaniu maszyny?','A sensor alarm points to a retort or pump failure. Who decides to stop the machine?'),lead:T('Retort zatrzymany w połowie cyklu to zablokowana partia, a przeoczona awaria to zepsuta maszyna.','A retort stopped halfway through a cycle means a blocked lot, and a missed failure means a broken machine.'),options:o(
   [T('Tylko system – maszyna staje sama','The system alone – the machine stops by itself'),T('Maszyna staje od razu, zanim awaria się rozwinie. Ale każdy fałszywy alarm przerywa cykl sterylizacji, a partię z przerwanego cyklu trzeba zablokować. Za zatrzymanie retortu nie odpowiada żaden człowiek, więc nikt nie wyjaśni, dlaczego cykl przerwano.','The machine stops at once, before the failure develops. But every false alarm breaks off a sterilisation cycle, and the lot from a broken-off cycle has to be blocked. No person is responsible for stopping the retort, so nobody can explain why the cycle was broken off.')],
   [T('Operator maszyny','The machine operator'),T('Operator widzi alarm, sprawdza odczyty i maszynę na miejscu, więc fałszywy alarm kosztuje chwilę. Ale na nocnej zmianie decyzja jest jego: musi wiedzieć, które odczyty są groźne, i mieć prawo zatrzymać maszynę.','The operator sees the alarm and checks the readings and the machine on the spot, so a false alarm costs a moment. But on the night shift the decision is theirs: they have to know which readings are dangerous and have the right to stop the machine.')],
   [T('Dział utrzymania ruchu','The maintenance department'),T('Najbardziej fachowa diagnoza, ale mechanik nie stoi przy każdej maszynie. W nocy ktoś musi go wezwać, a maszyna w tym czasie pracuje dalej z narastającą usterką. To pasuje do rzadkich, nietypowych alarmów.','The most expert diagnosis, but the mechanic is not standing by every machine. At night someone has to call them in, and meanwhile the machine keeps running with a growing fault. This suits rare, unusual alarms.')])}},
 d=Object.hasOwn(D,k)?D[k]:{q:T('Alarm wizyjny zatrzymuje linię. Kto ma prawo to potwierdzić?','A vision alarm stops the line. Who has the right to confirm it?'),lead:T('W żywności fałszywy alarm kosztuje godzinę produkcji, ale pomyłka systemu bez człowieka może wypuścić partię albo zbędnie zatrzymać zakład.','In food production a false alarm costs an hour of output, but a system error with no person involved can let a lot go out or stop the plant for nothing.'),options:o(
   [T('Tylko system','The system alone'),T('Linia staje od razu, bez czekania na człowieka. Każdy fałszywy alarm to godzina produkcji w plecy, a gdy system przeoczy wadę, nikt nie zatrzyma partii. Dział zgodności zapyta, kto zatrzymał linię, a za tę decyzję nie odpowiada żaden człowiek.','The line stops at once, without waiting for a person. Every false alarm costs an hour of production, and when the system misses a defect nobody stops the lot. Compliance will ask who stopped the line, and no person is responsible for that decision.')],[T('Operator na tablecie','The operator on a tablet'),T('Operator przy linii patrzy na zdjęcie i potwierdza w kilka sekund, więc fałszywy alarm kosztuje chwilę, nie godzinę. Ale na nocnej zmianie to on bierze decyzję na siebie: musi wiedzieć, na co patrzeć, i mieć prawo zatrzymać linię.','The operator by the line looks at the photo and confirms within seconds, so a false alarm costs a moment, not an hour. But on the night shift the decision is theirs: they have to know what to look for and have the right to stop the line.')],[T('Dział jakości','The quality department'),T('Najbardziej fachowa decyzja, ale dział jakości nie stoi przy linii. W nocy ktoś musi zadzwonić i obudzić kierownika jakości, a linia w tym czasie czeka. Pewność kosztuje czas, więc to pasuje do rzadkich, poważnych alarmów.','The most expert decision, but the quality department is not by the line. At night someone has to phone and wake the quality manager, and the line waits meanwhile. Certainty costs time, so this suits rare, serious alarms.')])};
 return{q:d.q,note:d.lead+' '+(hitl?T('W schemacie macie już komponent „Weryfikacja przez człowieka”.','Your diagram already has the «Human-in-the-loop» component.'):T('W schemacie nie ma jeszcze komponentu „Weryfikacja przez człowieka” – możecie go dodać.','Your diagram does not have the «Human-in-the-loop» component yet – you can add it.')),fix:hitl?null:'hitl',options:d.options}}
// The stored answer when it is one of the decision's options, else null.
function goLiveAns(t,id){const d=GO_LIVE_DECISIONS(t).find(x=>x.id===id),v=Object.hasOwn(t.arch.decisions,id)?t.arch.decisions[id]:null;return d&&d.options.some(o=>o.id===v)?v:null}
const goLiveCount=t=>GO_LIVE_DECISIONS(t).filter(d=>goLiveAns(t,d.id)).length;
// Consistency with the diagram (LANES ids): personal data leaving the plant needs 'anon' (access control 'acl' only
// governs who inside the plant sees the data, so it does not clear the warning); human verification is 'hitl'.
function goLiveWarnings(t){const a=t.arch,rw=goLiveAns(t,'runWhere'),w=[];
 if((t.track==='complaints'||t.track==='rag')&&(rw==='cloud'||rw==='hybrid')&&!a.sel.anon)w.push('privacy');
 if(goLiveAns(t,'stopAuthority')&&!a.sel.hitl)w.push('hitl');
 if(goLiveAns(t,'monitor')==='nothing')w.push('monitor');return w}
// Which decision each warning sits next to, and the diagram component its button adds (none for monitoring).
// The human-in-the-loop button sits in decision 2's note while the diagram lacks the component, so the warning does not repeat it.
const GL_WARN_AT={privacy:'runWhere',hitl:'stopAuthority',monitor:'monitor'},GL_FIX={privacy:['anon','local']};
const glFixBtn=f=>`<button type="button" class="btn-ghost btn-sm" data-fix="${f}">${ic(f==='local'?'server':'plus')}${GL_FIX_TXT(f)}</button>`;
function GO_LIVE_WARN_TXT(t,k){return({privacy:()=>(t.track==='rag'?T('Pytania pracowników i dokumenty mogą zawierać nazwiska i dane osobowe.','Staff questions and documents may contain names and personal data.'):T('Reklamacje zawierają dane kontaktowe klientów.','Complaints contain customers’ contact details.'))
  +' '+T('Przy tym wyborze trafią do modelu poza zakładem. Wytnijcie lub zamaskujcie dane osobowe przed wysłaniem albo przetwarzajcie lokalnie.','With this choice they will reach a model outside the plant. Cut out or mask the personal data before sending, or process locally.')
  +(goLiveAns(t,'runWhere')==='hybrid'?' '+T('W wariancie hybrydowym pilnujcie, co przechodzi przez granicę zakładu.','In the hybrid setup, watch what crosses the plant’s boundary.'):'')
  +(t.arch.sel.acl?' '+T('Uprawnienia i audyt mówią, kto w zakładzie widzi dane – nie zmieniają tego, co wychodzi na zewnątrz.','Access control and audit say who inside the plant sees the data – they do not change what leaves it.'):''),
 hitl:()=>hitlWarn(t),
 monitor:()=>T('Uwaga: bez monitoringu spadek jakości zobaczycie dopiero w zwrotach i reklamacjach od sieci.','Warning: without monitoring you will only see a drop in quality in the returns and complaints from the retail chains.')})[k]()}
// The human-check warning follows decision 2's wording per track; vision keeps the line-stop text.
function hitlWarn(t){const sys=goLiveAns(t,'stopAuthority')==='system',W={
 complaints:[T('Uwaga: odpowiedź wychodzi do klienta, zanim przeczyta ją człowiek, a w schemacie nie ma weryfikacji przez człowieka. Błędnej odpowiedzi nikt nie zatrzyma, a zgłoszenia o bezpieczeństwie żywności nikt nie wyłapie.','Warning: the reply goes to the customer before a person reads it, and the diagram has no human-in-the-loop. Nobody can stop a wrong reply or catch a food-safety complaint.'),T('Uwaga: odpowiedź ma zatwierdzać człowiek, ale w schemacie nie ma komponentu „Weryfikacja przez człowieka”. Schemat i decyzja mówią co innego.','Warning: a person is meant to approve the reply, but the diagram has no «Human-in-the-loop» component. The diagram and the decision say different things.')],
 rag:[T('Uwaga: pracownik działa według odpowiedzi o procedurze, której nikt nie sprawdził, a w schemacie nie ma weryfikacji przez człowieka. Pomylonej albo nieaktualnej procedury nikt nie wyłapie.','Warning: a worker acts on an answer about a procedure that nobody checked, and the diagram has no human-in-the-loop. Nobody will catch a mixed-up or outdated procedure.'),T('Uwaga: odpowiedź o procedurze ma sprawdzać człowiek, ale w schemacie nie ma komponentu „Weryfikacja przez człowieka”. Schemat i decyzja mówią co innego.','Warning: a person is meant to check the answer about a procedure, but the diagram has no «Human-in-the-loop» component. The diagram and the decision say different things.')],
 forecast:[T('Uwaga: plan produkcji zostaje przyjęty bez niczyjej akceptacji, a w schemacie nie ma weryfikacji przez człowieka. Błędu prognozy nikt nie poprawi przed produkcją.','Warning: the production plan is adopted without anyone approving it, and the diagram has no human-in-the-loop. Nobody corrects a forecast error before production.'),T('Uwaga: plan produkcji ma zatwierdzać człowiek, ale w schemacie nie ma komponentu „Weryfikacja przez człowieka”. Schemat i decyzja mówią co innego.','Warning: a person is meant to approve the production plan, but the diagram has no «Human-in-the-loop» component. The diagram and the decision say different things.')],
 maint:[T('Uwaga: system sam zatrzymuje maszynę, a w schemacie nie ma weryfikacji przez człowieka. Fałszywego alarmu nikt nie odwoła, a przeoczonej awarii nikt nie zauważy.','Warning: the system stops the machine on its own and the diagram has no human-in-the-loop. Nobody can overrule a false alarm or notice a missed failure.'),T('Uwaga: o zatrzymaniu maszyny ma decydować człowiek, ale w schemacie nie ma komponentu „Weryfikacja przez człowieka”. Schemat i decyzja mówią co innego.','Warning: a person is meant to decide on stopping the machine, but the diagram has no «Human-in-the-loop» component. The diagram and the decision say different things.')]},
 w=Object.hasOwn(W,t.track)?W[t.track]:[T('Uwaga: system sam zatrzymuje linię, a w schemacie nie ma weryfikacji przez człowieka. Fałszywego alarmu nikt nie odwoła, a przeoczenia nikt nie zauważy.','Warning: the system stops the line on its own and the diagram has no human-in-the-loop. Nobody can overrule a false alarm or notice a miss.'),T('Uwaga: zatrzymanie ma potwierdzać człowiek, ale w schemacie nie ma komponentu „Weryfikacja przez człowieka”. Schemat i decyzja mówią co innego.','Warning: a person is meant to confirm the stop, but the diagram has no «Human-in-the-loop» component. The diagram and the decision say different things.')];
 return w[sys?0:1]}
const GL_FIX_TXT=k=>({anon:T('Dodajcie do schematu: anonimizacja danych osobowych','Add to the diagram: personal-data anonymisation'),local:T('Przełącz na przetwarzanie lokalne','Switch to local processing'),hitl:T('Dodajcie do schematu: weryfikacja przez człowieka','Add to the diagram: human-in-the-loop')})[k];
function goLiveHTML(){const D=GO_LIVE_DECISIONS();
 return`<div id="goLive" data-total="${D.length}" data-answered="0" data-warn="">${personaQuote('hanna','go_live')}<p class="gl-lead">${T('Cztery decyzje przed wejściem na linię. Nie ma tu dobrych ani złych odpowiedzi – każda ma swoją cenę, którą zobaczycie od razu. Odpowiedź można zmienić; wszystkie trafiają do raportu.','Four decisions before going live on the line. There are no right or wrong answers here – each one has a price, which you see at once. You can change an answer; all of them go into the report.')}</p><div class="gl-list">`
 +D.map((d,i)=>`<div class="gl-d" data-d="${d.id}">${card('signpost',`${i+1}. ${glx(d.q)}`,`${d.note?`<div class="gl-note"></div>`:''}<div class="gl-opts" role="group" aria-label="${esc(d.q)}">${d.options.map(o=>`<button type="button" class="btn-ghost gl-o" data-o="${o.id}" aria-pressed="false">${o.t}</button>`).join('')}</div><p class="fb" aria-live="polite"></p><div class="gl-warn" aria-live="polite"></div>`)}</div>`).join('')+`</div></div>`}
function paintGoLive(){const box=$('#goLive');if(!box)return;const t=team(),w=goLiveWarnings(t);box.dataset.answered=goLiveCount(t);box.dataset.warn=w.join(' ');
 GO_LIVE_DECISIONS(t).forEach(d=>{const c=$(`[data-d="${d.id}"]`,box),a=goLiveAns(t,d.id),o=d.options.find(x=>x.id===a),fb=$('.fb',c),wb=$('.gl-warn',c);if(a)c.dataset.choice=a;else delete c.dataset.choice;
  const nt=$('.gl-note',c),ns=d.note?d.note+'|'+d.fix:'';if(nt&&nt.dataset.sig!==ns){nt.dataset.sig=ns;nt.innerHTML=`<p class="hint">${glx(d.note)}</p>${d.fix?`<div class="row gl-fix">${glFixBtn(d.fix)}</div>`:''}`;icons(nt)}

 ['decisions',T('Decyzje wdrożeniowe','Go-live decisions'),s=>of(s.decisions,s.decisionsOf)],['noteCount',T('Notatki','Notes'),s=>String(s.noteCount)],
 ['newsRead',T('Aktualność przeczytana','News read'),s=>yn(s.newsRead),1],['intranetOpened',T('Intranet otwarty','Intranet opened'),s=>yn(s.intranetOpened),1],['contactSent',T('Formularz kontaktowy wysłany','Contact form sent'),s=>yn(s.contactSent),1]]}
// Rows: [attributes, first cell, summary]. The slots read S.teams directly, so the example copy is never listed.
const trSlotRows=()=>Array.from({length:TEAM_COUNT},(_,i)=>{const n=i+1,t=Object.hasOwn(S.teams,n)?S.teams[n]:defaultTeam(),s=teamSummary(t);return[{slot:n},`${n}. ${s.name||T('(bez nazwy)','(no name)')}`,s]});
const trFileRows=()=>(X.trFiles||[]).map(f=>{const s=teamSummary(f.team);return[{file:f.file},`${s.name||T('(bez nazwy)','(no name)')} – ${f.file}`,s]});
function trTable(id,first,rows,empty){const C=trCols();
 return`<div class="tscroll"><table id="${id}"><thead><tr><th scope="col">${first}</th>${C.map(c=>`<th scope="col">${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(([a,h,s])=>`<tr ${Object.entries(a).map(([k,v])=>`data-${k}="${esc(String(v))}"`).join(' ')}><td>${esc(h)}</td>${C.map(c=>`<td data-col="${c[0]}"${c[3]?` data-v="${s[c[0]]}"`:''}>${esc(c[2](s))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length?'':`<p class="hint" id="${id}Empty">${empty}</p>`}`}
// A cell that a spreadsheet would read as a formula (= + - @ tab CR first) gets a leading apostrophe and quotes.
function trCSV(){const C=trCols(true),q=v=>{const f=/^[=+\-@\t\r]/.test(v);if(f)v="'"+v;return f||/[;"\n\r]/.test(v)?`"${v.replace(/"/g,'""')}"`:v},line=a=>a.map(x=>q(String(x))).join(';'),
  part=(title,first,rows)=>[line([title]),line([first,...C.map(c=>c[1])]),...rows.map(([,h,s])=>line([h,...C.map(c=>c[2](s))]))];
 return'﻿'+[...part(T('Lokalne sloty','Local slots'),T('Zespół','Team'),trSlotRows()),'',...part(T('Wczytane pliki','Imported files'),T('Zespół – plik','Team – file'),trFileRows())].join('\r\n')+'\r\n'}
// X.trRes keeps what happened (counts, skipped names and reasons); trMsg() words it in the current language.
const TR_MAX=5*1024*1024;
function trMsg(){const r=X.trRes;if(!r)return'';if(r.cleared)return T('Lista wyczyszczona.','List cleared.');
 const why={json:T('nieprawidłowy JSON','invalid JSON'),app:T('to nie plik zespołu z tej aplikacji','not a team file from this app'),read:T('nie udało się odczytać pliku','the file could not be read'),big:T('plik większy niż 5 MB','file larger than 5 MB')};
 return`${T(`Wczytano plików: ${r.n}.`,`Files loaded: ${r.n}.`)}${r.bad.length?' '+T('Pominięto','Skipped')+': '+r.bad.map(([n,w])=>`${n} (${why[w]})`).join(', ')+'.':''}`}
async function trImport(files){const bad=[];let n=0;X.trFiles=X.trFiles||[];
 for(const f of files){let txt,o;if(f.size>TR_MAX){bad.push([f.name,'big']);continue}
  try{txt=await f.text()}catch(e){bad.push([f.name,'read']);continue}
  try{o=JSON.parse(txt)}catch(e){bad.push([f.name,'json']);continue}
  if(!isObj(o)||o.app!==APP_ID||!isObj(o.data)){bad.push([f.name,'app']);continue}
  const row={file:f.name,team:normTeam(o.data)},i=X.trFiles.findIndex(x=>x.file===f.name);if(i>=0)X.trFiles[i]=row;else X.trFiles.push(row);n++}
 X.trRes={n,bad};trPaintFiles()}
// Updates the file table, the clear button and the status line in place: the file input keeps focus and the
// live region announces the new text.
function trPaintFiles(){if(S.view!=='trainer'||!$('#trFilesBox'))return;$('#trFilesBox').innerHTML=trTable('trFiles',T('Zespół – plik','Team – file'),trFileRows(),T('Brak wczytanych plików.','No files loaded.'));
 $('#trClear').disabled=!(X.trFiles||[]).length;$('#trStatus').textContent=trMsg();$('#trImport').focus()}
// Team slots saved in this browser (what "Clear all teams" would remove).
function storedTeamCount(){try{const x=readStore();return x&&isObj(x.teams)?Object.keys(x.teams).length:0}catch(e){return 0}}
// Trainer: removes all team slots from this browser after a confirmation; language, class code and model stay.
// One undo restores the exact stored state. Transient per-slot state (baseline shown, open panels) is dropped.
function trWipeAll(){toast(T('Usunąć pracę wszystkich zespołów (sloty 1–8) z tej przeglądarki? Zespoły, które nie pobrały pliku zespołu, stracą swoją pracę.','Remove the work of all teams (slots 1–8) from this browser? Teams that have not downloaded their team file will lose their work.'),{reason:'wipe',action:[T('Usuń wszystkie zespoły','Remove all teams'),()=>guardRun(()=>{
  let raw=null,ok=true;try{raw=localStorage.getItem(STORE_KEY);const cur=raw?JSON.parse(raw):{};localStorage.setItem(STORE_KEY,JSON.stringify({...cur,team:1,teams:{}}))}catch(e){ok=false}
  if(!ok){toast(T('Nie udało się wyczyścić danych w tej przeglądarce. Nic nie zmieniono.','Could not clear the data in this browser. Nothing changed.'));return}
  S.teams={};S.team=1;badgeQ=[];['baseOn','moreOpen','cmpSel','methOpen','rc','ragLastMsgs','ragPending'].forEach(k=>delete X[k]);render();
  toast(T('Usunięto pracę wszystkich zespołów z tej przeglądarki.','All teams’ work was removed from this browser.'),{reason:'wiped',action:[T('Cofnij','Undo'),()=>{try{if(raw)localStorage.setItem(STORE_KEY,raw);else localStorage.removeItem(STORE_KEY)}catch(e){return}
   const x=raw?JSON.parse(raw):{};S.teams=normTeams(x.teams);S.team=clampInt(x.team,1,TEAM_COUNT,1);render();announce(T('Cofnięto','Undone'))}]})})]})}
function vTrainer(){const fn=X.trFiles||[];
 mainEl.innerHTML=pageHead(T('Tryb prowadzącego','Trainer mode'),'',`<p class="edu-lead" id="trIntro">${T('Tryb prowadzącego: wczytaj pliki zespołów, żeby zobaczyć, kto zrobił baseline, ile razy oglądano test i czy uzupełniono uzasadnienie. Nie porównujemy surowego F1 na teście na forum grupy.','Trainer mode: load the team files to see who ran the baseline, how many times the test set was viewed and whether the justification was filled in. We do not compare raw test-set F1 in front of the group.')}</p>`)
  +`<section class="sec"><h2 class="sr-only">${T('Postęp zespołów','Team progress')}</h2><div class="wrap">`+card('users',T('Zespoły na tej przeglądarce (sloty 1–8)','Teams in this browser (slots 1–8)'),trTable('trSlots',T('Zespół','Team'),trSlotRows(),''),{tone:'blue',foot:`<p class="hint" style="margin:0">${T('Po zajęciach: najpierw niech zespoły pobiorą pliki zespołu, potem wyczyść sloty dla następnej grupy.','After the class: have the teams download their team files first, then clear the slots for the next group.')}</p><button type="button" class="btn-ghost btn-sm" id="trWipe"${storedTeamCount()?'':' disabled'}>${ic('trash-2')}${T('Wyczyść wszystkie zespoły','Clear all teams')}</button>`})
  +`<div class="mt">${card('upload',T('Wczytane pliki zespołów','Imported team files'),`<p class="edu-small">${T('Wybierz kilka plików JSON naraz. Pliki zostają tylko w pamięci tej karty: nie trafiają do żadnego slotu i znikają po zamknięciu strony. Ten sam plik wczytany ponownie zastępuje swój wiersz.','Select several JSON files at once. The files stay only in this tab’s memory: they are not written to any slot and are gone when the page closes. Loading the same file again replaces its row.')}</p>
 <div class="field mt"><label for="trImport">${T('Pliki zespołów (JSON)','Team files (JSON)')}</label><input type="file" id="trImport" class="input" accept="application/json,.json" multiple></div>
 <p class="hint" id="trStatus" aria-live="polite">${esc(trMsg())}</p><div class="mt" id="trFilesBox">${trTable('trFiles',T('Zespół – plik','Team – file'),trFileRows(),T('Brak wczytanych plików.','No files loaded.'))}</div>`,{tone:'yellow',foot:`<button type="button" class="btn-ghost btn-sm" id="trClear"${fn.length?'':' disabled'}>${ic('trash-2')}${T('Wyczyść listę','Clear the list')}</button>`})}</div>`
  +`<div class="mt">${card('download',T('Eksport','Export'),`<p class="edu-small">${T('Plik CSV z obiema tabelami (średniki, kodowanie UTF-8) otworzy się w Excelu. Nie zawiera kodu zajęć ani notatek zespołów.','A CSV file with both tables (semicolons, UTF-8) opens in Excel. It contains no class code and no team notes.')}</p>`,{tone:'green',foot:`<button type="button" class="btn" id="trCsv">${ic('download')}${T('Pobierz CSV','Download CSV')}</button>`})}</div></div></section>`;
 $('#trImport').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)trImport(f)};
 $('#trClear').onclick=()=>{X.trFiles=[];X.trRes={cleared:true};trPaintFiles()};
 $('#trCsv').onclick=()=>dl('rybex_trainer.csv',trCSV(),'text/csv;charset=utf-8');
 $('#trWipe').onclick=trWipeAll;
 icons(mainEl)}

$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b)go(b.dataset.v)});
$('#teamSel').onchange=e=>{const v=+e.target.value;if(S.example){e.target.value=S.team;return}if(AIS.run)e.target.value=S.team;guardRun(()=>{S.team=v;badgeQ=[];save();render()})};

addEventListener('resize',setHdrH);addEventListener('resize',queueToastPlace);addEventListener('scroll',queueToastPlace,{passive:true});if(window.ResizeObserver)new ResizeObserver(queueToastPlace).observe(toastEl);

 normHash();render();
