<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* ---- Functional ---- */
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

:where(.edu) h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

</style>
<style>
/* ─── Layout tokens ─── */
:root{--gutter:clamp(16px,4vw,72px)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr-h,84px) + 12px)}
body{margin:0;font-size:var(--body);line-height:1.55}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid transparent;outline-offset:2px;box-shadow:var(--focus-ring)}
.skip{position:absolute;left:12px;top:8px;z-index:100;transform:translateY(-200%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r-md);font-weight:600;text-decoration:none}
.skip:focus{transform:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:18px;height:18px;flex:none}
p{margin:6px 0}

/* ─── Top menu ─── */
.edu-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line-2)}
.edu-header-inner{padding:0 var(--gutter);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:0;color:inherit;text-decoration:none}
.edu-logo{width:64px;height:64px;display:block;margin-right:-6px}
.edu-wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.nav{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:wrap}
.nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-2);padding:8px 12px;border-radius:var(--r-pill);cursor:pointer;font-weight:500;font-size:15px;white-space:nowrap;transition:background-color .15s}
.nav button:hover{background:var(--paper-2)}
.nav button.on{background:var(--yellow);color:var(--yellow-ink);font-weight:600}
.edu-seg{display:inline-flex;gap:2px;padding:3px;background:var(--paper-2);border-radius:var(--r-pill)}
.edu-seg button{border:0;background:transparent;padding:6px 12px;border-radius:var(--r-pill);font-weight:600;color:var(--ink-2);cursor:pointer;min-width:42px}
.edu-seg button.on{background:var(--yellow);color:var(--yellow-ink)}

/* ─── Team bar ─── */
.teambar{background:var(--paper-2);border-bottom:1px solid var(--line);padding:12px var(--gutter);display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.field{min-width:0}
.field>label,.field>.label{display:block;margin-bottom:6px;font-family:var(--font-mono);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.input{width:100%;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.input[aria-invalid=true]{border-color:var(--red-600)}
.input:disabled{background:var(--paper-3);color:var(--ink-2);cursor:not-allowed}
.teambar .f-team{width:auto;min-width:150px;max-width:340px}.teambar .f-name{flex:1 1 220px;max-width:420px}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap}
.tb-prog{flex:1 1 220px;min-width:200px;max-width:360px}
.bd-strip{display:flex;flex-wrap:wrap;gap:4px;list-style:none;margin:0;padding:0}
.bd{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r-pill);border:1px dashed var(--line-strong);color:var(--ink-3)}
.bd.on{border:1px solid var(--ink);background:var(--yellow);color:var(--yellow-ink)}
.bd .ic,.bd svg{width:15px;height:15px}
.bd-list{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bd-item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.bd-item.on{border:1px solid var(--ink);background:var(--paper-2)}
.bd.na,.bd-item.na{opacity:.45}
.bd-item>svg,.bd-item>.ic{flex:none;margin-top:3px;color:var(--ink-3)}.bd-item.on>svg,.bd-item.on>.ic{color:var(--ink)}
.bd-name{margin:0}
.teambar .tb-toggle{display:none}
@media (min-width:769px) and (max-height:760px){.teambar{padding-top:6px;padding-bottom:6px}.teambar .tb-toggle{display:flex;gap:10px;min-width:0}.teambar:not(.open)>:not(.tb-toggle){display:none}}
.bar{height:10px;border-radius:var(--r-pill);background:var(--paper-3);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:var(--r-pill)}
.hint{font-size:var(--caption);color:var(--ink-3);margin:4px 0 0}
.pathbar{position:sticky;top:var(--hdr-top,0px);z-index:45;background:var(--paper);border-bottom:1px solid var(--line-2)}
.pb-in{padding:6px var(--gutter);display:flex;align-items:center;gap:8px 16px;min-height:44px}
.pb-dots{display:flex;gap:4px;margin:0;padding:0;list-style:none;flex:none}.pb-dots li{width:10px;height:10px;border-radius:50%;background:var(--paper-3);border:1px solid var(--line-2)}.pb-dots li.done{background:var(--green);border-color:var(--green)}.pb-dots li.cur{outline:2px solid var(--ink);outline-offset:1px}
.pb-txt{margin:0;flex:1;min-width:0;font-size:var(--body-sm)}.pb-min{color:var(--ink-3)}
#pathNext{flex:none;margin-left:auto}
.pathbar:has(.ex-bar){background:var(--yellow-soft);color:var(--yellow-ink);border-bottom-color:var(--yellow-600)}.ex-bar .ex-tag{flex:none;background:var(--paper);border:1px solid var(--ink)}#exampleExit{flex:none;margin-left:auto}
.ex-entry{align-items:center;gap:10px 14px;margin:18px 0 0}.ex-entry .hint{margin:0}.tb-lock{flex:1 1 100%;margin:0}
.savewarn{background:var(--red-soft);color:var(--red-ink);padding:10px var(--gutter);font-weight:600}
.savewarn[hidden]{display:none}

/* ─── Page structure ─── */
.page-head{padding:34px var(--gutter) 36px;border-bottom:1px solid var(--line-2)}
.page-head:has(+ .sec){border-bottom:0;padding-bottom:30px}
.app-title{font-family:var(--font-display);font-weight:800;font-size:clamp(2.3rem,5vw,3.3rem);letter-spacing:-.025em;line-height:1.05;color:var(--ink);margin:0 0 12px;overflow-wrap:anywhere}
.edu-lead{font-size:1.15rem;line-height:1.6;color:var(--ink-2);margin:0}
.sec{padding:36px 0 44px;border-top:1px solid var(--line)}
.sec:nth-of-type(odd){background:var(--paper-2)}
.wrap{padding:0 var(--gutter)}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sec-head h2{margin:0}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mt{margin-top:18px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ─── Tones and badges ─── */
.tone-grape{background:var(--grape-soft);color:var(--grape-ink)}
.tone-blue{background:var(--blue-soft);color:var(--blue-ink)}
.tone-yellow{background:var(--yellow-soft);color:var(--yellow-ink)}
.tone-green{background:var(--green-soft);color:var(--green-ink)}
.tone-red{background:var(--red-soft);color:var(--red-ink)}
.tone-ink{background:var(--ink);color:var(--paper)}
.tone-stone{background:var(--paper-3);color:var(--ink)}
.badge{flex:none;width:34px;height:34px;border-radius:var(--r-sm);display:inline-grid;place-items:center}
.badge-lg{width:46px;height:46px;border-radius:var(--r-md)}
.badge-lg .ic{width:24px;height:24px}
.badge.tone-ink{color:var(--yellow)}
.tile-h{display:flex;align-items:center;gap:12px;min-width:0}
.tile-h h3{margin:0;font-size:18px;line-height:1.3}
.tile-h h2{margin:0;font-size:18px;line-height:1.3}
.memo,.site-prev{max-width:860px}.sp-frame{border:0;border-radius:0;box-shadow:none;max-width:none}.sp-frame .rf-hero{padding:16px 22px 38px;gap:18px}.sp-frame .rf-hero p.sp-name{font-family:var(--font-display);font-weight:800;font-size:2.2rem;line-height:1.05;letter-spacing:-.025em;color:var(--rf-sea-2);margin:0 0 6px}.sp-frame .rf-hero p:not([class]){font-size:15px}.sp-frame .rf-teaser{margin:-22px 22px 14px}.sp-frame .rf-teaser p{font-size:15px}.sp-frame .rf-hero-pic img{aspect-ratio:3/2}.memo{max-width:860px}.memo-meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 14px;font-size:var(--body-sm)}.memo-meta dt{color:var(--ink-3);font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;align-self:center}.memo-meta dd{margin:0}.memo p{margin:0 0 10px}
#onboard{max-width:860px;margin-bottom:18px}#onboard p{margin:0 0 6px}.ob-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px 32px}
.sec.ob-sec{padding-top:20px}
@media (min-width:1100px){.ob-pair:has(#onboard){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}.ob-pair:has(#onboard)>.card{display:flex;flex-direction:column}.ob-pair:has(#onboard)>.card>.card-body,.ob-pair:has(#onboard)>.card>.sp-frame{flex:1}.ob-pair #onboard{margin:0}.ob-pair:has(#onboard) .ob-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:768px){.ob-grid{grid-template-columns:1fr}}
#briefReq>summary{cursor:pointer;font-weight:600;font-size:18px;padding:4px 0}#briefReq>.grid3{margin-top:14px}

/* ─── Cards ─── */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card-head{padding:12px 20px;background:var(--paper-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-body{padding:18px 20px;flex:1;min-width:0}
.card-foot{padding:12px 20px;border-top:1px dashed var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flush{padding:0}
.well{background:var(--paper-2);border-radius:var(--r-md);padding:14px 16px}
.callout{border-radius:var(--r-md);padding:14px 18px}
.group-hero{border-radius:var(--r-xl);padding:22px 28px;display:grid;grid-template-columns:1fr 240px;gap:28px;align-items:center}
.group-hero .edu-overline{color:inherit;margin:0 0 6px}
.group-hero:not(.tone-ink) .btn:not([disabled]){background:var(--ink);border-color:var(--ink);color:var(--paper)}
.group-hero:not(.tone-ink) .btn:not([disabled]):hover{background:var(--ink-2)}
.gh-title{font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1.2;margin:0 0 6px}
.gh-num{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1}
.gh-bar{height:10px;border-radius:var(--r-pill);background:color-mix(in srgb,currentColor 24%,transparent);overflow:hidden;margin-top:6px}
.gh-bar span{display:block;height:100%;background:currentColor;border-radius:var(--r-pill)}
.group-hero.tone-ink .edu-overline,.group-hero.tone-ink .gh-num{color:var(--yellow)}

/* ─── Buttons and chips ─── */
.btn,.btn-ghost,.btn-ink{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);padding:9px 18px;font-family:var(--font-display);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background-color .15s}
.btn{background:var(--yellow);color:var(--on-primary);border:1px solid var(--yellow)}
.btn:hover{background:var(--yellow-600)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--paper-2)}
.btn-ink{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.btn[disabled],.btn-ghost[disabled],.btn-ink[disabled]{background:var(--paper-3);color:var(--ink-2);border-color:var(--line-2);cursor:not-allowed}
.btn-sm{padding:5px 12px;font-size:13.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--blue-600);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;text-align:left}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;font-weight:500;transition:background-color .15s}
.tabs button:hover{background:var(--paper-2)}
.tabs .tab-mark{display:inline-flex;align-items:center}.tabs .tab-mark svg{width:16px;height:16px;color:var(--green)}.tabs button.on .tab-mark svg{color:inherit}
.tabs button.on{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink);font-weight:600}

/* ─── Stat blocks ─── */

/* ─── Tables ─── */
.tscroll{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r-md);max-width:100%}

.rag-legend{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px 20px}

.recap{margin:10px 0 0;padding:8px 12px;border:1px solid var(--ink);background:var(--paper-3);border-radius:var(--r-sm);line-height:1.5}
details.more-metrics{margin-top:10px}
details.more-metrics>summary{cursor:pointer;font-weight:600;font-size:var(--caption)}
details.more-metrics>.grid3,details.more-metrics>.grid4{margin-top:8px}

/* ─── Sliders ─── */
input[type=range]{width:100%;height:24px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--track);border-radius:var(--r-pill)}
input[type=range]::-moz-range-track{height:8px;background:var(--track);border-radius:var(--r-pill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-6px;background:var(--surface);border:2px solid var(--ink);border-radius:50%;box-shadow:var(--shadow-sm)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--surface);border:2px solid var(--ink);border-radius:50%}
input[type=range]:disabled{cursor:not-allowed;opacity:.5}

.ctl{min-width:0}.ctl label{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.ctl output{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);width:17px;height:17px;vertical-align:-3px}

/* ─── Agenda timeline ─── */
.g-row{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit;transition:background-color .15s}

.g-label{display:flex;align-items:center;gap:12px;min-width:0}
.g-name{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--ink);line-height:1.25;display:block}

.g-track{position:relative;display:block;height:22px;background:var(--paper-3);border-radius:var(--r-pill)}
.g-bar{position:absolute;top:0;bottom:0;background:var(--ink);border-radius:var(--r-pill)}

/* ─── Data folder ─── */
.folder{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.tree{display:flex;flex-direction:column;gap:2px}

.tree button:hover{background:var(--paper-2)}
.tree button.on{background:var(--yellow);color:var(--yellow-ink);font-weight:600}
pre{background:var(--paper-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:var(--r-sm);overflow:auto;font-family:var(--font-mono);font-size:12.5px;white-space:pre-wrap;margin:0}
pre.tall{max-height:420px}

/* ─── Charts and diagrams ─── */
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:8px 0;color:var(--ink-2)}

.sq.t{background:var(--yellow)}.sq.bad{border-color:var(--red-600)}.sq.dup{outline:2px dashed var(--ink);outline-offset:1px}

/* ─── Gallery ─── */
.gal{display:flex;flex-wrap:wrap;gap:8px}

.keyrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:6px 0 10px;color:var(--ink-2)}
.keyrow i{display:inline-block;width:14px;height:14px;border:3px solid var(--line-2);border-radius:4px;vertical-align:-2px;margin-right:5px}

dialog{border:1px solid var(--line-2);border-radius:var(--r-lg);padding:0;max-width:min(680px,calc(100vw - 32px));box-shadow:var(--shadow-lg);color:var(--ink)}

/* ─── Chat ─── */

.seg-mode{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.prompt-edit{font-family:var(--font-mono);font-size:13px;line-height:1.45;width:100%}

@media (max-width:768px){#visDetail{position:static}}

/* ─── Chain and steps ─── */
.quiz .qz-q{margin:0 0 18px}.quiz .qz-q:last-of-type{margin-bottom:6px}.quiz .qz-t{font-weight:600;margin:0 0 8px}
.quiz .qz-opts{display:grid;gap:8px}.quiz .qz-o{justify-content:flex-start;text-align:left;border-radius:var(--r-md);font-family:inherit;font-weight:500;font-size:15px}

.quiz .qz-fb{margin:10px 0 0;padding:8px 12px;border:2px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md)}.quiz .qz-fb:empty{display:none}.quiz [data-state=right] .qz-fb{border-color:var(--green-600)}.quiz [data-state=wrong] .qz-fb{border-color:var(--red-600)}

#goLive .gl-o.sel::before,#riskDemo .rk-o.sel::before{content:"\2713";font-weight:700;margin-right:8px}
#goLive .persona{margin:0 0 12px}#goLive .gl-lead{margin:0 0 4px}#goLive .gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}#goLive .gl-d>.card{height:100%}#goLive .gl-note{margin:0 0 10px}#goLive .gl-note .hint{margin:0}#goLive .gl-note .gl-fix{margin-top:8px}#goLive .gl-opts{display:grid;gap:8px}#goLive .gl-o{justify-content:flex-start;text-align:left;border-radius:var(--r-md);font-family:inherit;font-weight:500;font-size:15px;white-space:normal;height:auto}#goLive .gl-o.sel{background:var(--paper-2);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}#goLive .gl-o.sel:focus-visible{box-shadow:inset 0 0 0 1px var(--ink),var(--focus-ring)}
#goLive .fb{margin:10px 0 0;padding:8px 12px;border:1px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md)}#goLive .fb:empty{display:none}#goLive .gl-warn:empty{display:none}#goLive .gl-warn{margin:10px 0 0}#goLive .gl-w{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;padding:8px 12px;border:1px solid var(--red-600);background:var(--paper);border-radius:var(--r-md);font-weight:500}#goLive .gl-fix{gap:8px}#goLive .gl-w .ic{flex:none;margin-top:3px;color:var(--red-600)}#goLive [data-fix]{white-space:normal;height:auto;text-align:left}

/* Challenge under the prototype ("find the system's limits"): folded, full contour in the accent colour; its title on a line of its own */
.challenge{margin-top:20px;border:2px solid var(--grape);border-radius:var(--r-lg);background:var(--surface)}.challenge[data-state=done]{border-color:var(--green-600)}
.challenge>details>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:14px 18px;font-weight:600;font-size:17px}.challenge .ch-k{color:var(--ink-2)}.challenge .ch-chip{margin-left:auto}.challenge .ch-t{order:3;flex:1 0 100%;padding-left:26px;font-weight:500}
.challenge .ch-body{padding:0 18px 16px}.challenge .ch-task{margin:0 0 12px}.challenge .status{margin:0;padding:8px 12px;border:1px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md);font-weight:500}
.challenge .result{margin:10px 0 0;padding:8px 12px;border:1px solid var(--green-600);border-radius:var(--r-md)}.challenge .result:empty{display:none}
#riskDemo .fb{margin:10px 0 0;padding:8px 12px;border:2px solid var(--line-strong);background:var(--paper-2);border-radius:var(--r-md)}#riskDemo .fb:empty{display:none}#riskDemo [data-state=good] .fb{border-color:var(--green-600)}#riskDemo [data-state=other] .fb{border-color:var(--yellow)}#riskDemo .rk-note{margin:10px 0 0}#riskDemo .rk-link{margin:12px 0 0}#riskDemo .rk-link a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;text-underline-offset:3px}
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 26px}
.link{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;font-size:14px;line-height:1.35;transition:background-color .2s,color .2s,border-color .2s}
.link:not(:last-child)::after{content:"→";position:absolute;left:100%;top:50%;transform:translateY(-50%);width:26px;text-align:center;font-family:var(--font-mono);color:var(--ink-2)}

.rybex-frame .btn,.rybex-frame .btn-ghost,.rybex-frame .btn-ink{border-radius:0;font-family:var(--rf-sans);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.rybex-frame .btn{background:var(--rf-accent);border-color:var(--rf-accent);color:var(--rf-accent-ink)}.rybex-frame .btn:hover{background:var(--rf-accent-strong);border-color:var(--rf-accent-strong);color:var(--rf-accent-ink)}.rybex-frame .btn-ghost{background:transparent;border-color:var(--rf-line-strong);color:var(--rf-ink)}.rybex-frame .btn-ghost:hover{background:var(--rf-raised);border-color:var(--rf-accent);color:var(--rf-ink)}.rybex-frame .btn-ink{background:var(--rf-prototype);border-color:var(--rf-line-strong);color:var(--rf-ink)}
.rybex-frame .rf-foot{background:var(--rf-prototype);color:var(--rf-muted);border-top:1px solid var(--rf-line);padding:18px 28px}.rybex-frame .rf-foot .btn{background:var(--rf-accent);border-color:var(--rf-accent);color:var(--rf-accent-ink)}.rybex-frame .rf-foot .btn:hover{background:var(--rf-accent-strong);border-color:var(--rf-accent-strong)}.rybex-frame .rf-foot .btn.rf-staff{background:transparent;color:var(--rf-accent-strong);border-color:var(--rf-accent-strong)}.rybex-frame .rf-foot .btn.rf-staff:hover{background:var(--rf-raised);color:var(--rf-ink)}
.rybex-frame .rc-form .field>label{color:var(--rf-muted);font-family:var(--rf-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}.rybex-frame .rc-form .input{background:var(--rf-surface);border-color:var(--rf-line-strong);border-radius:0;color:var(--rf-ink)}.rybex-frame .rc-form .input:focus{border-color:var(--rf-accent);box-shadow:0 0 0 2px rgba(69,184,210,.2)}.rybex-frame .rc-form .input::placeholder{color:var(--rf-faint)}.rybex-frame .rc-err{color:var(--rf-error)}.rybex-frame .rc-done{background:var(--rf-surface);border:1px solid var(--rf-good);border-radius:0;color:var(--rf-ink)}.rybex-frame .rc-done b{color:var(--rf-good)}
.rybex-frame .ri-top,.rybex-frame .ri-grid{background:var(--rf-bg)}.rybex-frame .ri-top p,.rybex-frame .ri-queue p,.rybex-frame .pc-bio{color:var(--rf-muted)}.rybex-frame .ri-queue li{background:var(--rf-surface);border:1px solid var(--rf-line);border-left:2px solid var(--rf-accent);border-radius:0}.rybex-frame .ri-queue .ri-who{color:var(--rf-accent-strong)}.rybex-frame .ri-who span{color:var(--rf-muted)}.rybex-frame .ri-box,.rybex-frame .persona-card{background:var(--rf-surface);border:1px solid var(--rf-line);border-radius:0}.rybex-frame .pc-av{background:var(--rf-accent);color:var(--rf-accent-ink)}.rybex-frame .pc-role{color:var(--rf-muted)}.rybex-frame .persona-card blockquote{background:var(--rf-prototype);border:1px solid var(--rf-accent);border-radius:0}.rybex-frame .persona-card blockquote p{color:var(--rf-ink)}
.rybex-frame :focus-visible{outline:2px solid var(--rf-accent-strong);outline-offset:3px;box-shadow:none}
.sp-frame .rf-hero{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:14px;padding:16px 22px 20px}.sp-frame .rf-hero-pic{max-width:14rem}.sp-frame .rf-hero p.sp-name{margin:0 0 4px;color:var(--rf-ink);font-family:var(--rf-sans);font-size:2.1rem;line-height:1.05}.sp-frame .rf-hero .rf-lead{margin-bottom:8px;font-size:1rem;line-height:1.25}.sp-frame .rf-hero p:not([class]){margin:4px 0;font-size:13px;line-height:1.45}.sp-frame .rf-teaser{margin:-16px 22px 10px;padding:10px 14px}.sp-frame .rf-teaser p{font-size:13px;line-height:1.4}
@media (max-width:900px){.rybex-frame .rf-head{padding-inline:20px}.rybex-frame .rf-hero{gap:2rem}.rybex-frame .rf-blk,.rybex-frame .rf-art{padding-inline:20px}}
@media (max-width:768px){.rybex-frame .rf-head{padding:12px 16px;flex-wrap:wrap}.rybex-frame .rf-logo .rf-fish{width:38px;height:38px}.rybex-frame .rf-menu button{padding:11px 0;border-bottom:1px solid var(--rf-line);font-size:11px}.rybex-frame .rf-menu button.on{box-shadow:inset 3px 0 0 var(--rf-accent);padding-left:10px}.rybex-frame .rf-menu button[data-rp=intranet]{margin:4px 0 0;padding-left:10px;border:1px solid var(--rf-line-strong)}.rybex-frame .rf-toggle{border:1px solid var(--rf-line-strong);border-radius:0;background:transparent;color:var(--rf-ink);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.rybex-frame .rf-toggle:hover{background:var(--rf-raised);border-color:var(--rf-accent)}.rybex-frame .rf-hero{grid-template-columns:minmax(0,1fr);padding:20px 16px 36px;gap:24px}.rybex-frame .rf-hero-pic{justify-self:stretch;width:min(100%,27rem);margin:0 0 0 auto}.rybex-frame .rf-teaser{margin:-20px 16px 20px}.rybex-frame .rf-blk,.rybex-frame .rf-art{padding:2rem 16px 2.5rem}.rybex-frame .rf-foot{padding:16px}.sp-frame .rf-hero{grid-template-columns:minmax(0,1fr);padding:14px 16px 18px;gap:12px}.sp-frame .rf-hero-pic{max-width:12rem;width:min(100%,12rem)}.sp-frame .rf-teaser{margin:-14px 16px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}body *,body *::before,body *::after{animation:none!important}}
/* Short desktop windows: a tighter page head, so the first action of a page is on screen */
@media (min-width:769px) and (max-height:760px){.page-head{padding:14px var(--gutter) 16px}.app-title{font-size:2.1rem;margin-bottom:6px}.sec{padding-top:20px}}
</style>

const monthLbl=i=>{const y=2023+Math.floor((10+i)/12),m=(10+i)%12;return y+'-'+String(m+1).padStart(2,'0')};
function buildSales(){const r=rng(11),rows=[];for(let p=0;p<4;p++)for(let i=0;i<36;i++){const m=(10+i)%12;rows.push({month:monthLbl(i),product:PRODUCTS[p][0],units_k:Math.round(PRODUCTS[p][2]*(1+.008*i)*SEAS[m]*(1+(r()-.5)*.12))})}return rows}
// Failure events [start minute, kind]: v = seamer (vibration), t = retort (temperature + pressure), b = both; each lasts SENSOR_EVENT_LEN minutes.
const SENSOR_EVENTS=[[60,'v'],[140,'t'],[230,'b'],[350,'v'],[430,'t'],[520,'b']],SENSOR_EVENT_LEN=14;
function buildSensors(){const r=rng(5),rows=[],W=SENSOR_EVENTS;
 for(let i=0;i<600;i++){let t=121+gauss(r)*.6,p=2.1+gauss(r)*.05,v=2+gauss(r)*.25,y=0;
  for(const[s,k]of W)if(i>=s&&i<s+SENSOR_EVENT_LEN){const ramp=(i-s+1)/SENSOR_EVENT_LEN;y=1;if(k!='t')v+=ramp*3.2;if(k!='v')t+=ramp*5;if(k=='t')p+=ramp*.35}
  rows.push({t_min:i,temp_c:+t.toFixed(2),pressure_bar:+p.toFixed(3),vibration_mm_s:+v.toFixed(2),anomaly:y})}return rows}
const CAT={damage:['Uszkodzenie puszki','Damaged can'],label:['Etykieta / kod','Label / code'],quality:['Jakość produktu','Product quality'],delivery:['Dostawa / faktura','Delivery / invoice'],smell:['Zapach / świeżość','Smell / freshness']};
const CK=Object.keys(CAT);
// Complaint cases: [category, hazard, text]. Labels follow the Rybex labelling guideline (COMPL_GUIDE), not the first problem mentioned:
// transport damage is "delivery"; with several problems the priority is smell > damage > label > quality > delivery.
const CTPL={
 d1:['damage',0,'Dwie puszki {p} miały głębokie wgniecenia przy zgrzewie, jedna lekko przeciekała.'],
 d2:['damage',0,'Puszka {p} zardzewiała na krawędzi, jakby długo stała w wilgoci.'],
 d3:['damage',0,'Przy otwieraniu wieczko się urwało, a krawędź puszki {p} była poszarpana.'],
 d4:['damage',0,'Na dnie puszki {p} jest wgniecenie, a lakier z boku popękał.'],
 dh1:['damage',1,'Puszka {p} wybrzuszona, wieczko wypukłe, a przy otwieraniu coś syknęło.'],
 dh2:['damage',1,'Puszka {p} jest napuchnięta, denko odstaje i ugina się pod palcem.'],
 l1:['label',0,'Data przydatności na puszce {p} jest zamazana, nie da się jej odczytać.'],
 l2:['label',0,'Etykieta {p} naklejona do góry nogami, kod partii częściowo starty.'],
 l3:['label',0,'Na puszce {p} brakuje kodu partii, więc nie mogę go podać w reklamacji.'],
 l4:['label',0,'Na etykiecie {p} jest inna gramatura niż na fakturze i w sklepie internetowym.'],
 q1:['quality',0,'Ryba w puszce {p} była sucha, łykowata i rozpadała się na papkę.'],
 q2:['quality',0,'W puszce {p} pełno ości, a ryby może jedna trzecia.'],

 q4:['quality',0,'Kawałki ryby w puszce {p} ciemne i twarde, zupełnie inne niż zwykle.'],
 s1:['smell',1,'Po otwarciu puszki {p} poczułem kwaśny, nieprzyjemny zapach.'],
 s2:['smell',1,'Olej w puszce {p} był mętny i dziwnie pachniał, nie odważyłem się zjeść.'],
 s3:['smell',1,'Ryba z puszki {p} miała posmak metalu i zapach zepsucia, po zjedzeniu bolał mnie brzuch.'],
 s4:['smell',1,'Smród po otwarciu puszki {p}, wyrzuciłam całość.'],
 v1:['delivery',0,'Zamówienie hurtowe ({p}, 40 kartonów) dotarło z tygodniowym opóźnieniem.'],
 v2:['delivery',0,'Faktura obejmuje 12 kartonów {p}, a dostaliśmy 10.'],
 v3:['delivery',0,'Kurier rzucał paczkami, karton był zgnieciony i trzy puszki {p} są wgniecione.'],
 v4:['delivery',0,'Paleta przyszła źle owinięta folią, kartony przemoknięte, a puszki {p} poobijane w transporcie.'],
 m1:['smell',1,'Dostawa przyszła dwa dni po terminie, a po otwarciu jednej puszki {p} poczuliśmy zepsuty zapach.'],
 m2:['damage',0,'Etykieta była krzywo naklejona, ale gorzej, że puszka {p} była wgnieciona i przeciekała.'],
 m3:['label',0,'Ryba w puszce {p} była za słona, a do tego na etykiecie nie da się odczytać daty ważności.'],
 m4:['quality',0,'Faktura nie zgadza się z zamówieniem, a ryba w puszce {p} sucha i pełna ości.'],
 m5:['damage',1,'Opakowanie zbiorcze przyszło z opóźnieniem, a wieczko jednej puszki {p} było wypukłe.'],
 m6:['damage',0,'Smak w porządku, ale puszka {p} zardzewiała i ma zamazany kod partii.']};
// Order fixes what lands where: 1–20 = few-shot pool, 21–36 = dev scored with examples, 37–60 = test. Every part holds transport and mixed cases.
const C_PLAN=['m2','l1','m1','v3','m3','q1','d2','v1','s2','q3','dh1','l3','v2','m4','s1','d1','l4','q2','v4','s4',
 'v4','m5','q4','l2','s3','m6','v3','d3','m3','dh2','q3','v1','m1','l1','d4','m4',
 's1','v3','m2','l3','q1','m6','dh1','v4','m3','d1','s4','m4','l4','v2','m1','q2','d2','m5','l1','q3','v1','s2','d3','v4'];
const C_OPEN=['','Dzień dobry. ','Reklamacja. ','Witam, ','Szanowni Państwo, '],C_CLOSE=['',' Proszę o zwrot pieniędzy.',' Czekam na odpowiedź.',' Proszę o kontakt.',' To już drugi raz w tym miesiącu.'];
function buildComplaints(){const r=rng(21);return C_PLAN.map((k,i)=>{const[c,h,t]=CTPL[k],pr=PRODUCTS[Math.floor(r()*4)][0],o=C_OPEN[Math.floor(r()*5)],e=C_CLOSE[Math.floor(r()*5)];
 return Object.defineProperty({id:i+1,product:pr,text:o+t.replace('{p}','„'+pr+'”')+e,category:c},'hazard',{value:!!h,enumerable:false})})}
const DATA={sales:buildSales(),sensors:buildSensors(),compl:buildComplaints()};

// Knowledge-assistant corpus: current procedures, a workstation instruction, a quality FAQ, a change memo and one archived procedure version (ARCH-01)
// Kept in folder (alphabetical) order: the literal baseline and TF-IDF give ties to the earlier document, so reordering changes the results
const DOCS=[
{id:'ARCH-01',t:['Kontrola szwu puszki, wersja 2 (archiwalna)','Can seam inspection, version 2 (archived)'],p:[[
'WERSJA ARCHIWALNA, NIEOBOWIĄZUJĄCA. Wersja 2 obowiązywała od 1 marca 2024 do 31 sierpnia 2026 i została zastąpiona wersją 3 (PROCES-01). Dokument zostaje w archiwum tylko do wglądu podczas audytów.',
'Szew puszki kontroluje się co 60 minut na każdej zamykarce. Kontrolę wykonuje operator zamykarki.',
'Mierzy się wysokość szwu (2,9–3,1 mm) oraz grubość szwu (1,05–1,20 mm). Do pomiaru służy suwmiarka.',
'Rozbiórkę szwu wykonuje się raz na zmianę, na początku pracy. Operator rozcina puszkę i ocenia zakładkę haków na oko, bez pomiaru.',
'Przy odchyleniu od normy brygadzista zatrzymuje linię i izoluje puszki wyprodukowane w ostatnich 60 minutach. Odizolowane puszki przegląda zmiana, na której wykryto odchylenie.',
'Po regulacji zamykarki linię uruchamia brygadzista. Zgoda działu jakości nie jest potrzebna, jeśli pierwsza kontrola po regulacji mieści się w normie.',
'Wynik kontroli wpisuje się do karty kontrolnej zmiany i podpisuje. Kartę odbiera kierownik zmiany na koniec dnia.',
'Karty kontrolne szwu przechowuje się przez 2 lata w biurze kierownika zmiany. Starsze karty wolno zniszczyć bez dodatkowej zgody.'],[
'ARCHIVED VERSION, NO LONGER IN FORCE. Version 2 was in force from 1 March 2024 to 31 August 2026 and was replaced by version 3 (PROCES-01). The document stays in the archive only for reference during audits.',
'The can seam is inspected every 60 minutes on each seamer. The seamer operator does the inspection.',
'Seam height (2.9–3.1 mm) and seam thickness (1.05–1.20 mm) are measured. Use a caliper.',
'A seam teardown is done once per shift, at the start of work. The operator cuts a can open and judges the hook overlap by eye, without measuring.',
'If a value is out of tolerance, the foreman stops the line and isolates the cans produced in the last 60 minutes. The isolated cans are looked through by the shift on which the deviation was found.',
'After the seamer is adjusted the foreman restarts the line. The consent of the quality department is not needed if the first inspection after the adjustment is within tolerance.',
'The inspection result is recorded on the shift control card and signed. The shift manager collects the card at the end of the day.',
'Seam control cards are kept for 2 years in the shift manager’s office. Older cards may be destroyed without further consent.']]},
{id:'FAQ-01',t:['Pytania pracowników do działu jakości','Employee questions to the quality department'],p:[[
'Pytania zebrał dział jakości, ostatnia aktualizacja 10 września 2026. Pochodzą ze szkoleń stanowiskowych i ze skrzynki przy szatni. Odpowiedzi są skrótem, a w razie różnic obowiązuje procedura.',
'Czy autoklaw i retorta to to samo? Tak, „autoklaw” to potoczna nazwa retorty. Nastawy podaje PROCES-02: dla puszek 170 g jest to 121°C przez 40 minut.',
'Co to jest „dekiel”? W procedurach dekiel nazywa się wieczkiem. Wieczka nakłada zamykarka, a wymiary szwu, który łączy wieczko z puszką, opisuje PROCES-01.',
'Puszka spadła mi na podłogę, czy mogę ją odłożyć na taśmę? Nie. Puszka, która dotknęła podłogi, idzie do pojemnika na odpad, także gdy wygląda na całą.',
'Czy lekko wgnieciona puszka może iść do kartonu? Wgniecenie na korpusie płytsze niż 1 mm jest dopuszczalne. Każde wgniecenie na szwie albo przy wieczku dyskwalifikuje puszkę.',
'Kto może zatrzymać linię? Każdy pracownik, który widzi zagrożenie dla ludzi albo dla jakości. Nikt nie ponosi konsekwencji za zatrzymanie w dobrej wierze.',
'Co zrobić, gdy drukarka kodów przestaje drukować w środku zmiany? Zatrzymać podawanie puszek i wezwać brygadzistę. Puszki bez kodu odkłada się osobno i znakuje według PROCES-03.',
'Czy mogę wynieść puszkę z hali do domu? Nie, także puszkę uszkodzoną. Wyroby dla pracowników sprzedaje sklepik zakładowy w piątki.',
'Gdzie zgłosić pomysł na usprawnienie albo błąd w procedurze? Na formularzu F-20 u brygadzisty albo mailem do działu jakości. Odpowiedź przychodzi w ciągu 10 dni roboczych.',
'Mam katar albo skaleczoną rękę, czy mogę pracować przy otwartym produkcie? Zgłoś to brygadziście przed wejściem na halę. Z raną na dłoni pracuje się tylko w opatrunku i rękawicy, zwykle przy pakowaniu kartonów.'],[
'The questions were collected by the quality department, last updated 10 September 2026. They come from workstation training and from the box by the changing room. The answers are a summary, and if anything differs the procedure applies.',
'Are the autoclave and the retort the same thing? Yes, “autoclave” is the everyday name for the retort. The settings are in PROCES-02: for 170 g cans it is 121°C for 40 minutes.',
'What is a “lid”? Procedures call the lid a can end. Can ends are put on by the seamer, and the dimensions of the seam that joins the end to the can are described in PROCES-01.',
'A can fell on the floor, may I put it back on the belt? No. A can that touched the floor goes into the waste bin, even when it looks undamaged.',
'May a slightly dented can go into the carton? A dent on the body shallower than 1 mm is acceptable. Any dent on the seam or near the can end disqualifies the can.',
'Who may stop the line? Any employee who sees a hazard to people or to quality. Nobody faces consequences for a stop made in good faith.',
'What to do when the code printer stops printing in the middle of a shift? Stop feeding cans and call the foreman. Cans without a code are put aside separately and marked under PROCES-03.',
'May I take a can from the hall home? No, not even a damaged one. Products for employees are sold in the plant shop on Fridays.',
'Where do I report an improvement idea or a mistake in a procedure? On form F-20 at the foreman’s desk or by e-mail to the quality department. A reply comes within 10 working days.',
'I have a cold or a cut on my hand, may I work with open product? Tell the foreman before you enter the hall. With a wound on the hand you work only with a dressing and a glove, usually at carton packing.']]},
{id:'INSTR-01',t:['Instrukcja stanowiskowa: operator zamykarki, linia 2','Workstation instruction: seamer operator, line 2'],p:[[
'Wydanie 4, obowiązuje od 1 września 2026. Instrukcja wisi przy zamykarce Z-2 i dotyczy operatora oraz jego zmiennika. W razie różnic pierwszeństwo mają procedury PROCES-01 i PROCES-05.',
'Przed startem załóż czepek, fartuch i ochronniki słuchu, zdejmij zegarek i biżuterię. Sprawdź, czy osłony zamykarki są zamknięte, a wyłącznik awaryjny odblokowany.',
'Początek zmiany: nasmaruj zamykarkę, sprawdź poziom oleju w dozowniku i liczbę wieczek w magazynku. Przepuść 5 pustych puszek i obejrzyj szew, zanim puścisz produkt.',
'W czasie pracy patrz na trzy rzeczy: wskaźnik drgań na panelu, równe podawanie wieczek i wycieki oleju pod głowicą. Każdą z nich zgłoś brygadziście, zanim zrobi się z niej postój.',
'Zamykarka pracuje zwykle z prędkością 300 puszek na minutę. Tej nastawy operator sam nie zmienia.',
'Wieczka dołóż, gdy w magazynku zostanie ich mniej niż jedna czwarta. Pusty magazynek zatrzymuje zamykarkę, a puszki bez wieczka trzeba wyrzucić.',
'Zacięcie puszki: zatrzymaj zamykarkę przyciskiem STOP, odczekaj, aż głowice staną, i dopiero wtedy otwórz osłonę. Zaciętą puszkę i dwie sąsiednie wyrzuć do pojemnika na odpad.',
'Nigdy nie wyjmuj puszki ręką przy pracujących głowicach. Po każdym otwarciu osłony pierwsze 3 puszki odłóż do kontroli szwu.',
'Przezbrojenie na inny format wykonuje mechanik utrzymania ruchu, nie operator. Twoje zadanie to opróżnić magazynek wieczek i zgłosić brygadziście gotowość.',
'Po przezbrojeniu obowiązuje rozruch kontrolowany, który trwa do trzech dobrych kontroli szwu z rzędu. Brygadzista stoi wtedy przy maszynie.',
'Zamykarka pracuje w tym czasie z prędkością najwyżej 120 puszek na minutę. Do zwykłej nastawy wraca się dopiero na polecenie brygadzisty.',
'Koniec zmiany: zapisz stan licznika puszek, przekaż zmiennikowi uwagi o pracy maszyny i podpisz kartę zmiany. Niczego nie zostawiaj „na słowo”.',
'Awaria lub wypadek: wciśnij wyłącznik awaryjny i zadzwoń do brygadzisty, numer wewnętrzny 230. Po godzinie 15 dyżur utrzymania ruchu ma numer wewnętrzny 245.'],[
'Issue 4, in force from 1 September 2026. The instruction hangs next to seamer Z-2 and applies to the operator and the relief operator. If anything differs, procedures PROCES-01 and PROCES-05 take precedence.',
'Before you start, put on a hair net, an apron and ear protection, and take off your watch and jewellery. Check that the seamer guards are closed and the emergency stop is released.',
'Start of shift: lubricate the seamer, check the oil level in the dosing unit and the number of can ends in the magazine. Run 5 empty cans through and look at the seam before you let product in.',
'While running, watch three things: the vibration reading on the panel, even feeding of can ends and oil leaks under the head. Report any of them to the foreman before it turns into a stoppage.',
'The seamer is normally run at a speed of 300 cans per minute. The operator does not alter this setting.',
'Top up can ends when less than one quarter of them is left in the magazine. An empty magazine stops the seamer, and cans without an end have to be thrown away.',
'Jammed can: stop the seamer with the STOP button, wait until the heads stand still and only then open the guard. Throw the jammed can and its two neighbours into the waste bin.',
'Never take a can out by hand while the heads are running. After every opening of the guard, put the first 3 cans aside for a seam inspection.',
'A changeover to another format is done by a maintenance mechanic, not by the operator. Your job is to empty the can end magazine and tell the foreman you are ready.',
'A changeover is followed by a controlled start-up, which lasts until three good seam inspections in a row. The foreman stays at the machine during that time.',
'During that time the seamer is run at a speed of no more than 120 cans per minute. The normal setting returns only on the foreman’s order.',
'End of shift: write down the can counter, hand over your remarks about the machine to the relief operator and sign the shift card. Leave nothing “by word of mouth”.',
'Breakdown or accident: press the emergency stop and call the foreman on extension 230. After 3 p.m. the maintenance duty phone is extension 245.']]},
{id:'NOTATKA-01',t:['Komunikat 7/2026: zmiana procedury kontroli szwu','Notice 7/2026: change to the seam inspection procedure'],p:[[
'Mirszyce, 25 sierpnia 2026. Od: Piotr Zielak, kierownik działu jakości i bezpieczeństwa żywności. Do: operatorzy zamykarek, brygadziści, kierownicy zmian, utrzymanie ruchu.',
'Od 1 września 2026 obowiązuje wersja 3 procedury PROCES-01 „Kontrola szwu puszki”. Wersja 2 traci ważność z końcem sierpnia i trafia do archiwum jako ARCH-01.',
'Powód zmiany: w drugim kwartale trzy razy wykryliśmy za niski szew dopiero po godzinie produkcji. Za każdym razem trzeba było wstrzymać i przejrzeć około 18 000 puszek.',
'Najważniejsza zmiana to częstsza kontrola. Szew kontrolujemy teraz co 30 minut, czyli dwa razy częściej niż w wersji 2, i z takiego samego okresu izolujemy puszki po złym wyniku.',
'Rozbiórka szwu przestaje być czynnością „na początek zmiany” i ma teraz własny rytm w ciągu zmiany. Węższa jest też tolerancja grubości szwu; obie wartości podaje wersja 3.',
'Zmienia się zasada ponownego uruchomienia linii. Brygadzista nie rusza już linii sam: decyduje kierownik zmiany po zgodzie działu jakości.',
'Szkolenia z wersji 3 prowadzi dział jakości od 26 do 29 sierpnia, przez kwadrans na początku każdej zmiany. Udział potwierdza się podpisem na liście, a operator bez szkolenia nie obsługuje zamykarki samodzielnie.',
'Stare karty kontrolne z nagłówkiem „wersja 2” należy oddać brygadziście do 31 sierpnia. Pytania proszę kierować do działu jakości, numer wewnętrzny 214.'],[
'Mirszyce, 25 August 2026. From: Piotr Zielak, quality and food safety manager. To: seamer operators, foremen, shift managers, maintenance.',
'From 1 September 2026 version 3 of procedure PROCES-01 “Can seam inspection” is in force. Version 2 expires at the end of August and goes to the archive as ARCH-01.',
'Reason for the change: in the second quarter we found a seam that was too low three times, each time only after an hour of production. Every time about 18,000 cans had to be held and looked through.',
'The main change is more frequent inspection. We now inspect the seam every 30 minutes, twice as often as in version 2, and after a bad result we isolate cans from the same period.',
'The seam teardown stops being a “start of shift” job and now has its own rhythm during the shift. The seam thickness tolerance is narrower too; both values are given in version 3.',
'The rule for restarting the line changes. The foreman no longer restarts the line alone: the shift manager decides once the quality department agrees.',
'Training on version 3 is run by the quality department from 26 to 29 August, a quarter of an hour at the start of every shift. Attendance is confirmed by signing the list, and an operator without training does not run a seamer alone.',
'Old control cards with the header “version 2” must be handed to the foreman by 31 August. Please send questions to the quality department, extension 214.']]},
{id:'PROCES-01',t:['Kontrola szwu puszki','Can seam inspection'],p:[[
'Wersja 3, obowiązuje od 1 września 2026. Właścicielem procedury jest Piotr Zielak, kierownik działu jakości i bezpieczeństwa żywności. Procedura dotyczy zamykarek na liniach 1, 2 i 3.',
'Szew puszki kontroluje się co 30 minut na każdej zamykarce. Kontrolę wykonuje operator zamykarki, a brygadzista potwierdza ją podpisem raz na zmianę.',
'Mierzy się wysokość szwu (2,9–3,1 mm) oraz grubość szwu (1,05–1,15 mm). Do pomiaru służy suwmiarka albo projektor szwów, który stoi w laboratorium przy linii 2.',
'Oprócz pomiaru z zewnątrz co 4 godziny wykonuje się rozbiórkę szwu. Operator rozcina puszkę i sprawdza, jak hak wieczka zachodzi na hak korpusu; zakładka nie może być krótsza niż 1,0 mm.',
'Przy odchyleniu od normy należy natychmiast zatrzymać linię i odizolować puszki wyprodukowane w ostatnich 30 minutach. Odizolowane puszki trafiają na paletę z czerwoną etykietą „WSTRZYMANE”, a dalej postępuje się według PROCES-06.',
'Linię po zatrzymaniu uruchamia kierownik zmiany, ale dopiero po zgodzie działu jakości. Wcześniej utrzymanie ruchu reguluje zamykarkę, a dwie kolejne kontrole szwu muszą zmieścić się w normie.',
'Wynik każdej kontroli wpisuje się do karty kontrolnej zmiany (formularz F-07) i podpisuje. Wpis zawiera godzinę, numer zamykarki, oba wymiary i kod partii.',
'Karty kontrolne szwu przechowuje dział jakości przez 3 lata. Po tym czasie można je zniszczyć za zgodą kierownika działu jakości.',
'Wyjątek: przez pierwszą godzinę po przezbrojeniu zamykarki na inny format szew kontroluje się co 10 minut. Do zwykłego rytmu wraca się po trzech dobrych wynikach z rzędu.'],[
'Version 3, in force from 1 September 2026. The procedure is owned by Piotr Zielak, quality and food safety manager. It applies to the seamers on lines 1, 2 and 3.',
'The can seam is inspected every 30 minutes on each seamer. The seamer operator does the inspection and the foreman confirms it with a signature once per shift.',
'Seam height (2.9–3.1 mm) and seam thickness (1.05–1.15 mm) are measured. Use a caliper or the seam projector that stands in the laboratory next to line 2.',
'Besides the outside measurement, a seam teardown is done every 4 hours. The operator cuts a can open and checks how the end hook overlaps the body hook; the overlap must not be shorter than 1.0 mm.',
'If a value is out of tolerance, stop the line immediately and isolate the cans produced in the last 30 minutes. Isolated cans go onto a pallet with a red “ON HOLD” label and are then handled under PROCES-06.',
'After a stop the line is restarted by the shift manager, but only once the quality department agrees. Before that, maintenance adjusts the seamer and two consecutive seam inspections must be within tolerance.',
'The result of every inspection is recorded on the shift control card (form F-07) and signed. The entry gives the time, the seamer number, both dimensions and the batch code.',
'Seam control cards are kept by the quality department for 3 years. After that they may be destroyed with the consent of the quality manager.',
'Exception: during the first hour after a seamer changeover to another format the seam is inspected every 10 minutes. The normal rhythm returns after three good results in a row.']]},
{id:'PROCES-02',t:['Sterylizacja w retorcie','Retort sterilization'],p:[[
'Wersja 4, obowiązuje od 1 lutego 2026. Właścicielem procedury jest dział jakości. Procedura obejmuje retorty R-1 i R-2 oraz wszystkie formaty puszek.',
'Puszki 170 g sterylizuje się w temperaturze 121°C przez 40 minut przy ciśnieniu około 2,1 bara. Czas liczy się od chwili, gdy czujnik w najzimniejszym miejscu kosza pokaże 121°C.',
'Większy format 300 g, pakowany na linii 3, nagrzewa się wolniej i ma osobną kartę nastaw KN-3. Operator retorty wybiera ją na panelu przed załadunkiem kosza.',
'Takie puszki sterylizuje się 55 minut, a temperatura i ciśnienie zostają bez zmian. Pomylenie programu oznacza wstrzymanie całego wsadu.',
'Przebieg cyklu (temperatura, ciśnienie, czas) zapisuje się automatycznie i trafia do dziennika partii. Operator podpisuje wydruk i przypina go do karty partii.',
'Po awarii zasilania lub spadku temperatury poniżej 119°C cykl należy powtórzyć albo zablokować partię do decyzji działu jakości. Cykl wolno powtórzyć tylko raz, a drugi nieudany cykl oznacza utylizację wsadu.',
'Po sterylizacji puszki chłodzi się w retorcie wodą chlorowaną, aż temperatura w środku puszki spadnie do 40°C. Chłodzenie zajmuje zwykle około 20 minut.',
'Schłodzone kosze odstawia się do strefy suszenia na co najmniej 6 godzin. W tym czasie puszek nie wolno dotykać gołymi rękami ani etykietować, bo mokry szew może zassać wodę.',
'Puszek po sterylizacji nie wolno zwalniać bez zapisu cyklu. Brak wydruku traktuje się tak samo jak nieudany cykl.',
'Czujniki temperatury retorty wzorcuje się co 6 miesięcy, a manometr raz w roku. Wzorcowanie zleca utrzymanie ruchu, a świadectwa przechowuje dział jakości.'],[
'Version 4, in force from 1 February 2026. The procedure is owned by the quality department. It covers retorts R-1 and R-2 and all can formats.',
'170 g cans are sterilized at 121°C for 40 minutes at about 2.1 bar pressure. The time counts from the moment the sensor in the coldest spot of the basket shows 121°C.',
'The larger 300 g format, packed on line 3, heats up more slowly and has its own settings card KN-3. The retort operator selects it on the panel before loading the basket.',
'Such cans are sterilized for 55 minutes, while temperature and pressure stay the same. Choosing the wrong program means the whole load is put on hold.',
'The cycle record (temperature, pressure, time) is saved automatically and goes into the batch log. The operator signs the printout and pins it to the batch card.',
'After a power failure or a temperature drop below 119°C the cycle must be repeated or the batch blocked until the quality department decides. A cycle may be repeated only once, and a second failed cycle means the load is destroyed.',
'After sterilization the cans are chilled in the retort with chlorinated water until the temperature inside the can falls to 40°C. Chilling usually takes about 20 minutes.',
'Chilled baskets are moved to the drying zone for at least 6 hours. During that time the cans must not be touched with bare hands or labelled, because a wet seam can draw water in.',
'Cans must not be released after sterilization without a cycle record. A missing printout is treated the same as a failed cycle.',
'Retort temperature sensors are calibrated every 6 months and the pressure gauge once a year. Maintenance orders the calibration and the quality department keeps the certificates.']]},
{id:'PROCES-03',t:['Etykietowanie i kod partii','Labeling and batch code'],p:[[
'Wersja 2, obowiązuje od 15 stycznia 2025. Właścicielem procedury jest dział jakości. Procedura dotyczy drukarek inkjet i etykieciarek na wszystkich liniach.',
'Kod partii ma format RYB-RRMMDD-L, gdzie RRMMDD to data produkcji, a L oznacza numer linii produkcyjnej. Na przykład RYB-261031-L2 to partia z 31 października 2026 z linii 2.',
'Kod nanosi drukarka inkjet na dno puszki, jeszcze przed zamykarką. Czytelność kodu kontroluje kamera co godzinę, a operator dodatkowo ogląda pierwszą puszkę po każdym postoju.',
'Pod kodem partii drukuje się datę minimalnej trwałości. Dla konserw w oleju jest to 36 miesięcy od daty produkcji. Konserwy w sosie pomidorowym mają 24 miesiące.',
'Etykieta nie może być przesunięta o więcej niż 2 mm względem osi puszki. Sprawdza się to szablonem na 5 puszkach co godzinę.',
'Puszki z nieczytelnym kodem lub krzywą etykietą wstrzymuje się i kieruje do ponownego znakowania. Znakować ponownie wolno tylko raz i tylko wtedy, gdy kod partii da się ustalić z dziennika linii.',
'Jeżeli kodu nie da się ustalić, puszki traktuje się jak partię bez identyfikacji i nie mogą one trafić do sprzedaży. O utylizacji decyduje kierownik działu jakości.',
'Przy zmianie produktu operator etykieciarki zdejmuje z maszyny wszystkie stare etykiety i odnotowuje to w karcie zmiany. Pierwsze 10 puszek po zmianie ogląda brygadzista.',
'Etykiety rozlicza się na koniec zmiany: liczba wydanych minus zwrócone i zniszczone musi zgadzać się z liczbą puszek z dokładnością do 0,5%. Większą różnicę zgłasza się kierownikowi zmiany.'],[
'Version 2, in force from 15 January 2025. The procedure is owned by the quality department. It applies to the inkjet printers and labellers on all lines.',
'The batch code has the format RYB-YYMMDD-L, where YYMMDD is the production date and L is the production line number. For example, RYB-261031-L2 is the batch of 31 October 2026 from line 2.',
'The code is applied by an inkjet printer to the bottom of the can, before the seamer. A camera checks code legibility every hour, and the operator also looks at the first can after every stoppage.',
'The best-before date is printed under the batch code. For products in oil it is 36 months from the production date. Products in tomato sauce get 24 months.',
'The label must not be shifted by more than 2 mm relative to the can axis. This is checked with a template on 5 cans every hour.',
'Cans with an unreadable code or a crooked label are held and sent for re-marking. Re-marking is allowed only once and only when the batch code can be established from the line log.',
'If the code cannot be established, the cans are treated as a batch without identification and must not be sold. The quality manager decides on their disposal.',
'At a product change the labeller operator removes all old labels from the machine and notes it on the shift card. The foreman looks at the first 10 cans after the change.',
'Labels are reconciled at the end of the shift: labels issued minus returned and destroyed must agree with the number of cans to within 0.5%. A larger difference is reported to the shift manager.']]},
{id:'PROCES-04',t:['Obsługa reklamacji','Complaint handling'],p:[[
'Wersja 5, obowiązuje od 1 czerwca 2026. Właścicielką procedury jest Magda Kruk z obsługi reklamacji i klienta. Część o bezpieczeństwie żywności zatwierdza dział jakości.',
'Na każdą reklamację odpowiadamy w ciągu 14 dni od zgłoszenia. Termin liczy się od dnia, w którym wiadomość wpłynęła do skrzynki reklamacji, a nie od dnia jej odczytania.',
'Każde zgłoszenie dostaje numer w rejestrze reklamacji i jedną kategorię: zapach lub świeżość, uszkodzenie puszki, etykieta lub kod, jakość produktu, dostawa lub faktura. Gdy klient opisuje kilka problemów, wybiera się kategorię o najwyższym priorytecie.',
'Zgłoszenia dotyczące zapachu, wybrzuszenia puszki, syku przy otwieraniu lub podejrzenia zatrucia traktuje się jako potencjalne zagrożenie bezpieczeństwa żywności. Kategoria zgłoszenia nie ma tu znaczenia.',
'W takim przypadku należy zabezpieczyć próbkę, zapisać numer partii i przekazać sprawę do działu jakości w ciągu 24 godzin. Klienta prosi się, żeby nie wyrzucał puszki i nie jadł jej zawartości.',
'Jeżeli klient nie zna numeru partii, prosi się go o zdjęcie dna puszki. Bez numeru partii sprawa i tak trafia do działu jakości, z dopiskiem „partia nieustalona”.',
'Klientowi oferujemy zwrot pieniędzy lub wymianę produktu. Zwrot do 200 zł zatwierdza pracownik obsługi reklamacji, a wyższe kwoty kierownik sprzedaży.',
'Uszkodzenia powstałe w transporcie (zgnieciony karton, przemoczona paleta) zgłasza się przewoźnikowi w ciągu 7 dni od dostawy. Do zgłoszenia dołącza się zdjęcia i list przewozowy.',
'Dane osobowe klienta z reklamacji przechowuje się przez 12 miesięcy od zamknięcia sprawy. Potem Marek Lis (IT i ochrona danych) usuwa je z rejestru i zostaje sama treść zgłoszenia.',
'Raz w miesiącu obsługa reklamacji przekazuje dyrekcji zakładu zestawienie: liczbę zgłoszeń w każdej kategorii i partie, które pojawiły się więcej niż dwa razy. Zestawienie omawia się na przeglądzie jakości w pierwszy poniedziałek miesiąca.'],[
'Version 5, in force from 1 June 2026. The procedure is owned by Magda Kruk of complaints and customer service. The food safety part is approved by the quality department.',
'Every complaint is answered within 14 days of submission. The deadline counts from the day the message arrived in the complaints inbox, not from the day it was read.',
'Each report gets a number in the complaints register and one category: smell or freshness, damaged can, label or code, product quality, delivery or invoice. When the customer describes several problems, the category with the highest priority is chosen.',
'Reports about smell, a bulging can, hissing on opening or suspected poisoning are treated as a potential food safety hazard. The category of the report does not matter here.',
'In that case secure a sample, record the batch number and pass the case to the quality department within 24 hours. The customer is asked not to throw the can away and not to eat its contents.',
'If the customer does not know the batch number, ask for a photo of the can bottom. Without a batch number the case still goes to the quality department, marked “batch not established”.',
'The customer is offered a refund or a product replacement. A refund up to 200 zł is approved by the complaints officer, higher amounts by the sales manager.',
'Damage caused in transport (a crushed carton, a soaked pallet) is reported to the carrier within 7 days of delivery. Photos and the waybill are attached to the report.',
'The customer’s personal data from a complaint is kept for 12 months after the case is closed. Then Marek Lis (IT and data protection) removes it from the register and only the text of the report stays.',
'Once a month the complaints team gives the plant management a summary: the number of reports in each category and the batches that came up more than twice. The summary is discussed at the quality review on the first Monday of the month.']]},
{id:'PROCES-05',t:['Konserwacja zamykarki','Seamer maintenance'],p:[[
'Wersja 3, obowiązuje od 1 marca 2026. Właścicielką procedury jest Anna Bór z utrzymania ruchu. Procedura dotyczy zamykarek Z-1, Z-2 i Z-3.',
'Zamykarkę smaruje się co 8 godzin pracy smarem dopuszczonym do kontaktu z żywnością (klasa H1). Smarowanie wykonuje operator na początku zmiany i wpisuje je do karty maszyny.',
'Rolki zamykające wymienia się co 500 000 puszek. Stan licznika puszek odczytuje się z panelu zamykarki przy każdym przeglądzie tygodniowym.',
'Wzrost drgań powyżej 4 mm/s oznacza konieczność natychmiastowego przeglądu maszyny. Operator zatrzymuje zamykarkę i wzywa utrzymanie ruchu, nie czeka z tym do końca zmiany.',
'Drgania między 3 a 4 mm/s to stan ostrzegawczy. Zamykarka może pracować, ale utrzymanie ruchu planuje przegląd w ciągu 48 godzin, a szew kontroluje się w tym czasie co 15 minut.',
'Przegląd tygodniowy obejmuje luzy głowic, stan rolek i szczęk oraz szczelność układu smarowania. Zajmuje około 45 minut i wypada w poniedziałek przed pierwszą zmianą.',
'Kalibrację zamykarki wykonuje się raz na kwartał i dokumentuje w karcie maszyny. Po kalibracji dział jakości robi rozbiórkę szwu na 10 puszkach.',
'Krytyczne części zamienne (komplet rolek, szczęki, pasek napędowy) muszą być zawsze w magazynie. Gdy zostaje ostatni komplet, magazynier zamawia następny tego samego dnia.',
'Każdy postój zamykarki dłuższy niż 15 minut wpisuje się do dziennika postojów z przyczyną i czasem trwania. Dziennik przegląda co tydzień kierownik utrzymania ruchu.'],[
'Version 3, in force from 1 March 2026. The procedure is owned by Anna Bór of maintenance. It applies to seamers Z-1, Z-2 and Z-3.',
'The seamer is lubricated every 8 hours of operation with a food-grade lubricant (class H1). The operator lubricates it at the start of the shift and enters it in the machine card.',
'Seaming rollers are replaced every 500,000 cans. The can counter is read from the seamer panel at every weekly service.',
'Vibration above 4 mm/s means the machine must be inspected immediately. The operator stops the seamer and calls maintenance and does not wait for the end of the shift.',
'Vibration between 3 and 4 mm/s is a warning state. The seamer may run, but maintenance plans a service within 48 hours, and during that time the seam is inspected every 15 minutes.',
'The weekly service covers head play, the condition of rollers and chucks and the tightness of the lubrication system. It takes about 45 minutes and falls on Monday before the first shift.',
'The seamer is calibrated once per quarter and this is documented in the machine card. After calibration the quality department does a seam teardown on 10 cans.',
'Critical spare parts (a set of rollers, chucks, the drive belt) must always be in the store. When the last set is left, the storekeeper orders the next one the same day.',
'Every seamer stoppage longer than 15 minutes is entered in the stoppage log with its cause and duration. The maintenance manager reviews the log every week.']]},
{id:'PROCES-06',t:['Wstrzymanie i zwolnienie partii','Batch hold and release'],p:[[
'Wersja 2, obowiązuje od 1 kwietnia 2026. Właścicielem procedury jest Piotr Zielak. Procedura opisuje, co dzieje się z partią, której jakość budzi wątpliwości.',
'Partię może wstrzymać każdy pracownik, który zauważy zagrożenie: wystarczy zgłosić to brygadziście. W ciągu 2 godzin od zgłoszenia partia musi dostać w systemie magazynowym status „WSTRZYMANA”.',
'Wstrzymane palety oznacza się czerwoną etykietą i przewozi do wydzielonej strefy K w magazynie wyrobów gotowych. Palet z tej strefy nie wolno wydawać ani przepakowywać.',
'Jeżeli część partii wyjechała już do klienta, kierownik działu jakości tego samego dnia zawiadamia dyrekcję zakładu i dział sprzedaży. O wycofaniu z rynku decyduje dyrektor zakładu.',
'Dział jakości bada wstrzymaną partię w ciągu 5 dni roboczych. Badanie obejmuje przegląd zapisów (szew, sterylizacja, kod) i próbkę 20 puszek z każdej palety.',
'Partię zwalnia wyłącznie kierownik działu jakości albo jego zastępca, na formularzu F-12 „Decyzja o partii”. Podpis brygadzisty ani kierownika zmiany nie wystarcza.',
'Możliwe są trzy decyzje: zwolnienie, przesortowanie albo utylizacja. Przesortowaną partię bada się ponownie, zanim trafi do sprzedaży.',
'Z każdej wyprodukowanej partii zostawia się 6 puszek jako próbkę archiwalną. Próbki przechowuje się do końca terminu przydatności i jeszcze 3 miesiące dłużej.',
'Po zgłoszeniu wybrzuszonej puszki (bombażu) partię wstrzymuje się zawsze, także gdy chodzi o jedną sztukę. Sprawdza się wtedy również dwie partie sterylizowane tego samego dnia w tej samej retorcie.'],[
'Version 2, in force from 1 April 2026. The procedure is owned by Piotr Zielak. It describes what happens to a batch whose quality is in doubt.',
'Any employee who notices a hazard can put a batch on hold: telling the foreman is enough. Within 2 hours of the report the batch must get the status “ON HOLD” in the warehouse system.',
'Pallets on hold are marked with a red label and moved to the separate zone K in the finished goods warehouse. Pallets from this zone must not be shipped or repacked.',
'If part of the batch has already left for a customer, the quality manager informs the plant management and the sales department the same day. The plant director decides on a market withdrawal.',
'The quality department examines a batch on hold within 5 working days. The examination covers a review of the records (seam, sterilization, code) and a sample of 20 cans from each pallet.',
'A batch is released only by the quality manager or his deputy, on form F-12 “Batch decision”. The signature of a foreman or a shift manager is not enough.',
'Three decisions are possible: release, re-sorting or disposal. A re-sorted batch is examined again before it goes on sale.',
'From every batch produced, 6 cans are kept as a retention sample. Samples are stored until the end of shelf life and 3 months longer.',
'After a report of a bulging can the batch is always put on hold, even when it is about a single can. Two other batches sterilized the same day in the same retort are then checked as well.']]},
{id:'PROCES-07',t:['Mycie i higiena linii','Line cleaning and hygiene'],p:[[
'Wersja 2, obowiązuje od 1 października 2025. Właścicielem procedury jest dział jakości. Procedura dotyczy linii 1–3, od stołu nadawczego do zamykarki.',
'Linię myje się po każdej zmianie w czterech krokach: spłukanie wodą, piana alkaliczna na 10 minut, drugie spłukanie i dezynfekcja. Dozowniki oleju i sosu rozbiera się i myje ręcznie.',
'Raz w tygodniu, w sobotę, wykonuje się mycie kwaśne, które usuwa kamień. Tego dnia nie planuje się produkcji na trzeciej zmianie.',
'Po produkcji szprota w sosie musztardowym obowiązuje mycie alergenowe, bo gorczyca jest alergenem. Zwykłe mycie po zmianie wtedy nie wystarcza.',
'Linię spłukuje się w tym trybie wodą o temperaturze 60°C przez 25 minut i myje pianą dwukrotnie. Dopiero potem można pakować wyrób bez gorczycy.',
'Skuteczność mycia alergenowego potwierdza test paskowy na obecność białka. Wynik dodatni oznacza powtórzenie mycia, a linii nie wolno uruchamiać „na próbę”.',
'Czystość po zwykłym myciu ocenia brygadzista wzrokowo. Dwa razy w tygodniu dział jakości pobiera wymazy z 5 punktów linii.',
'Pracownik myje i dezynfekuje ręce przy każdym wejściu na halę oraz po każdej przerwie. Rękawice zmienia się co 2 godziny albo od razu po uszkodzeniu.',
'Środki myjące przechowuje się w zamkniętej szafie poza halą produkcyjną. Stężenia roztworów podaje karta mycia M-2, która wisi przy każdej linii.'],[
'Version 2, in force from 1 October 2025. The procedure is owned by the quality department. It applies to lines 1–3, from the feed table to the seamer.',
'The line is cleaned after every shift in four steps: a water rinse, alkaline foam for 10 minutes, a second rinse and disinfection. Oil and sauce dosing units are taken apart and washed by hand.',
'Once a week, on Saturday, an acid clean is done to remove scale. No production is planned for the third shift that day.',
'When sprat in mustard sauce has been produced, an allergen clean is required, because the seasoning is an allergen. The normal clean after the shift is then not enough.',
'In this mode the line is rinsed with water at 60°C for 25 minutes and foamed twice. Only then may a product without mustard be packed.',
'The allergen clean is confirmed with a protein strip test. A positive result means the clean is repeated, and the line must not be started “just to try”.',
'Cleanliness after a normal clean is judged visually by the foreman. Twice a week the quality department takes swabs from 5 points on the line.',
'Employees wash and disinfect their hands at every entry to the production hall and after every break. Gloves are changed every 2 hours or straight away when damaged.',
'Cleaning agents are stored in a locked cabinet outside the production hall. Solution strengths are given on cleaning card M-2, which hangs next to every line.']]},
{id:'PROCES-08',t:['Przyjęcie surowca i opakowań','Receiving raw material and packaging'],p:[[
'Wersja 3, obowiązuje od 1 maja 2026. Właścicielem procedury jest dział jakości. Procedura dotyczy dostaw ryb, oleju, pustych puszek i wieczek.',
'Każdą dostawę ryb przyjmuje magazynier razem z kontrolerem jakości. Bez kontrolera rozładunek się nie zaczyna, nawet gdy kierowca się spieszy.',
'Ryba świeża, przywożona w lodzie, musi mieć przy przyjęciu temperaturę od 0 do 2°C mierzoną w mięsie. Dostawę cieplejszą niż 4°C odsyła się bez rozładunku.',
'Ryba mrożona jest dostarczana w blokach po 10 kg. Obowiązuje dla niej inna granica i inny sposób pomiaru niż dla ryby z lodu.',
'Przy przyjęciu bloki muszą mieć temperaturę nie wyższą niż −18°C, mierzoną sondą w nawierconym otworze. Dopuszcza się −15°C, jeśli trwało to krócej niż pół godziny podczas rozładunku.',
'Z każdej dostawy ryb pobiera się próbkę 9 sztuk do badania histaminy. Wynik powyżej 100 mg/kg oznacza odrzucenie całej dostawy.',
'Sprawdza się też dokumenty: handlowy dokument identyfikacyjny, numer statku lub zakładu oraz datę połowu. Dostawy bez daty połowu się nie przyjmuje.',
'Puste puszki i wieczka kontroluje się wyrywkowo, po 50 sztuk z każdej palety. Paleta, na której w próbce jest więcej niż 2 wgniecione puszki, wraca do dostawcy.',
'Przyjęty surowiec dostaje etykietę z datą przyjęcia i numerem dostawy. Rybę świeżą trzeba przerobić w ciągu 18 godzin, a rozmrożoną w ciągu 12 godzin.'],[
'Version 3, in force from 1 May 2026. The procedure is owned by the quality department. It applies to deliveries of fish, oil, empty cans and can ends.',
'Every fish delivery is received by the storekeeper together with a quality inspector. Unloading does not start without the inspector, even when the driver is in a hurry.',
'Fresh fish, delivered on ice, must have a temperature of 0 to 2°C on receipt, measured in the flesh. A delivery warmer than 4°C is sent back without unloading.',
'Frozen fish is delivered in 10 kg blocks. It has a different limit and a different way of measuring than fish on ice.',
'On receipt the blocks must have a temperature no higher than −18°C, measured with a probe in a drilled hole. A reading of −15°C is accepted if it lasted less than half an hour during unloading.',
'A sample of 9 fish is taken from every delivery for a histamine test. A result above 100 mg/kg means the whole delivery is rejected.',
'Documents are checked too: the commercial identification document, the vessel or plant number and the catch date. A delivery without a catch date is not accepted.',
'Empty cans and can ends are checked at random, 50 pieces from each pallet. A pallet with more than 2 dented cans in the sample goes back to the supplier.',
'Accepted raw material gets a label with the receipt date and the delivery number. Fresh fish must be processed within 18 hours, thawed fish within 12 hours.']]}];

// Evaluation set. type: direct (the document's own words), para (a worker's wording), multi (needs two documents),
// version (an archived version gives another value: `bad`), context (the condition sits in a neighbouring paragraph), oos (no answer in the documents).
// `ok` is one pattern or a list that must all match; an answer matching `bad` is wrong. The first six are the example chips.
const RQ=[
 {q:['W jakiej temperaturze sterylizuje się puszki 170 g?','At what temperature are 170 g cans sterilized?'],doc:'PROCES-02',type:'direct',ok:/121/},
